// ----------------------------------------------------------------- Bearbeiten
function upd(art, id, feld, wert){
  const o = art==='kontakt' ? kontaktVon(id)
          : art==='firma'   ? D.firmen.find(f=>f.id===id)
          :                   D.meetings.find(m=>m.id===id);
  if (!o) return;
  if (feld === 'land' && typeof landDeutsch === 'function'){
    const deu = landDeutsch(wert);
    if (deu !== wert){
      wert = deu;
      const e = document.querySelector('#detail [data-f="land"]');
      if (e) e.value = deu;
      toast('Land auf "' + deu + '" vereinheitlicht');
    }
  }
  // Vorher merken, damit der Verlauf sagen kann, von was auf was.
  const vorher = o[feld];
  o[feld] = wert;
  if (art==='kontakt' && typeof verlaufNotieren === 'function' && vorher !== wert){
    if (feld==='vorname' || feld==='nachname')
      verlaufNotieren(o, 'name', (vorher||'(leer)') + ' → ' + (wert||'(leer)'));
    else if (feld==='mail')
      verlaufNotieren(o, 'mail', (vorher||'(leer)') + ' → ' + (wert||'(leer)'));
    else if (feld==='firmaId'){
      const fa = D.firmen.find(x=>x.id===vorher), fn = D.firmen.find(x=>x.id===wert);
      verlaufNotieren(o, 'firma', (fa?fa.name:'(keine Firma)') + ' → ' + (fn?fn.name:'(keine Firma)'));
    }
  }
  if (art==='kontakt' && feld==='firmaId'){
    const f = D.firmen.find(x=>x.id===wert); if (f) o.firma = f.name; else o.firma = '';
    o.abgleichIgnoriert = false;
    ableiten(art, o); persist(); renderList(); renderTabs(); kopfNachziehen(art, o, feld);
    firmaNachfragen(o);
    return;
  }
  if (art==='firma' && feld==='name'){          // Firmenname in allen Personen mitfuehren
    D.kontakte.forEach(k => { if (k.firmaId===o.id){ k.firma = wert; ableiten('kontakt', k); } });
  }
  ableiten(art, o);
  persist(); renderList(); renderTabs(); kopfNachziehen(art, o, feld);
  if (FIRMENFELDER.some(x => x[0] === feld)){
    if (art==='kontakt') abgleichZeichnen(o);
    else if (art==='firma'){
      const b = document.getElementById('dFirma');
      if (b && document.getElementById('detail').dataset.id === o.id) b.innerHTML = abgleichBoxFirma(o);
    }
  }
}

// ---------------------------------------------- abgeleitete Links nachfuehren
const P_LI_PERSON = 'https://www.linkedin.com/search/results/all/?keywords=';
const P_LI_FIRMA  = 'https://www.linkedin.com/search/results/companies/?keywords=';
const P_MAPS      = 'https://www.google.com/maps/search/?api=1&query=';
const auto = (wert, praefix) => !wert || wert.startsWith(praefix);

function liPerson(v, n, fi){
  const q = [v, n, fi].filter(Boolean).join(' ');
  return q ? P_LI_PERSON + encodeURIComponent(q) : '';
}
function liFirma(fi){ return fi ? P_LI_FIRMA + encodeURIComponent(fi) : ''; }
function mapsVon(strasse, plz, ort, land, firma){
  if (!(strasse || ort)) return '';
  const q = [firma, strasse, [plz, ort].filter(Boolean).join(' '), land].filter(Boolean).join(', ');
  return P_MAPS + encodeURIComponent(q);
}

function ableiten(art, o){
  const vorher = {li: o.linkedin, maps: o.maps};
  if (art === 'kontakt'){
    if (!o.linkedinGeprueft && auto(o.linkedin, P_LI_PERSON))
      o.linkedin = liPerson(o.vorname, o.nachname, o.firma);
    if (auto(o.maps, P_MAPS))
      o.maps = mapsVon(o.strasse, o.plz, o.ort, o.land, o.firma);
  } else if (art === 'firma'){
    if (auto(o.linkedin, P_LI_FIRMA)) o.linkedin = liFirma(o.name);
    if (auto(o.maps, P_MAPS)) o.maps = mapsVon(o.strasse, o.plz, o.ort, o.land, o.name);
  } else return;
  // sichtbare Felder der Detailansicht mitziehen
  const box = document.getElementById('detail');
  if (!box || box.dataset.id !== o.id) return;
  if (o.linkedin !== vorher.li){
    const i = box.querySelector('[data-f="linkedin"]'); if (i) i.value = o.linkedin;
  }
  if (o.maps !== vorher.maps){
    const i = box.querySelector('[data-f="maps"]'); if (i) i.value = o.maps;
    const l = document.getElementById('dLinks');
    if (l) l.innerHTML = art==='kontakt' ? linksKontakt(o) : linksFirma(o);
  }
  if (o.linkedin !== vorher.li){
    const l = document.getElementById('dLinks');
    if (l) l.innerHTML = art==='kontakt' ? linksKontakt(o) : linksFirma(o);
  }
}

// Ueberschrift, Unterzeile und Linkleiste der Detailansicht ohne Neuaufbau aktualisieren
const KOPFFELDER = ['titel','vorname','nachname','funktion','firma','firmaId','name','zusatz',
                    'datum','art','ort'];
const LINKFELDER = ['mail','tel','mobil','web','linkedin','linkedinGeprueft','maps','firmaId',
                    'vorname','nachname','titel','name','strasse','plz','ort','land'];
function kopfNachziehen(art, o, feld){
  const t = document.getElementById('dTitel'), u = document.getElementById('dSub');
  if (t && u && KOPFFELDER.includes(feld)){
    if (art==='kontakt'){
      t.textContent = nameVon(o) || '(ohne Name)';
      u.textContent = [o.funktion, o.firma].filter(Boolean).join(' · ');
    } else if (art==='firma'){
      t.textContent = o.name || '(ohne Namen)';
      u.textContent = o.zusatz || '';
    } else {
      t.textContent = o.titel || '(ohne Titel)';
      u.textContent = [o.datum, o.art, o.ort].filter(Boolean).join(' · ');
    }
  }
  const l = document.getElementById('dLinks');
  if (l && LINKFELDER.includes(feld) && art!=='meeting')
    l.innerHTML = art==='kontakt' ? linksKontakt(o) : linksFirma(o);
}
function f(label, art, id, feld, wert, typ, liste){
  const l = liste ? ` list="${liste}"` : '';
  return `<div class="fld"><label>${esc(label)}</label>
    <input type="${typ||'text'}"${l} data-f="${feld}" value="${esc(wert||'')}"
      onchange="upd('${art}','${id}','${feld}',this.value)"></div>`;
}
function ta(label, art, id, feld, wert, hoehe){
  return `<div class="fld"><label>${esc(label)}</label>
    <textarea style="min-height:${hoehe||90}px"
      onchange="upd('${art}','${id}','${feld}',this.value)">${esc(wert||'')}</textarea></div>`;
}
// Auswahlfeld aus einer gepflegten Liste, mit der Möglichkeit direkt einen Eintrag zu ergänzen
function aw(label, art, id, feld, wert, liste){
  const fehlt = wert && !D[liste].includes(wert);
  return `<div class="fld"><label>${esc(label)}</label>
    <select data-f="${feld}" data-liste="${liste}"
        onchange="wahl('${art}','${id}','${feld}','${liste}',this)">
      <option value="">(nicht zugeordnet)</option>
      ${fehlt?`<option value="${esc(wert)}" selected>${esc(wert)} (nicht in der Liste)</option>`:''}
      ${D[liste].map(o=>`<option value="${esc(o)}" ${o===wert?'selected':''}>${esc(o)}</option>`).join('')}
      <option value="__neu">+ neuer Eintrag …</option>
    </select></div>`;
}
function wahl(art, id, feld, liste, el){
  if (el.value !== '__neu'){ upd(art, id, feld, el.value); return; }
  const n = (prompt('Neuer Eintrag in der Liste "'+LISTEN[liste].titel+'":')||'').trim();
  if (!n){ renderDetail(); return; }
  if (!D[liste].includes(n)) D[liste].push(n);
  upd(art, id, feld, n); renderDetail();
}

function datalists(){
  return `<datalist id="dlQuellen">${D.quellen.map(q=>`<option value="${esc(q)}">`).join('')}</datalist>
  <datalist id="dlBereiche">${D.bereiche.map(b=>`<option value="${esc(b)}">`).join('')}</datalist>
  <datalist id="dlLaender">${laenderVorschlag([...D.kontakte, ...D.firmen]).map(l=>`<option value="${esc(l)}">`).join('')}</datalist>
  <datalist id="dlArten">${D.meetingarten.map(a=>`<option value="${esc(a)}">`).join('')}</datalist>
  <datalist id="dlKontakte">${D.kontakte.map(k=>`<option value="${esc(nameVon(k))} [${k.id}]">`).join('')}</datalist>`;
}

// ----------------------------------------------------------------- Detailansichten
function renderDetail(){
  const box = $('#detail');
  const id = tab==='aktionen' ? sel.meetings : sel[tab];
  if (!id){ box.innerHTML = '<div class="empty">Links einen Eintrag auswählen</div>'; return; }
  box.dataset.id = id;
  if (tab==='kontakte') box.innerHTML = detailKontakt(kontaktVon(id));
  else if (tab==='firmen') box.innerHTML = detailFirma(D.firmen.find(x=>x.id===id));
  else if (tab==='listen') box.innerHTML = detailListe(id);
  else box.innerHTML = detailMeeting(D.meetings.find(x=>x.id===id));
}

function linksKontakt(k){
  const fa = firmaVon(k);
  const links = [];
  if (k.mail) links.push(`<a href="mailto:${esc(k.mail)}">Mail</a>`);
  if (k.tel) links.push(`<a href="tel:${esc(k.tel.replace(/[^\d+]/g,''))}">Telefon</a>`);
  if (k.mobil) links.push(`<a href="tel:${esc(k.mobil.replace(/[^\d+]/g,''))}">Mobil</a>`);
  if (k.web) links.push(`<a class="ghost" target="_blank" href="${esc(k.web.startsWith('http')?k.web:'https://'+k.web)}">Website</a>`);
  if (k.linkedin) links.push(`<a class="li ${k.linkedinGeprueft?'':'unsure'}" target="_blank"
      href="${esc(k.linkedin)}">${k.linkedinGeprueft?'LinkedIn':'LinkedIn suchen'}</a>`);
  if (fa && fa.linkedin) links.push(`<a class="li" target="_blank" href="${esc(fa.linkedin)}">LinkedIn Firma</a>`);
  if (k.maps) links.push(`<a class="map" target="_blank" href="${esc(k.maps)}">Google Maps</a>`);
  return links.join('');
}

function linksFirma(fa){
  const links = [];
  if (fa.mail) links.push(`<a href="mailto:${esc(fa.mail)}">Mail</a>`);
  if (fa.tel) links.push(`<a href="tel:${esc(fa.tel.replace(/[^\d+]/g,''))}">Telefon</a>`);
  if (fa.web) links.push(`<a class="ghost" target="_blank" href="${esc(fa.web.startsWith('http')?fa.web:'https://'+fa.web)}">Website</a>`);
  if (fa.linkedin) links.push(`<a class="li" target="_blank" href="${esc(fa.linkedin)}">LinkedIn</a>`);
  if (fa.maps) links.push(`<a class="map" target="_blank" href="${esc(fa.maps)}">Google Maps</a>`);
  return links.join('');
}

// ------------------------------------------------- Abgleich zwischen Firma und ihren Personen
const FIRMENFELDER = [['strasse','Strasse'],['plz','PLZ'],['ort','Ort'],['land','Land'],
                      ['web','Website'],['bereich','Geschäftsbereich']];
const gleich = (a,b) => (a||'').trim().toLowerCase() === (b||'').trim().toLowerCase();

// ---- Mehrere Adressen einer Firma: Varianten sammeln und auswählbar machen
const ADRFELDER = ['strasse','plz','ort','land'];
const adrKey  = o => ADRFELDER.map(f => (o[f]||'').trim().toLowerCase()).join('|');
const adrLeer = o => !((o.strasse||'').trim() || (o.ort||'').trim());
const adrText = v => [v.strasse, [v.plz, v.ort].filter(Boolean).join(' '), v.land]
                     .filter(Boolean).join(', ');
function adressVarianten(fid){
  if (!fid) return [];
  const out = [];
  const add = (o, quelle) => {
    if (adrLeer(o)) return;
    const s = adrKey(o), v = out.find(x => x.key === s);
    if (v){ v.quellen.push(quelle); return; }
    const n = {key:s, quellen:[quelle]};
    ADRFELDER.forEach(f => n[f] = (o[f]||'').trim());
    out.push(n);
  };
  const fa = D.firmen.find(f => f.id === fid);
  if (fa){
    add(fa, 'Firma');
    (fa.standorte||[]).forEach(st => add(st, 'Standort: ' + (st.bez || 'ohne Bezeichnung')));
  }
  D.kontakte.filter(k => k.firmaId === fid).forEach(k => add(k, nameVon(k) || k.id));
  return out;
}
// alle im Firmenordner hinterlegten Adressen: Hauptadresse und Standorte
function bekannteAdressen(fa){
  const out = [];
  if (fa && !adrLeer(fa)) out.push({key:adrKey(fa), bez:'Hauptadresse', o:fa});
  (fa && fa.standorte || []).forEach((st,i) => {
    if (!adrLeer(st)) out.push({key:adrKey(st), bez:st.bez || ('Standort ' + (i+1)), o:st});
  });
  return out;
}
const adresseBekannt = (fa, o) => !adrLeer(o) && bekannteAdressen(fa).some(x => x.key === adrKey(o));
function adrQuellen(v){
  const t = [];
  if (v.quellen.includes('Firma')) t.push('Hauptadresse');
  v.quellen.filter(x => x.startsWith('Standort: ')).forEach(x => t.push(x));
  const p = v.quellen.filter(x => x !== 'Firma' && !x.startsWith('Standort: '));
  if (p.length === 1) t.push(p[0]);
  else if (p.length > 1) t.push(p.length + ' Personen');
  return t.join(', ');
}
function adrListe(varianten, aktuell, knoepfe){
  return `<ul>${varianten.map((v,i) => `<li>
    <b>${esc(adrText(v))}</b>
    <span class="hint">${esc(adrQuellen(v))}</span>
    ${v.key === aktuell ? '<span class="tag ok">aktuell</span>' : knoepfe(v,i)}</li>`).join('')}</ul>`;
}
function adresseAufKontakt(kid, i){
  const k = kontaktVon(kid); if (!k) return;
  const v = adressVarianten(k.firmaId)[i]; if (!v) return;
  ADRFELDER.forEach(f => k[f] = v[f]);
  nachUebernahme(k, ADRFELDER);
  toast('Adresse übernommen');
}
function adresseAufFirma(fid, i){
  const fa = D.firmen.find(x => x.id === fid); if (!fa) return;
  const v = adressVarianten(fid)[i]; if (!v) return;
  ADRFELDER.forEach(f => fa[f] = v[f]);
  ableiten('firma', fa); persist(); render();
  toast('Firmenadresse gesetzt');
}
function adresseAufAlle(fid, i){
  const fa = D.firmen.find(x => x.id === fid); if (!fa) return;
  const v = adressVarianten(fid)[i]; if (!v) return;
  const leute = D.kontakte.filter(k => k.firmaId === fid);
  const betroffen = leute.filter(k => adrKey(k) !== v.key);
  if (!confirm('Adresse\n\n' + adrText(v) + '\n\nbei ' + betroffen.length + ' von ' + leute.length
      + ' Personen und bei der Firma setzen? Abweichende Adressen werden dabei überschrieben.')) return;
  ADRFELDER.forEach(f => fa[f] = v[f]);
  ableiten('firma', fa);
  betroffen.forEach(k => { ADRFELDER.forEach(f => k[f] = v[f]); k.abgleichIgnoriert = false; ableiten('kontakt', k); });
  persist(); render();
  toast('Adresse bei ' + betroffen.length + ' Personen vereinheitlicht');
}

// ---- Standorte im Firmenordner
function standortNeu(fid){
  const fa = D.firmen.find(x => x.id === fid); if (!fa) return;
  fa.standorte = fa.standorte || [];
  fa.standorte.push({bez:'Weiterer Standort', strasse:'', plz:'', ort:'', land:'', maps:''});
  persist(); renderDetail();
}
function standortUpd(fid, i, feld, wert){
  const fa = D.firmen.find(x => x.id === fid); if (!fa) return;
  const st = (fa.standorte||[])[i]; if (!st) return;
  st[feld] = wert;
  if (auto(st.maps, P_MAPS))
    st.maps = mapsVon(st.strasse, st.plz, st.ort, st.land, fa.name);
  persist(); renderDetail();
}
function standortWeg(fid, i){
  const fa = D.firmen.find(x => x.id === fid); if (!fa) return;
  const st = (fa.standorte||[])[i]; if (!st) return;
  if (!confirm('Standort "' + (st.bez||adrText(st)) + '" löschen?')) return;
  fa.standorte.splice(i, 1); persist(); render();
}
function standortAlsHaupt(fid, i){
  const fa = D.firmen.find(x => x.id === fid); if (!fa) return;
  const st = (fa.standorte||[])[i]; if (!st) return;
  if (!confirm('Hauptadresse der Firma auf "' + adrText(st) + '" setzen? '
             + 'Die bisherige Hauptadresse wird als Standort hinterlegt.')) return;
  if (!adrLeer(fa)){
    const alt = {bez:'Bisherige Hauptadresse', maps:''};
    ADRFELDER.forEach(f => alt[f] = fa[f]);
    alt.maps = mapsVon(alt.strasse, alt.plz, alt.ort, alt.land, fa.name);
    fa.standorte.push(alt);
  }
  ADRFELDER.forEach(f => fa[f] = st[f]);
  fa.standorte.splice(i, 1);
  ableiten('firma', fa); persist(); render();
  toast('Hauptadresse gesetzt');
}
function adresseAlsStandort(fid, i){
  const fa = D.firmen.find(x => x.id === fid); if (!fa) return;
  const v = adressVarianten(fid)[i]; if (!v) return;
  if (adresseBekannt(fa, v)) return toast('Diese Adresse ist bereits hinterlegt');
  fa.standorte = fa.standorte || [];
  const st = {bez: v.ort || 'Weiterer Standort', maps:''};
  ADRFELDER.forEach(f => st[f] = v[f]);
  st.maps = mapsVon(st.strasse, st.plz, st.ort, st.land, fa.name);
  fa.standorte.push(st); persist(); render();
  toast('Als Standort hinterlegt');
}
function standorteAusVarianten(fid){
  const fa = D.firmen.find(x => x.id === fid); if (!fa) return;
  const offen = adressVarianten(fid).filter(v => !adresseBekannt(fa, v));
  if (!offen.length) return toast('Alle Adressen sind bereits hinterlegt');
  if (!confirm(offen.length + ' weitere Adresse' + (offen.length>1?'n':'')
             + ' als Standort im Firmenordner hinterlegen?\n\n'
             + offen.map(adrText).join('\n'))) return;
  fa.standorte = fa.standorte || [];
  offen.forEach(v => {
    const st = {bez: v.ort || 'Weiterer Standort', maps:''};
    ADRFELDER.forEach(f => st[f] = v[f]);
    st.maps = mapsVon(st.strasse, st.plz, st.ort, st.land, fa.name);
    fa.standorte.push(st);
  });
  persist(); render();
  toast(offen.length + ' Standorte hinterlegt');
}

function abgleichKontakt(k){
  const fa = k && k.firmaId ? firmaVon(k) : null;
  if (!fa) return null;
  const fehlt = [], anders = [];
  const aufStandort = adresseBekannt(fa, k);       // Person sitzt an einem hinterlegten Standort
  FIRMENFELDER.forEach(([f,l]) => {
    if (aufStandort && ADRFELDER.includes(f)) return;
    const kv = (k[f]||'').trim(), fv = (fa[f]||'').trim();
    if (!fv) return;
    if (!kv) fehlt.push({f, l, wert:fv});
    else if (!gleich(kv, fv)) anders.push({f, l, wert:fv, alt:kv});
  });
  return {fa, fehlt, anders, aufStandort};
}
function abgleichOffen(k){
  const d = abgleichKontakt(k);
  return d ? d.fehlt.length : 0;
}
function abgleichBox(k){
  const d = abgleichKontakt(k);
  if (!d) return '';
  const zeile = o => `<li>${esc(o.l)}: ${o.alt?`<span class="alt">${esc(o.alt)}</span>`:''}
      <b>${esc(o.wert)}</b>
      <button class="btn ghost small" onclick="feldUebernehmen('${k.id}','${o.f}')">übernehmen</button></li>`;
  const teile = [];
  if (d.fehlt.length) teile.push(`
    <b>Bei dieser Person fehlen Angaben, die bei ${esc(d.fa.name)} hinterlegt sind.</b>
    <ul>${d.fehlt.map(zeile).join('')}</ul>
    <div class="knopfe">
      <button class="btn small" onclick="firmaUebernehmen('${k.id}')">Alle fehlenden übernehmen</button>
      <button class="btn ghost small" onclick="abgleichIgnorieren('${k.id}')">Nicht übernehmen</button>
    </div>`);
  if (d.anders.length) teile.push(`
    <b>Weicht von den Firmendaten ab</b>
    <ul>${d.anders.map(zeile).join('')}</ul>
    <p class="hint">Abweichungen bleiben bestehen, solange du sie nicht übernimmst.
      Eine eigene Adresse einer Person ist damit erlaubt.</p>`);
  const varianten = adressVarianten(k.firmaId);
  if (varianten.length > 1){
    const jetzt = adrLeer(k) ? '' : adrKey(k);
    teile.push(`
      <b>Bei ${esc(d.fa.name)} gibt es ${varianten.length} verschiedene Adressen. Bitte auswählen.</b>
      ${adrListe(varianten, jetzt, (v,i) =>
        `<button class="btn ghost small" onclick="adresseAufKontakt('${k.id}',${i})">diese übernehmen</button>`)}
      <p class="hint">Die gewählte Adresse ersetzt Strasse, PLZ, Ort und Land bei dieser Person.</p>`);
  }
  if (!teile.length) return '';
  if (k.abgleichIgnoriert && !d.anders.length && varianten.length < 2) return '';
  return `<div class="box">${teile.join('')}</div>`;
}
function abgleichZeichnen(k){
  const b = document.getElementById('dFirma');
  if (b) b.innerHTML = abgleichBox(k);
}
function feldUebernehmen(id, feld){
  const k = kontaktVon(id), d = abgleichKontakt(k); if (!d) return;
  k[feld] = (d.fa[feld]||'').trim();
  nachUebernahme(k, feld);
}
function firmaUebernehmen(id){
  const k = kontaktVon(id), d = abgleichKontakt(k); if (!d) return;
  d.fehlt.forEach(o => k[o.f] = o.wert);
  nachUebernahme(k, d.fehlt.map(o=>o.f));
  toast(d.fehlt.length + ' Angaben von der Firma übernommen');
}
function nachUebernahme(k, felder){
  k.abgleichIgnoriert = false;
  ableiten('kontakt', k); persist(); renderList();
  const box = document.getElementById('detail');
  if (box && box.dataset.id === k.id)
    [].concat(felder).forEach(f => {
      const i = box.querySelector('[data-f="'+f+'"]');
      if (i) i.value = k[f] || '';
    });
  abgleichZeichnen(k);
}
function abgleichIgnorieren(id){
  const k = kontaktVon(id); if (!k) return;
  k.abgleichIgnoriert = true; persist(); abgleichZeichnen(k);
}
// Beim Zuordnen einer Firma direkt nachfragen
function firmaNachfragen(k){
  const d = abgleichKontakt(k);
  if (!d) return;
  const mehrere = adressVarianten(k.firmaId).length > 1;
  const fehlt = mehrere ? d.fehlt.filter(o => !ADRFELDER.includes(o.f)) : d.fehlt;
  if (fehlt.length){
    const txt = fehlt.map(o => o.l + ': ' + o.wert).join('\n');
    if (confirm('Bei ' + d.fa.name + ' sind folgende Angaben hinterlegt, die bei dieser Person fehlen:\n\n'
                + txt + '\n\nJetzt übernehmen?')){
      fehlt.forEach(o => k[o.f] = o.wert);
      k.abgleichIgnoriert = false;
      ableiten('kontakt', k);
    } else k.abgleichIgnoriert = true;
  }
  persist(); renderDetail(); renderList();
  if (mehrere && d.fehlt.some(o => ADRFELDER.includes(o.f)))
    toast('Mehrere Adressen hinterlegt, bitte im Hinweisfeld auswählen');
}

// Gegenrichtung: was die Firma von ihren Personen lernen kann
function abgleichFirma(fa){
  const leute = D.kontakte.filter(k => k.firmaId === fa.id);
  const vorschlag = [], abweichend = [];
  FIRMENFELDER.forEach(([f,l]) => {
    const werte = [...new Set(leute.map(k => (k[f]||'').trim()).filter(Boolean))];
    if (!(fa[f]||'').trim()){
      if (werte.length) vorschlag.push({f, l, wert:werte[0], mehrere:werte.length>1, alle:werte});
    } else {
      const roh = ADRFELDER.includes(f)
        ? leute.filter(k => !adresseBekannt(fa, k)).map(k => (k[f]||'').trim()).filter(Boolean)
        : werte;
      const ab = [...new Set(roh)].filter(w => !gleich(w, fa[f]));
      if (ab.length) abweichend.push({f, l, alle:ab});
    }
  });
  const luecken = leute.reduce((n,k) => n + abgleichOffen(k), 0);
  return {leute, vorschlag, abweichend, luecken};
}
function abgleichBoxFirma(fa){
  const d = abgleichFirma(fa);
  if (d.leute.length < 1) return '';
  const teile = [];
  if (d.vorschlag.length) teile.push(`
    <b>Diese Firmenfelder sind leer, bei den Personen aber vorhanden.</b>
    <ul>${d.vorschlag.map(o=>`<li>${esc(o.l)}:
      ${o.mehrere
        ? `<select id="fw_${o.f}" style="padding:4px 6px;border:1px solid var(--line);border-radius:5px">
             ${o.alle.map(w=>`<option value="${esc(w)}">${esc(w)}</option>`).join('')}
           </select>
           <span class="hint">${o.alle.length} verschiedene Werte</span>`
        : `<b>${esc(o.wert)}</b>`}
      <button class="btn ghost small" onclick="firmaFeldVonPersonen('${fa.id}','${o.f}')">übernehmen</button></li>`).join('')}</ul>`);
  if (d.abweichend.length) teile.push(`
    <b>Personen mit abweichenden Angaben</b>
    <ul>${d.abweichend.map(o=>`<li>${esc(o.l)}:
      ${o.alle.length>1
        ? `<select id="fa_${o.f}" style="padding:4px 6px;border:1px solid var(--line);border-radius:5px">
             ${o.alle.map(w=>`<option value="${esc(w)}">${esc(w)}</option>`).join('')}</select>`
        : `<b>${esc(o.alle[0])}</b>`}
      <button class="btn ghost small" onclick="firmaFeldErsetzen('${fa.id}','${o.f}')">als Firmenwert setzen</button></li>`).join('')}</ul>`);
  if (d.luecken) teile.push(`
    <b>${d.luecken} fehlende Angaben bei ${d.leute.length} Person${d.leute.length>1?'en':''}.</b>
    <div class="knopfe" style="margin-top:6px">
      <button class="btn small" onclick="firmaAufAlle('${fa.id}')">Firmendaten auf alle Personen übertragen</button>
    </div>
    <p class="hint">Es werden nur leere Felder gefüllt, vorhandene Angaben bleiben unverändert.</p>`);
  const varianten = adressVarianten(fa.id);
  if (varianten.length > 1) teile.unshift(`
    <b>${varianten.length} verschiedene Adressen bei dieser Firma</b>
    ${adrListe(varianten, adrLeer(fa) ? '' : adrKey(fa), (v,i) =>
      `${adresseBekannt(fa, v) ? '<span class="tag">hinterlegt</span>'
        : `<button class="btn small" onclick="adresseAlsStandort('${fa.id}',${i})">als Standort hinterlegen</button>`}
       <button class="btn ghost small" onclick="adresseAufFirma('${fa.id}',${i})">als Hauptadresse</button>
       <button class="btn ghost small" onclick="adresseAufAlle('${fa.id}',${i})">für alle setzen</button>`)}
    <div class="knopfe"><button class="btn small"
        onclick="standorteAusVarianten('${fa.id}')">Alle noch nicht hinterlegten als Standorte übernehmen</button></div>
    <p class="hint">Hinterlegte Standorte stehen in jedem Kontakt dieser Firma zur Auswahl und gelten
      nicht mehr als Abweichung. "Für alle setzen" vereinheitlicht Firma und alle Personen.</p>`);
  if (!teile.length)
    return `<div class="box gleich"><b>Firmendaten und alle ${d.leute.length}
      zugeordneten Personen stimmen überein.</b></div>`;
  return `<div class="box">${teile.join('')}</div>`;
}
function firmaFeldVonPersonen(fid, feld){
  const fa = D.firmen.find(x=>x.id===fid); if (!fa) return;
  const d = abgleichFirma(fa), o = d.vorschlag.find(x=>x.f===feld); if (!o) return;
  const s = document.getElementById('fw_' + feld);
  fa[feld] = (s && s.value) ? s.value : o.wert;
  ableiten('firma', fa); persist(); render();
  toast('Firmendaten ergänzt');
}
function firmaFeldErsetzen(fid, feld){
  const fa = D.firmen.find(x=>x.id===fid); if (!fa) return;
  const d = abgleichFirma(fa), o = d.abweichend.find(x=>x.f===feld); if (!o) return;
  const s = document.getElementById('fa_' + feld);
  const wert = (s && s.value) ? s.value : o.alle[0];
  if (!confirm('Firmenwert für ' + o.l + ' von "' + (fa[feld]||'') + '" auf "' + wert + '" ändern?')) return;
  fa[feld] = wert; ableiten('firma', fa); persist(); render();
  toast('Firmenwert geändert');
}
function firmaAufAlle(fid){
  const fa = D.firmen.find(x=>x.id===fid); if (!fa) return;
  const leute = D.kontakte.filter(k => k.firmaId === fid);
  let n = 0, p = 0;
  leute.forEach(k => {
    const d = abgleichKontakt(k); if (!d || !d.fehlt.length) return;
    p++; n += d.fehlt.length;
  });
  if (!n) return toast('Nichts zu übertragen');
  if (!confirm(n + ' fehlende Angaben bei ' + p + ' Person' + (p>1?'en':'') + ' aus den Firmendaten füllen?')) return;
  leute.forEach(k => {
    const d = abgleichKontakt(k); if (!d) return;
    d.fehlt.forEach(o => k[o.f] = o.wert);
    k.abgleichIgnoriert = false;
    ableiten('kontakt', k);
  });
  persist(); render(); toast(n + ' Angaben übertragen');
}

// ---------------------------------------------------- Kontakt als geprüft und bestätigt markieren
const unsicher = k => ['titel','vorname','nachname','funktion','firma'].some(f => (k[f]||'').includes('(?)'));
function pruefLeiste(k){
  const teile = [];
  if (k.geprueft)
    teile.push(`<span class="tag ok">✓ geprüft und bestätigt${k.geprueftAm?' am '+esc(k.geprueftAm):''}</span>
      <button class="btn ghost small" onclick="pruefen('${k.id}',false)">Prüfung zurücknehmen</button>`);
  else
    teile.push(`<button class="btn green small" onclick="pruefen('${k.id}',true)">Kontakt geprüft und bestätigen</button>
      <span class="hint">noch nicht bestätigt</span>`);
  if (unsicher(k))
    teile.push(`<span class="tag off">Name enthält noch (?)</span>
      <button class="btn warn small" onclick="fragezeichenWeg('${k.id}')">(?) entfernen</button>`);
  return `<div class="links" style="align-items:center">${teile.join(' ')}</div>`;
}
function pruefen(id, ja){
  const k = kontaktVon(id); if (!k) return;
  k.geprueft = !!ja;
  k.geprueftAm = ja ? heute() : '';
  persist(); renderList();
  const p = document.getElementById('dPruef'); if (p) p.innerHTML = pruefLeiste(k);
  toast(ja ? 'Kontakt als geprüft bestätigt' : 'Prüfung zurückgenommen');
}
function fragezeichenWeg(id){
  const k = kontaktVon(id); if (!k) return;
  ['titel','vorname','nachname','funktion','firma'].forEach(f =>
    { if (k[f]) k[f] = k[f].replace(/\s*\(\?\)/g, '').trim(); });
  const fa = k.firmaId ? D.firmen.find(x=>x.id===k.firmaId) : null;
  if (fa && fa.name.includes('(?)')){
    fa.name = fa.name.replace(/\s*\(\?\)/g,'').trim();
    ableiten('firma', fa);
    D.kontakte.forEach(x => { if (x.firmaId===fa.id){ x.firma = fa.name; ableiten('kontakt', x); } });
  }
  ableiten('kontakt', k); persist(); render();
  toast('Unsicherheitszeichen entfernt');
}

// ----------------------------------------------------------------- Aktionen und Zuordnung
function aktion(mid, i, feld, wert){
  const m = D.meetings.find(x=>x.id===mid); m.aktionen[i][feld] = wert;
  persist(); renderTabs(); renderList();
}
function aktionNeu(mid){
  const m = D.meetings.find(x=>x.id===mid);
  m.aktionen.push({text:'', wer:'', faellig:'', erledigt:false});
  persist(); renderDetail(); renderTabs();
}
function aktionWeg(mid, i){
  const m = D.meetings.find(x=>x.id===mid); m.aktionen.splice(i,1);
  persist(); renderDetail(); renderTabs(); renderList();
}
function kontaktZuMeeting(mid){
  const v = $('#kadd').value.trim(); if (!v) return;
  const mm = v.match(/\[(K\d+)\]$/);
  let k = mm ? kontaktVon(mm[1])
            : D.kontakte.find(x=>nameVon(x).toLowerCase() === v.toLowerCase());
  if (!k){ alert('Person nicht gefunden. Bitte aus der Vorschlagsliste wählen.'); return; }
  const m = D.meetings.find(x=>x.id===mid);
  if (!m.kontaktIds.includes(k.id)) m.kontaktIds.push(k.id);
  if (!m.firmaId && k.firmaId) m.firmaId = k.firmaId;
  persist(); renderDetail(); renderList();
}
function kontaktAusMeeting(mid, kid){
  const m = D.meetings.find(x=>x.id===mid);
  m.kontaktIds = m.kontaktIds.filter(x=>x!==kid);
  persist(); renderDetail(); renderList();
}
function protokollKopieren(mid){
  const m = D.meetings.find(x=>x.id===mid);
  const fa = D.firmen.find(x=>x.id===m.firmaId);
  const pers = (m.kontaktIds||[]).map(id=>{const k=kontaktVon(id);return k?nameVon(k):'';}).filter(Boolean);
  const t = [
    'Meetingprotokoll: ' + (m.titel||''),
    'Datum: ' + (m.datum||'') + (m.art?('   Art: '+m.art):'') + (m.ort?('   Ort: '+m.ort):''),
    fa?('Firma: '+fa.name):'',
    pers.length?('Personen: '+pers.join(', ')):'',
    m.teilnehmer?('Weitere Teilnehmer: '+m.teilnehmer):'',
    '', (m.notizen||''), '',
    (m.aktionen||[]).length?'Aktionen:':'',
    ...(m.aktionen||[]).map(a=>'- ['+(a.erledigt?'x':' ')+'] '+(a.text||'')
      +(a.wer?(' ('+a.wer+')'):'')+(a.faellig?(' bis '+a.faellig):''))
  ].filter(x=>x!==''||true).join('\n');
  navigator.clipboard.writeText(t).then(()=>toast('Protokoll in die Zwischenablage kopiert'),
    ()=>alert(t));
}

function neuesMeeting(art, id){

    firmaId:'', kontaktIds:[], notizen:'', aktionen:[], bilder:[], erstelltAm:heute()};
  if (art==='kontakt'){ const k=kontaktVon(id); m.kontaktIds=[id]; m.firmaId=k?k.firmaId:''; }

  D.meetings.push(m); persist(); tab='meetings'; sel.meetings=m.id; render();

function loeschen(art, id){
  if (!confirm('Wirklich löschen?')) return;
  if (art==='kontakt'){
    D.kontakte = D.kontakte.filter(x=>x.id!==id);
    D.meetings.forEach(m=>m.kontaktIds = (m.kontaktIds||[]).filter(x=>x!==id));
    sel.kontakte=null;
  } else if (art==='firma'){
    D.firmen = D.firmen.filter(x=>x.id!==id);
    D.kontakte.forEach(k=>{ if(k.firmaId===id) k.firmaId=''; });
    D.meetings.forEach(m=>{ if(m.firmaId===id) m.firmaId=''; });
    sel.firmen=null;
  } else { D.meetings = D.meetings.filter(x=>x.id!==id); sel.meetings=null; }
  persist(); render();
}

// ================================================================= Dubletten und Zusammenfuehren
// Zwei Teile: eine Suche, die Verdachtspaare vorschlaegt, und ein Dialog, in dem
// je Feld entschieden wird, welcher Wert bleibt. Der aufgeloeste Datensatz wird
// geloescht, vorher wandern Protokolle, Karten- und Fotobilder auf den
// Hauptdatensatz. Das letzte Zusammenfuehren laesst sich rueckgaengig machen.

const ZF = {paare: [], haupt: null, zweit: null, wahl: {}, zurueck: null};

const ZF_FELDER = [
  ['titel', 'Titel'], ['vorname', 'Vorname'], ['nachname', 'Nachname'],
  ['funktion', 'Funktion'], ['firmaId', 'Firma'], ['firmaZusatz', 'Firmenzusatz'],
  ['strasse', 'Strasse'], ['plz', 'PLZ'], ['ort', 'Ort'], ['land', 'Land'],
  ['tel', 'Telefon'], ['mobil', 'Mobil'], ['fax', 'Fax'], ['mail', 'Mail'],
  ['web', 'Web'], ['linkedin', 'LinkedIn'], ['maps', 'Karte'],
  ['bereich', 'Bereich'], ['quelle', 'Quelle'], ['erfasstAm', 'Erfasst am'],
  ['kennengelerntAm', 'Kennengelernt am'], ['geburtstag', 'Geburtstag'],
  ['logo', 'Logo'], ['details', 'Details'], ['kommentar', 'Kommentar']
];
// Bei diesen Feldern ist "beide" sinnvoll, weil es Fliesstext ist.
const ZF_BEIDE = {details: 1, kommentar: 1};

// Umlaute, Bindestriche und Leerzeichen weg, damit "Mueller" und "Müller"
// als derselbe Name erkannt werden.
function zfNorm(s){
  // Reihenfolge ist entscheidend: NFD zerlegt ü in u plus Trema, und das
  // Trema faellt danach weg. Dann stuende "muller" gegen "mueller", und
  // Zuercher gegen Zürcher waere nie als Paar aufgefallen. Darum erst die
  // deutsche Umschrift, dann die Zerlegung fuer alle uebrigen Akzente.
  return (s == null ? '' : String(s)).toLowerCase()
    .replace(/ä/g, 'ae').replace(/ö/g, 'oe').replace(/ü/g, 'ue').replace(/ß/g, 'ss')
    .replace(/ø/g, 'o').replace(/æ/g, 'ae').replace(/ł/g, 'l')
    .replace(/đ/g, 'd').replace(/ð/g, 'd').replace(/þ/g, 'th')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]/g, '');
}

function zfMail(k){ return (k.mail || '').trim().toLowerCase(); }
function zfPaarId(a, b){ return [a.id, b.id].sort().join('|'); }

// Sammeladressen wie info@ oder sales@ tragen keinen Personennamen. Ihr "Name"
// ist aus der Adresse abgeleitet und daher bei hunderten Firmen derselbe. Beim
// Namensvergleich bleiben sie darum aussen vor, sonst passt jede info-Adresse
// zu jeder anderen. Ueber die Mailadresse werden sie weiterhin gefunden.
const ZF_SAMMEL = new Set(['info', 'office', 'kontakt', 'contact', 'contacts', 'sales',
  'vertrieb', 'verkauf', 'einkauf', 'purchasing', 'service', 'support', 'hello', 'hallo',
  'team', 'mail', 'email', 'anfrage', 'enquiry', 'inquiry', 'order', 'orders', 'auftrag',
  'empfang', 'reception', 'technik', 'technical', 'engineering', 'buchhaltung', 'accounting',
  'rechnung', 'invoice', 'hr', 'jobs', 'presse', 'press', 'marketing', 'welcome', 'admin',
  'logistik', 'versand', 'shipping', 'export', 'zoll', 'customs', 'qs', 'qm', 'it', 'edv']);

function zfKeinSammel(k){
  const lokal = zfMail(k).split('@')[0].replace(/[._-].*$/, '');
  return !ZF_SAMMEL.has(lokal);
}
// Fuer den Vergleich ueber den vollen Namen braucht es Vor- und Nachnamen.
function zfNameTaugt(k){
  return !!zfNorm(k.vorname) && !!zfNorm(k.nachname) && zfKeinSammel(k);
}

// ----------------------------------------------------------------- Suche
function dublettenSuchen(){
  D.dublettenIgnoriert ||= [];
  const weg = new Set(D.dublettenIgnoriert);
  const gefunden = new Map();
  const nimm = (a, b, rang, grund) => {
    const id = zfPaarId(a, b);
    if (weg.has(id)) return;
    const alt = gefunden.get(id);
    if (alt && alt.rang <= rang) return;
    gefunden.set(id, {a, b, rang, grund});
  };

  // Die Namen werden einmal normalisiert, nicht in jedem Vergleich erneut.
  const nachMail = new Map(), nachName = new Map(), nachNachname = new Map();
  const norm = new Map();
  const lege = (m, s, k) => { let a = m.get(s); if (!a) m.set(s, a = []); a.push(k); };
  D.kontakte.forEach(k => {
    const v = zfNorm(k.vorname), n = zfNorm(k.nachname), m = zfMail(k);
    const taugt = zfNameTaugt(k);
    norm.set(k.id, {v, n, taugt});
    if (m) lege(nachMail, m, k);
    if (taugt) lege(nachName, v + '|' + n, k);
    // Beim Nachnamen in derselben Firma darf der Vorname fehlen, sonst faende
    // man "Slatter" neben "Dr. Rolf Slatter" nicht.
    if (n && zfKeinSammel(k)) lege(nachNachname, n, k);
  });

  // 1) gleiche Mailadresse
  nachMail.forEach(arr => { for (let i = 0; i < arr.length; i++)
    for (let j = i + 1; j < arr.length; j++) nimm(arr[i], arr[j], 1, 'gleiche Mailadresse'); });

  // 2) gleicher Vor- und Nachname
  nachName.forEach(arr => { for (let i = 0; i < arr.length; i++)
    for (let j = i + 1; j < arr.length; j++) nimm(arr[i], arr[j], 2, 'gleicher Name'); });

  // 3) gleicher Nachname bei gleicher Firma, Vorname faengt gleich an
  // 4) Vor- und Nachname vertauscht, haeufig bei Namen aus der Mailadresse
  nachNachname.forEach(arr => {
    for (let i = 0; i < arr.length; i++) for (let j = i + 1; j < arr.length; j++){
      const a = arr[i], b = arr[j];
      if (!a.firmaId || a.firmaId !== b.firmaId) continue;
      const va = norm.get(a.id).v, vb = norm.get(b.id).v;
      if (va && vb && va[0] === vb[0])
        nimm(a, b, 3, 'gleicher Nachname in derselben Firma');
      else if (!va || !vb)
        nimm(a, b, 3, 'gleicher Nachname in derselben Firma, ein Vorname fehlt');
    }
  });

  // 4) Vorname und Nachname vertauscht. Kommt haeufig vor, wenn der Name aus
  // einer Adresse der Form nachname.vorname@ abgeleitet wurde.
  D.kontakte.forEach(a => {
    const {v, n, taugt} = norm.get(a.id);
    if (!taugt || v === n) return;
    (nachName.get(n + '|' + v) || []).forEach(b => {
      if (a.id < b.id) nimm(a, b, 2, 'Vor- und Nachname vertauscht');
    });
  });

  ZF.paare = [...gefunden.values()].sort((x, y) => x.rang - y.rang ||
    nameVon(x.a).localeCompare(nameVon(y.a)));
  dublettenZeigen();
}

function dublettenZeigen(){
  const alt = document.getElementById('zfListe'); if (alt) alt.remove();
  const d = document.createElement('div');
  d.id = 'zfListe'; d.className = 'modal';
  const zurueck = ZF.zurueck
    ? `<button class="btn ghost small" onclick="zusammenfuehrenZurueck()">Letztes
         Zusammenführen rückgängig</button>` : '';
  const zeilen = ZF.paare.length ? ZF.paare.map(p => `
    <div class="zfzeile">
      <div class="zfgrund">${esc(p.grund)}</div>
      <div class="zfnamen">
        <span>${esc(nameVon(p.a))}<i>${esc(p.a.firma || '')} ${esc(p.a.mail || '')}</i></span>
        <span>${esc(nameVon(p.b))}<i>${esc(p.b.firma || '')} ${esc(p.b.mail || '')}</i></span>
      </div>
      <div class="zfknoepfe">
        <button class="btn small" onclick="zusammenfuehrenDialog('${p.a.id}','${p.b.id}')">
          Zusammenführen …</button>
        <button class="btn ghost small" onclick="dublettePasst('${p.a.id}','${p.b.id}')">
          Kein Duplikat</button>
      </div>
    </div>`).join('')
    : '<p class="hint">Keine Verdachtsfälle gefunden.</p>';
  d.innerHTML = `<div class="modalbox breit">
    <h3>Mögliche Dubletten</h3>
    <p class="hint">${ZF.paare.length} Paare. Verglichen werden Mailadresse, Name,
      gleicher Nachname in derselben Firma und vertauschter Vor- und Nachname.
      "Kein Duplikat" merkt sich das Paar dauerhaft.</p>
    <div class="zfliste">${zeilen}</div>
    <div class="knopfe" style="margin-top:12px">
      ${zurueck}
      <button class="btn ghost" onclick="document.getElementById('zfListe').remove()">
        Schliessen</button>
    </div>
  </div>`;
  document.body.appendChild(d);
}

function dublettePasst(ida, idb){
  D.dublettenIgnoriert ||= [];
  const id = [ida, idb].sort().join('|');
  if (!D.dublettenIgnoriert.includes(id)) D.dublettenIgnoriert.push(id);
  ZF.paare = ZF.paare.filter(p => zfPaarId(p.a, p.b) !== id);
  persist(); dublettenZeigen();
}

// ----------------------------------------------------------------- Dialog
function zusammenfuehrenAuswahl(){
  const ids = [...auswahl];
  if (ids.length !== 2) return toast('Bitte genau zwei Kontakte markieren');
  zusammenfuehrenDialog(ids[0], ids[1]);
}

function zfAnzeige(k, feld){
  if (feld === 'firmaId'){
    const f = firmaVon(k);
    return f ? f.name : (k.firma || '');
  }
  return k[feld] == null ? '' : String(k[feld]);
}

function zusammenfuehrenDialog(ida, idb){
  if (ida === idb) return toast('Das ist derselbe Kontakt');
  const a = kontaktVon(ida), b = kontaktVon(idb);
  if (!a || !b) return toast('Kontakt nicht gefunden');
  ZF.haupt = a; ZF.zweit = b; ZF.wahl = {};
  ZF_FELDER.forEach(([f]) => { ZF.wahl[f] = zfAnzeige(a, f) ? 'a' : (zfAnzeige(b, f) ? 'b' : 'a'); });
  zfDialogZeichnen();
}

function zfHauptTauschen(){
  const h = ZF.haupt; ZF.haupt = ZF.zweit; ZF.zweit = h;
  const um = {a: 'b', b: 'a', beide: 'beide'};
  Object.keys(ZF.wahl).forEach(f => ZF.wahl[f] = um[ZF.wahl[f]]);
  zfDialogZeichnen();
}

function zfWaehlen(feld, seite){ ZF.wahl[feld] = seite; zfDialogZeichnen(); }

function zfDialogZeichnen(){
  const alt = document.getElementById('zfDialog'); if (alt) alt.remove();
  const a = ZF.haupt, b = ZF.zweit;
  const knopf = (f, seite, txt) => {
    const aktiv = ZF.wahl[f] === seite;
    return `<button type="button" class="zfwert ${aktiv ? 'an' : ''}"
      onclick="zfWaehlen('${f}','${seite}')">${txt ? esc(txt) : '<i>leer</i>'}</button>`;
  };
  const zeilen = ZF_FELDER.map(([f, label]) => {
    const va = zfAnzeige(a, f), vb = zfAnzeige(b, f);
    if (!va && !vb) return '';
    if (va === vb) return `<tr class="gleich"><th>${esc(label)}</th>
      <td colspan="2">${esc(va)}</td></tr>`;
    const dritte = ZF_BEIDE[f] && va && vb
      ? `<button type="button" class="zfwert klein ${ZF.wahl[f] === 'beide' ? 'an' : ''}"
           onclick="zfWaehlen('${f}','beide')">beide untereinander</button>` : '';
    return `<tr><th>${esc(label)}</th>
      <td>${knopf(f, 'a', va)}</td><td>${knopf(f, 'b', vb)}${dritte}</td></tr>`;
  }).join('');

  const karten = [...new Set([...(a.karten || []), ...(b.karten || [])])];
  const fotos = [...new Set([...(a.fotos || []), ...(b.fotos || [])])];
  const prot = D.meetings.filter(m => (m.kontaktIds || []).includes(b.id)).length;

  const d = document.createElement('div');
  d.id = 'zfDialog'; d.className = 'modal';
  d.innerHTML = `<div class="modalbox breit">
    <h3>Kontakte zusammenführen</h3>
    <p class="hint">Links der Hauptdatensatz, er bleibt bestehen. Rechts der Datensatz,
      der danach gelöscht wird. Je Zeile den Wert anklicken, der bleiben soll.</p>
    <table class="zftab">
      <tr class="kopf"><th></th>
        <td><b>${esc(nameVon(a))}</b><br><i>${esc(a.id)}, bleibt</i></td>
        <td><b>${esc(nameVon(b))}</b><br><i>${esc(b.id)}, wird gelöscht</i>
          <br><button type="button" class="zfwert klein" onclick="zfHauptTauschen()">
            Seiten tauschen</button></td></tr>
      ${zeilen}
    </table>
    <p class="hint" style="margin-top:10px">
      Wandern mit auf ${esc(a.id)}: ${prot} Protokolle, ${karten.length} Kartenbilder,
      ${fotos.length} Fotos. Markierung als Favorit und der Vermerk "nicht abgleichen"
      bleiben erhalten, wenn einer der beiden sie trägt.</p>
    <div class="knopfe" style="margin-top:12px">
      <button class="btn" onclick="zusammenfuehrenAusfuehren()">Zusammenführen</button>
      <button class="btn ghost" onclick="document.getElementById('zfDialog').remove()">
        Abbrechen</button>
    </div>
  </div>`;
  document.body.appendChild(d);
}

// ----------------------------------------------------------------- Ausfuehren
function zusammenfuehrenAusfuehren(){
  // Zwischen dem Oeffnen des Dialogs und hier kann der Bestand ausgetauscht
  // worden sein, etwa weil das Laden aus OneDrive fertig wurde. Dann zeigen
  // ZF.haupt und ZF.zweit auf Datensaetze, die so nicht mehr im Bestand
  // stehen, und das Zusammenfuehren ginge ins Leere. Darum beide ueber die
  // Nummer neu holen.
  const a = ZF.haupt && kontaktVon(ZF.haupt.id);
  const b = ZF.zweit && kontaktVon(ZF.zweit.id);
  if (!a || !b){
    const weg = document.getElementById('zfDialog'); if (weg) weg.remove();
    return toast('Der Bestand hat sich geaendert, bitte neu auswaehlen');
  }
  if (a.id === b.id) return toast('Das ist derselbe Kontakt');
  ZF.haupt = a; ZF.zweit = b;
  if (!confirm(nameVon(b) + ' (' + b.id + ') wird gelöscht. Fortfahren?')) return;

  // Fuer das Rueckgaengigmachen den Stand vorher sichern
  ZF.zurueck = {
    haupt: JSON.parse(JSON.stringify(a)),
    zweit: JSON.parse(JSON.stringify(b)),
    platz: D.kontakte.indexOf(b),
    meetings: D.meetings.filter(m => (m.kontaktIds || []).includes(b.id))
                        .map(m => ({id: m.id, ids: [...m.kontaktIds]}))
  };

  ZF_FELDER.forEach(([f]) => {
    const va = zfAnzeige(a, f), vb = zfAnzeige(b, f);
    const w = ZF.wahl[f];
    if (f === 'firmaId'){
      if (w === 'b'){ a.firmaId = b.firmaId; a.firma = b.firma; }
      return;
    }
    if (w === 'b') a[f] = b[f];
    else if (w === 'beide') a[f] = [va, vb].filter(Boolean).join('\n');
  });

  a.karten = [...new Set([...(a.karten || []), ...(b.karten || [])])];
  a.fotos = [...new Set([...(a.fotos || []), ...(b.fotos || [])])];
  a.favorit = !!(a.favorit || b.favorit);
  a.abgleichIgnoriert = !!(a.abgleichIgnoriert || b.abgleichIgnoriert);
  // "Geprueft" gilt nur weiter, wenn es fuer beide galt. Sonst stuende ein
  // Datensatz als geprueft da, in dem ungepruefte Werte stecken.
  if (a.geprueft && !b.geprueft){ a.geprueft = false; a.geprueftAm = ''; }
  if (ZF.wahl.linkedin === 'b') a.linkedinGeprueft = !!b.linkedinGeprueft;
  a.details = ((a.details || '') + '\nZusammengeführt aus ' + b.id + ' am ' + heute() + '.').trim();
  if (typeof verlaufNotieren === 'function')
    verlaufNotieren(a, 'zusammengefuehrt', 'Aus ' + b.id + ' ' + (nameVon(b) || '') + ' übernommen');

  // Kam die Anschrift vom zweiten Datensatz, zeigte der Kartenlink sonst
  // weiter auf die alte Adresse.
  if (['strasse', 'plz', 'ort', 'land'].some(f => ZF.wahl[f] === 'b')
      && ZF.wahl.maps !== 'b' && typeof mapsVon === 'function')
    a.maps = mapsVon(a.strasse, a.plz, a.ort, a.land, a.firma);

  D.meetings.forEach(m => {
    if (!(m.kontaktIds || []).includes(b.id)) return;
    m.kontaktIds = [...new Set(m.kontaktIds.map(x => x === b.id ? a.id : x))];
  });

  D.kontakte = D.kontakte.filter(k => k.id !== b.id);
  if (auswahl.delete(b.id)) auswahlMerken();
  if (sel.kontakte === b.id) sel.kontakte = a.id;
  ZF.paare = ZF.paare.filter(p => p.a.id !== b.id && p.b.id !== b.id);

  const dlg = document.getElementById('zfDialog'); if (dlg) dlg.remove();
  persist(); render();
  if (document.getElementById('zfListe')) dublettenZeigen();
  toast('Zusammengeführt auf ' + a.id);
}

function zusammenfuehrenZurueck(){
  const z = ZF.zurueck;
  if (!z) return toast('Nichts rückgängig zu machen');
  // Die Nummer des aufgeloesten Kontakts war seit dem Zusammenfuehren frei
  // und kann inzwischen neu vergeben worden sein. Dann gaebe es sie nach dem
  // Zurueckholen zweimal, und die App faende immer nur den ersten.
  if (D.kontakte.some(k => k.id === z.zweit.id))
    return toast('Nummer ' + z.zweit.id + ' ist inzwischen neu vergeben, '
                 + 'rueckgaengig geht nicht mehr');
  const i = D.kontakte.findIndex(k => k.id === z.haupt.id);
  if (i >= 0) D.kontakte[i] = JSON.parse(JSON.stringify(z.haupt));
  const platz = z.platz >= 0 && z.platz <= D.kontakte.length ? z.platz : D.kontakte.length;
  D.kontakte.splice(platz, 0, JSON.parse(JSON.stringify(z.zweit)));
  z.meetings.forEach(s => {
    const m = D.meetings.find(x => x.id === s.id);
    if (m) m.kontaktIds = [...s.ids];
  });
  ZF.zurueck = null;
  persist(); render();
  if (document.getElementById('zfListe')) dublettenZeigen();
  toast('Zusammenführen rückgängig gemacht');
}

// ================================================= Papierkorb, Firmenwechsel, Verlauf
// Drei Dinge, die zusammengehoeren:
//   1. Mehrere markierte Kontakte auf einmal loeschen. Sie landen im Papierkorb
//      und lassen sich von dort zurueckholen, bis er geleert wird.
//   2. Firmenwechsel: die Person bekommt eine neue Firma, die alte wandert mit
//      Zeitraum in den Verlauf. Aktuell gilt immer genau eine Firma.
//   3. Verlauf: Firmenwechsel, Namens- und Mailaenderung, Zusammenfuehrung und
//      Wiederherstellung stehen mit Datum beim Kontakt.
//
// Geloescht wird nie still: jeder Vorgang fragt nach und nennt die Zahl.

const VERLAUF_MAX = 120;   // mehr braucht niemand, und die Datei bleibt schlank

function verlaufNotieren(k, art, text){
  if (!k || !text) return;
  k.verlauf = k.verlauf || [];
  k.verlauf.push({datum: heute(), art: art, text: text});
  // Nach oben begrenzen, aelteste zuerst weg. Sonst waechst kontakte.json
  // bei einem Kontakt, an dem viel gearbeitet wird, ohne Ende.
  if (k.verlauf.length > VERLAUF_MAX) k.verlauf = k.verlauf.slice(-VERLAUF_MAX);
}

function verlaufText(e){
  const w = {firma: 'Firma', name: 'Name', mail: 'Mailadresse',
             zusammengefuehrt: 'Zusammengeführt', papierkorb: 'Papierkorb',
             sonstiges: 'Notiz'};
  return (w[e.art] || e.art);
}

// ------------------------------------------------------------------ Anzeige
function verlaufBox(k){
  const v = (k.verlauf || []).slice().reverse();
  if (!v.length) return '';
  return `<fieldset><legend>Verlauf</legend>
    <table class="vltab">${v.map(e => `<tr>
      <td class="vldat">${esc(e.datum || '')}</td>
      <td class="vlart">${esc(verlaufText(e))}</td>
      <td>${esc(e.text || '')}</td></tr>`).join('')}</table>
    <p class="hint">Festgehalten werden Firmenwechsel, Namens- und Mailänderung,
      Zusammenführungen und Wiederherstellungen.</p></fieldset>`;
}

// ------------------------------------------------------------- Firmenwechsel
function firmaWechselnAuf(id){
  const k = kontaktVon(id);
  if (!k) return;
  if (document.getElementById('fwDialog')) return;
  const liste = D.firmen.slice().sort((a, b) => a.name.localeCompare(b.name, 'de'));
  const d = document.createElement('div');
  d.className = 'modal'; d.id = 'fwDialog';
  d.innerHTML = `<div class="modalbox">
    <h3>Firmenwechsel: ${esc(nameVon(k))}</h3>
    <p class="hint">Bisher: ${esc(k.firma || '(keine Firma)')}</p>
    <div class="fld"><label for="fwFirma">Neue Firma</label>
      <select id="fwFirma">
        <option value="">(keine)</option>
        ${liste.map(x => `<option value="${x.id}" ${x.id === k.firmaId ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}
      </select></div>
    <div class="fld"><label for="fwDatum">Seit wann</label>
      <input type="date" id="fwDatum" value="${heute()}"></div>
    <label class="hint"><input type="checkbox" id="fwAdresse" checked>
      Anschrift der neuen Firma übernehmen</label>
    <label class="hint"><input type="checkbox" id="fwMail">
      Mailadresse und Telefon leeren, sie gelten beim alten Arbeitgeber</label>
    <div class="knoepfe" style="margin-top:12px">
      <button class="btn" onclick="firmaWechselnAusfuehren('${k.id}')">Wechsel eintragen</button>
      <button class="btn ghost" onclick="document.getElementById('fwDialog').remove()">Abbrechen</button>
    </div></div>`;
  document.body.appendChild(d);
}

function firmaWechselnAusfuehren(id){
  const k = kontaktVon(id);
  if (!k) return;
  const neuId = document.getElementById('fwFirma').value;
  const datum = document.getElementById('fwDatum').value || heute();
  const adresse = document.getElementById('fwAdresse').checked;
  const mailWeg = document.getElementById('fwMail').checked;
  if (neuId === (k.firmaId || '')) return toast('Das ist die bisherige Firma');

  const alt = k.firma || '(keine Firma)';
  const f = neuId ? D.firmen.find(x => x.id === neuId) : null;
  k.firmaId = neuId;
  k.firma = f ? f.name : '';
  k.abgleichIgnoriert = false;
  if (f && adresse){
    ['strasse', 'plz', 'ort', 'land'].forEach(x => { k[x] = f[x] || ''; });
    if (f.web) k.web = f.web;
    if (f.bereich) k.bereich = f.bereich;
  }
  if (mailWeg){ k.mail = ''; k.tel = ''; }
  k.verlauf = k.verlauf || [];
  k.verlauf.push({datum: datum, art: 'firma',
                  text: alt + ' → ' + (k.firma || '(keine Firma)')});
  if (k.verlauf.length > VERLAUF_MAX) k.verlauf = k.verlauf.slice(-VERLAUF_MAX);

  ableiten('kontakt', k);
  const w = document.getElementById('fwDialog'); if (w) w.remove();
  persist(); render();
  toast('Firmenwechsel eingetragen');
}

// --------------------------------------------------------------- Papierkorb
function markierteLoeschen(){
  const arr = auswahlKontakte();
  if (!arr.length) return toast('Keine Kontakte markiert');
  // Protokolle, an denen NUR dieser Kontakt haengt, wandern mit. Protokolle mit
  // mehreren Teilnehmern bleiben stehen, dort faellt nur der Verweis weg.
  const ids = new Set(arr.map(k => k.id));
  const alleinige = D.meetings.filter(m => {
    const t = (m.kontaktIds || []);
    return t.length > 0 && t.every(x => ids.has(x));
  });
  const text = arr.length + (arr.length === 1 ? ' Kontakt' : ' Kontakte') + ' in den Papierkorb legen?'
    + (alleinige.length ? '\n' + alleinige.length + ' Protokoll(e) nur dieser Kontakte wandern mit.' : '')
    + '\nZurückholen geht, solange der Papierkorb nicht geleert wird.';
  if (!confirm(text)) return;

  const stempel = new Date().toISOString();
  const mitIds = new Set(alleinige.map(m => m.id));
  arr.forEach(k => {
    // An welchen bleibenden Protokollen haengt der Kontakt? Die Nummern merken,
    // damit das Zurueckholen ihn dort wieder eintragen kann.
    const andere = D.meetings.filter(m => !mitIds.has(m.id) && (m.kontaktIds || []).includes(k.id))
                             .map(m => m.id);
    D.papierkorb.push({
      id: k.id, name: nameVon(k) || '(ohne Name)', firma: k.firma || '',
      geloeschtAm: heute(), zeit: stempel,
      kontakt: JSON.parse(JSON.stringify(k)),
      meetings: alleinige.filter(m => (m.kontaktIds || []).includes(k.id))
                         .map(m => JSON.parse(JSON.stringify(m))),
      ausMeetings: andere
    });
    if (auswahl.delete(k.id)) { /* Markierung faellt weg */ }
    if (sel.kontakte === k.id) sel.kontakte = null;
  });

  D.kontakte = D.kontakte.filter(k => !ids.has(k.id));
  D.meetings = D.meetings.filter(m => !mitIds.has(m.id));
  D.meetings.forEach(m => { m.kontaktIds = (m.kontaktIds || []).filter(x => !ids.has(x)); });
  auswahlMerken();
  persist(); render();
  toast(arr.length + ' in den Papierkorb gelegt');
}

function papierkorbZeigen(){
  if (document.getElementById('pkDialog')) return papierkorbZu();
  const p = (D.papierkorb || []).slice().reverse();
  const d = document.createElement('div');
  d.className = 'modal'; d.id = 'pkDialog';
  d.innerHTML = `<div class="modalbox breit">
    <h3>Papierkorb</h3>
    ${p.length ? `<p class="hint">${p.length} Eintrag(e). Zurückholen geht, solange
      die Nummer nicht neu vergeben wurde.</p>
    <div class="zfliste">${p.map(e => `<div class="zfzeile">
      <div class="zfgrund">${esc(e.geloeschtAm || '')}${e.meetings && e.meetings.length
        ? ' · ' + e.meetings.length + ' Protokoll(e)' : ''}</div>
      <div><b>${esc(e.name)}</b> <i>${esc(e.id)}</i>${e.firma ? ' · ' + esc(e.firma) : ''}</div>
      <div class="zfknoepfe" style="margin-top:6px">
        <button class="btn small" onclick="papierkorbZurueck('${e.id}','${e.zeit}')">Zurückholen</button>
        <button class="btn ghost small" onclick="papierkorbEndgueltig('${e.id}','${e.zeit}')">Endgültig löschen</button>
      </div></div>`).join('')}</div>
    <div class="knoepfe" style="margin-top:12px">
      <button class="btn ghost" onclick="papierkorbLeeren()">Papierkorb leeren</button>
      <button class="btn ghost" onclick="papierkorbZu()">Schliessen</button>
    </div>`
    : `<p class="hint">Der Papierkorb ist leer.</p>
    <div class="knoepfe" style="margin-top:12px">
      <button class="btn ghost" onclick="papierkorbZu()">Schliessen</button></div>`}
    </div>`;
  document.body.appendChild(d);
}

function papierkorbZu(){ const d = document.getElementById('pkDialog'); if (d) d.remove(); }

function papierkorbEintrag(id, zeit){
  return (D.papierkorb || []).find(e => e.id === id && e.zeit === zeit);
}

function papierkorbZurueck(id, zeit){
  const e = papierkorbEintrag(id, zeit);
  if (!e) return toast('Eintrag nicht mehr da');
  // Die Nummer war seit dem Loeschen frei und kann neu vergeben worden sein.
  if (D.kontakte.some(k => k.id === e.id))
    return toast('Nummer ' + e.id + ' ist inzwischen neu vergeben, zurückholen geht nicht mehr');

  const k = JSON.parse(JSON.stringify(e.kontakt));
  k.verlauf = k.verlauf || [];
  k.verlauf.push({datum: heute(), art: 'papierkorb',
                  text: 'Aus dem Papierkorb zurückgeholt, gelöscht am ' + (e.geloeschtAm || '')});
  D.kontakte.push(k);

  (e.meetings || []).forEach(m => {
    if (!D.meetings.some(x => x.id === m.id)) D.meetings.push(JSON.parse(JSON.stringify(m)));
  });
  (e.ausMeetings || []).forEach(mid => {
    const m = D.meetings.find(x => x.id === mid);
    if (m && !(m.kontaktIds || []).includes(k.id)) m.kontaktIds = [...(m.kontaktIds || []), k.id];
  });

  D.papierkorb = D.papierkorb.filter(x => x !== e);
  persist(); render();
  papierkorbZu(); papierkorbZeigen();
  toast(nameVon(k) + ' ist zurück');
}

function papierkorbEndgueltig(id, zeit){
  const e = papierkorbEintrag(id, zeit);
  if (!e) return;
  if (!confirm(e.name + ' endgültig löschen? Das lässt sich nicht rückgängig machen.')) return;
  D.papierkorb = D.papierkorb.filter(x => x !== e);
  persist();
  papierkorbZu(); papierkorbZeigen();
  toast('Endgültig gelöscht');
}

function papierkorbLeeren(){
  const n = (D.papierkorb || []).length;
  if (!n) return;
  if (!confirm('Papierkorb mit ' + n + ' Eintrag(en) endgültig leeren? Das lässt sich nicht rückgängig machen.')) return;
  D.papierkorb = [];
  persist();
  papierkorbZu(); papierkorbZeigen();
  toast('Papierkorb geleert');
}

// ============================================== Mailliste für den Seriendruck
// Baut die Excel-Datei, die Word für den Seriendruck liest, direkt in der App.
// Ein Blatt "Tabelle1", die Spalten Email, Vorname, Nachname, Firma, daneben in
// Spalte F die Anleitung. Ohne Fremdbibliothek: eine xlsx ist ein ZIP mit ein
// paar XML-Teilen, beides steht hier unten.
//
// Mitgenommen wird, was markiert ist, sonst der ganze Bestand. Kontakte ohne
// Mailadresse fallen weg, die Liste soll versandfertig sein.

const MD_ANLEITUNG = [
  [2,  'Achtung:'],
  [3,  'Öffne Microsoft Word'],
  [4,  'Gehe auf Sendungen (Mailings)'],
  [5,  'Klick auf Seriendruck starten'],
  [6,  'Wähle E-Mail-Nachrichten'],
  [7,  'Klick auf Empfänger auswählen'],
  [8,  '→ Vorhandene Liste verwenden'],
  [9,  'Wähle deine Excel-Datei'],
  [10, 'Tabellenblatt auswählen (meist „Tabelle1“)'],
  [11, 'Klick auf Fertig stellen und zusammenführen'],
  [12, '→ E-Mail-Nachrichten senden'],
  [14, 'Immer altes Outlook verwenden'],
  [15, 'Nach Eingabe der Emailadressen immer wieder neu verbinden.'],
  [17, '20 Jahre esp-engineering! Wir freuen uns auf deinen Besuch!']
];
const MD_BREITEN = [38, 18, 22, 30, 3, 52];

// ------------------------------------------------------------------ ZIP-Teil
// Nur gespeichert, nicht gepackt. Eine xlsx dieser Groesse ist ein paar hundert
// Kilobyte, das Packen waere Aufwand ohne Nutzen.
const MD_CRC = (() => {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++){
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
})();

function mdCrc32(bytes){
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = MD_CRC[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function mdZip(dateien){
  const enc = new TextEncoder();
  const teile = [], zentral = [];
  let versatz = 0;

  const kopf = (laenge) => { const b = new Uint8Array(laenge); return {b, d: new DataView(b.buffer)}; };

  dateien.forEach(([name, text]) => {
    const nb = enc.encode(name), inhalt = enc.encode(text), crc = mdCrc32(inhalt);
    const {b: lfh, d} = kopf(30);
    d.setUint32(0, 0x04034b50, true);
    d.setUint16(4, 20, true);        // benoetigte Fassung
    d.setUint16(6, 0x0800, true);    // Dateiname in UTF-8
    d.setUint16(8, 0, true);         // nicht gepackt
    d.setUint16(10, 0, true); d.setUint16(12, 0x2821, true);  // feste Uhrzeit, festes Datum
    d.setUint32(14, crc, true);
    d.setUint32(18, inhalt.length, true);
    d.setUint32(22, inhalt.length, true);
    d.setUint16(26, nb.length, true);
    d.setUint16(28, 0, true);
    teile.push(lfh, nb, inhalt);

    const {b: cdh, d: c} = kopf(46);
    c.setUint32(0, 0x02014b50, true);
    c.setUint16(4, 20, true); c.setUint16(6, 20, true);
    c.setUint16(8, 0x0800, true); c.setUint16(10, 0, true);
    c.setUint16(12, 0, true); c.setUint16(14, 0x2821, true);
    c.setUint32(16, crc, true);
    c.setUint32(20, inhalt.length, true);
    c.setUint32(24, inhalt.length, true);
    c.setUint16(28, nb.length, true);
    c.setUint32(42, versatz, true);
    zentral.push(cdh, nb);
    versatz += 30 + nb.length + inhalt.length;
  });

  const zLaenge = zentral.reduce((n, x) => n + x.length, 0);
  const {b: ende, d: e} = kopf(22);
  e.setUint32(0, 0x06054b50, true);
  e.setUint16(8, dateien.length, true);
  e.setUint16(10, dateien.length, true);
  e.setUint32(12, zLaenge, true);
  e.setUint32(16, versatz, true);
  return new Blob([...teile, ...zentral, ende], {type:
    'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
}

// ----------------------------------------------------------------- XML-Teile
const mdX = s => (s == null ? '' : String(s))
  .replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '')
  .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');

function mdZelle(bezug, text, fett){
  if (text === '') return '';
  return `<c r="${bezug}" t="inlineStr"${fett ? ' s="1"' : ''}>`
       + `<is><t xml:space="preserve">${mdX(text)}</t></is></c>`;
}

function mdBlatt(zeilen){
  const anl = new Map(MD_ANLEITUNG);
  const letzte = Math.max(zeilen.length + 1, 17);
  const cols = MD_BREITEN.map((w, i) =>
    `<col min="${i + 1}" max="${i + 1}" width="${w}" customWidth="1"/>`).join('');

  const r = [];
  r.push('<row r="1">' + ['Email', 'Vorname', 'Nachname', 'Firma']
    .map((t, i) => mdZelle('ABCD'[i] + '1', t, true)).join('') + '</row>');
  for (let i = 0; i < letzte - 1; i++){
    const nr = i + 2;
    const z = zeilen[i] || null;
    const teile = z ? z.map((t, s) => mdZelle('ABCD'[s] + nr, t, false)).join('') : '';
    const hin = anl.has(nr) ? mdZelle('F' + nr, anl.get(nr), nr === 2) : '';
    if (teile || hin) r.push(`<row r="${nr}">${teile}${hin}</row>`);
  }

  return '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    + '<worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
    + `<dimension ref="A1:F${letzte}"/>`
    + '<sheetViews><sheetView tabSelected="1" workbookViewId="0">'
    + '<pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/>'
    + '</sheetView></sheetViews>'
    + '<sheetFormatPr defaultRowHeight="15"/>'
    + `<cols>${cols}</cols>`
    + `<sheetData>${r.join('')}</sheetData>`
    + `<autoFilter ref="A1:D${zeilen.length + 1}"/>`
    + '</worksheet>';
}

const MD_TYPEN = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
  + '<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types">'
  + '<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
  + '<Default Extension="xml" ContentType="application/xml"/>'
  + '<Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'
  + '<Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>'
  + '<Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/>'
  + '</Types>';

const MD_RELS = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
  + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
  + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/>'
  + '</Relationships>';

const MD_MAPPE = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
  + '<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"'
  + ' xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships">'
  + '<sheets><sheet name="Tabelle1" sheetId="1" r:id="rId1"/></sheets></workbook>';

const MD_MAPPE_RELS = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
  + '<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
  + '<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/>'
  + '<Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'
  + '</Relationships>';

const MD_STILE = '<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
  + '<styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main">'
  + '<fonts count="2"><font><sz val="11"/><name val="Calibri"/></font>'
  + '<font><b/><sz val="11"/><name val="Calibri"/></font></fonts>'
  + '<fills count="2"><fill><patternFill patternType="none"/></fill>'
  + '<fill><patternFill patternType="gray125"/></fill></fills>'
  + '<borders count="1"><border/></borders>'
  + '<cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs>'
  + '<cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/>'
  + '<xf numFmtId="0" fontId="1" fillId="0" borderId="0" xfId="0" applyFont="1"/></cellXfs>'
  + '<cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles>'
  + '</styleSheet>';

// ----------------------------------------------------------------- Zeilenwerk
function maillisteZeilen(liste){
  const quelle = (liste && liste.length) ? liste : D.kontakte;
  const gesehen = new Set();
  const zeilen = [];
  quelle.forEach(k => {
    const mail = (k.mail || '').trim();
    if (!mail) return;
    const schl = mail.toLowerCase();
    if (gesehen.has(schl)) return;   // dieselbe Adresse nie zweimal anschreiben
    gesehen.add(schl);
    const fa = D.firmen.find(f => f.id === k.firmaId);
    zeilen.push([mail, (k.vorname || '').trim(), (k.nachname || '').trim(),
                 (k.firma || (fa ? fa.name : '') || '').trim()]);
  });
  zeilen.sort((a, b) => (a[2] || '').localeCompare(b[2] || '', 'de')
                     || (a[1] || '').localeCompare(b[1] || '', 'de')
                     || a[0].localeCompare(b[0], 'de'));
  return zeilen;
}

function maillisteBauen(liste){
  const zeilen = maillisteZeilen(liste);
  const blob = mdZip([
    ['[Content_Types].xml', MD_TYPEN],
    ['_rels/.rels', MD_RELS],
    ['xl/workbook.xml', MD_MAPPE],
    ['xl/_rels/workbook.xml.rels', MD_MAPPE_RELS],
    ['xl/styles.xml', MD_STILE],
    ['xl/worksheets/sheet1.xml', mdBlatt(zeilen)]
  ]);
  return {blob: blob, anzahl: zeilen.length};
}

function maillisteKnopf(){
  const arr = auswahlKontakte();
  const ohne = (arr.length ? arr : D.kontakte).filter(k => !(k.mail || '').trim()).length;
  const {blob, anzahl} = maillisteBauen(arr);
  if (!anzahl) return toast('Niemand mit Mailadresse dabei');

  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'esp-Kontakte_Liste_' + heute().replace(/-/g, '') + '.xlsx';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);

  toast(anzahl + ' Adressen in der Liste' + (ohne ? ', ' + ohne + ' ohne Mail weggelassen' : ''));
}

function maillisteZeile(){
  const b = document.getElementById('btnMailliste');
  if (!b) return;
  b.textContent = auswahl.size ? 'Auswahl als Mailliste' : 'Alle als Mailliste';
  b.title = auswahl.size
    ? auswahl.size + ' markierte Kontakte, ohne die ohne Mailadresse'
    : 'Ohne Markierung kommen alle Kontakte mit Mailadresse in die Liste';
}

// ============================================ Mehrfachauswahl in den Filtern
// Bereich, Quelle und Land lassen jetzt mehrere Werte zu. Innerhalb eines
// Filters gilt oder, zwischen den Filtern und: Bereich Optik ODER Laser, UND
// Land Schweiz ODER Österreich.
//
// Darstellung: ein Knopf, der aufklappt, darunter die Werte mit Kästchen. Die
// Zahl rechts sagt, wie viele Kontakte dieser Wert brächte, wenn die übrigen
// Filter so bleiben wie sie sind. Darum steht hinter einem Wert auch mal 0.

const MF = {
  bereiche: {titel: 'Bereiche', leer: 'ohne Bereich', feld: 'bereich',
             werte: () => D.bereiche.slice()},
  quellen:  {titel: 'Quellen',  leer: 'ohne Quelle',  feld: 'quelle',
             werte: () => D.quellen.slice()},
  // Länder nach Häufigkeit im ganzen Bestand, nicht alphabetisch: sonst steht
  // Schweiz hinter Saudi-Arabien. Die Reihenfolge haengt bewusst NICHT am
  // Filter, sie darf nicht unter dem Finger springen.
  laender:  {titel: 'Länder',   leer: 'ohne Land',    feld: 'land',
             werte: () => {
               const n = new Map();
               D.kontakte.forEach(k => { const l = (k.land || '').trim();
                 if (l) n.set(l, (n.get(l) || 0) + 1); });
               return [...n.keys()].sort((a, b) =>
                 n.get(b) - n.get(a) || a.localeCompare(b, 'de'));
             }}
};
const MF_LEER = '__leer';

// Ein leeres Feld zaehlt als eigener Wert, sonst liesse sich nach "ohne" nicht filtern.
const mfWert = w => ((w || '').trim() || MF_LEER);
const mfPasst = (gewaehlt, wert) => !gewaehlt.length || gewaehlt.includes(mfWert(wert));

function mfBeschriftung(schl){
  const g = filt[schl] || [];
  const m = MF[schl];
  if (!g.length) return 'Alle ' + m.titel;
  const erst = g[0] === MF_LEER ? m.leer : g[0];
  return g.length === 1 ? erst : erst + ' +' + (g.length - 1);
}

// Wie viele Kontakte brächte dieser Wert? Die übrigen Filter gelten weiter,
// dieser eine wird für die Zählung beiseitegelegt.
function mfZahlen(schl){
  const vorher = filt[schl];
  filt[schl] = [];
  const arr = sichtbareKontakte();
  filt[schl] = vorher;
  const z = new Map();
  arr.forEach(k => { const w = mfWert(k[MF[schl].feld]); z.set(w, (z.get(w) || 0) + 1); });
  return z;
}

function mfBox(schl){
  const m = MF[schl];
  const g = filt[schl] || [];
  return `<div class="mf" id="mf_${schl}">
    <button type="button" class="mfknopf" onclick="mfKlappen('${schl}')">
      <span class="mftext">${esc(mfBeschriftung(schl))}</span>
      ${g.length > 1 ? `<span class="mfzahl">${g.length}</span>` : ''}
      <span class="mfpfeil">▾</span></button>
  </div>`;
}

function mfListe(schl){
  const m = MF[schl];
  const g = filt[schl] || [];
  const z = mfZahlen(schl);
  const zeile = (wert, txt) => `<label><input type="checkbox" value="${esc(wert)}"
      ${g.includes(wert) ? 'checked' : ''} onchange="mfHaken('${schl}', this)">
    <span>${esc(txt)}</span><span class="n">${z.get(wert) || 0}</span></label>`;
  return `<div class="mfliste">
    <div class="mfkopf">
      <button type="button" onclick="mfAlle('${schl}', true)">alle</button>
      <button type="button" onclick="mfAlle('${schl}', false)">keine</button>
    </div>
    ${zeile(MF_LEER, m.leer)}
    ${m.werte().map(w => zeile(w, w)).join('')}
  </div>`;
}

function mfKlappen(schl){
  const box = document.getElementById('mf_' + schl);
  if (!box) return;
  const offen = box.classList.contains('auf');
  mfZu();
  if (offen) return;                      // derselbe Knopf schliesst wieder
  box.classList.add('auf');
  box.insertAdjacentHTML('beforeend', mfListe(schl));
}

function mfZu(){
  document.querySelectorAll('.mf.auf').forEach(b => {
    b.classList.remove('auf');
    const l = b.querySelector('.mfliste'); if (l) l.remove();
  });
}

function mfHaken(schl, el){
  const g = new Set(filt[schl] || []);
  if (el.checked) g.add(el.value); else g.delete(el.value);
  filt[schl] = [...g];
  mfKnopfText(schl);
  renderList();
  mfZahlenNachziehen(schl);
}

function mfAlle(schl, an){
  filt[schl] = an ? [MF_LEER, ...MF[schl].werte()] : [];
  const box = document.getElementById('mf_' + schl);
  if (box) box.querySelectorAll('.mfliste input').forEach(i => { i.checked = an; });
  mfKnopfText(schl);
  renderList();
  mfZahlenNachziehen(schl);
}

function mfKnopfText(schl){
  const box = document.getElementById('mf_' + schl);
  if (!box) return;
  const t = box.querySelector('.mftext');
  if (t) t.textContent = mfBeschriftung(schl);
  const alt = box.querySelector('.mfzahl');
  const n = (filt[schl] || []).length;
  if (n > 1){
    if (alt) alt.textContent = n;
    else box.querySelector('.mfpfeil').insertAdjacentHTML('beforebegin',
      `<span class="mfzahl">${n}</span>`);
  } else if (alt) alt.remove();
}

// Die Zahlen der ANDEREN Filter stimmen nach einer Änderung nicht mehr. Der
// offene Filter behält seine, sonst springen die Zahlen unter dem Finger weg.
function mfZahlenNachziehen(ausser){
  Object.keys(MF).forEach(s => { if (s !== ausser) mfKnopfText(s); });
}

// Ausserhalb klicken schliesst die offene Liste.
document.addEventListener('click', e => {
  if (!e.target.closest('.mf')) mfZu();
});

function landDeutsch(w){
  const s = (w || '').trim();
  if (!s) return s;
  return LAND_DE[s.toLowerCase().replace(/\.+$/, '')] || s;
}

// Vorschlagsliste beim Tippen: was im Bestand steht, dazu die Ziele der Tabelle.
function laenderVorschlag(alle){
  const m = new Set();
  (alle || []).forEach(o => { const l = (o.land || '').trim(); if (l) m.add(l); });
  Object.values(LAND_DE).forEach(l => m.add(l));
  return [...m].sort((a, b) => a.localeCompare(b, 'de'));
}

// ===================================================================== Auftraege
// Ein Feld, in das Patrick einen Auftrag an Claude tippt, zum Beispiel eine
// Dankesmail an markierte Kontakte.
//
// Die Seite selbst kann Claude nicht anrufen, dafuer braeuchte es einen
// API-Schluessel. Darum legt sie den Auftrag als Datei in OneDrive ab:
//   Auftraege/auftrag_<Zeitstempel>.json
// Claude holt ihn von dort, schreibt die Entwuerfe nach Auftraege/Entwuerfe
// und legt den erledigten Auftrag mit dem Ergebnis nach Auftraege/Erledigt.

const AUF_ORDNER = 'Auftraege';
const LS_AUF = 'esp_kontakte_auftrag';

// Die drei Maskottchenstile fuer die Mailentwuerfe. Der Stil faerbt in der
// fertigen Mail den Streifen am Block, den Kopfstreifen und die Verweise.
const AUF_STILE = [
  ['edi',   'Edi, Eule, Blau'],
  ['sigi',  'Sigi, Fuchs, Orange'],
  ['pauli', 'Pauli, Biber, Braun'],
];

const AUF_VORLAGEN = [
  ['dank', 'Dankesmail nach dem Treffen',
   'Schreibe eine kurze, persoenliche Dankesmail fuer das Gespraech. '
   + 'Nimm Bezug auf das, was im Protokoll steht, bleib konkret und ohne Verkaufsdruck. '
   + 'Am Schluss ein offener naechster Schritt.'],
  ['nachfassen', 'Nachfassen',
   'Schreibe eine hoefliche Mail, die nachfasst: woran wir zuletzt waren und was der '
   + 'naechste Schritt waere. Kurz halten.'],
  ['unterlagen', 'Unterlagen nachsenden',
   'Schreibe eine kurze Mail, die die besprochenen Unterlagen ankuendigt und fragt, '
   + 'ob noch etwas fehlt.'],
  ['einladung', 'Einladung',
   'Schreibe eine Einladung. Anlass und Termin ergaenze ich unten im Text.'],
  ['frei', 'Frei formulieren', '']
];

// Merkt sich die zuletzt getroffene Wahl, nicht den Text
function aufHolen(){
  try { return JSON.parse(localStorage.getItem(LS_AUF) || 'null') || {}; }
  catch(e){ return {}; }
}
function aufMerken(o){
  try { localStorage.setItem(LS_AUF, JSON.stringify(o)); } catch(e){}
}

function aufKontaktdaten(k){
  const fa = (typeof firmaVon === 'function') ? firmaVon(k) : null;
  return {id: k.id,
          name: nameVon(k) || '',
          funktion: k.funktion || '',
          firma: k.firma || (fa ? fa.name : ''),
          mail: k.mail || '',
          land: k.land || '',
          quelle: k.quelle || '',
          kennengelerntAm: k.kennengelerntAm || ''};
}

function aufVorlageUm(){
  const s = document.getElementById('aufVorlage');
  const t = document.getElementById('aufText');
  if (!s || !t) return;
  const v = AUF_VORLAGEN.find(x => x[0] === s.value);
  // Nur ersetzen, solange der Text noch unveraendert aus einer Vorlage stammt
  const warVorlage = AUF_VORLAGEN.some(x => x[2] && x[2] === t.value) || !t.value.trim();
  if (v && warVorlage) t.value = v[2];
}

// --------------------------------------------------------------------- Ablegen
async function auftragAblegen(){
  const d = document.getElementById('aufDialog'); if (!d) return;
  const text = (document.getElementById('aufText').value || '').trim();
  if (!text){ toast('Bitte den Auftrag eintragen'); return; }

  const ids = (d.dataset.ids || '').split(',').filter(Boolean);
  const kontakte = ids.map(kontaktVon).filter(Boolean).map(aufKontaktdaten);
  if (!kontakte.length){ toast('Keine Kontakte mehr vorhanden'); return; }

  const vorlage = document.getElementById('aufVorlage').value;
  const sprache = document.getElementById('aufSprache').value;
  const stil = (document.getElementById('aufStil') || {}).value || 'edi';
  const prot = document.getElementById('aufProt').checked;
  const eml = document.getElementById('aufEml').checked;
  if (!prot && !eml){ toast('Bitte mindestens eine Ablage für das Ergebnis wählen'); return; }
  aufMerken({vorlage, sprache, stil, prot, eml});

  const ergebnis = [];
  // "aktion" statt des frueheren "protokoll": der Lauf legt je Kontakt ein
  // Protokoll mit dem Betreff an und darin zwei Aktionen, verschicken und
  // nachfassen. Der Mailtext bleibt allein in der .eml-Datei.
  if (prot) ergebnis.push('aktion');
  if (eml) ergebnis.push('eml');

  // Der Zeitstempel geht nur auf die Sekunde. Zwei Auftraege kurz nacheinander
  // haetten denselben Namen und der zweite wuerde den ersten ueberschreiben,
  // darum kommen drei zufaellige Zeichen dazu.
  const stempel = webStempel() + '_' + Math.random().toString(36).slice(2, 5);
  const datei = 'auftrag_' + stempel + '.json';
  const inhalt = {
    version: 1,
    id: 'A_' + stempel,
    stand: 'offen',
    erstelltAm: new Date().toISOString(),
    erstelltVon: od.konto || '',
    quelle: 'esp Kontakte, Web-Fassung',
    auftrag: text,
    vorlage: vorlage,
    sprache: sprache,
    stil: stil,
    ergebnis: ergebnis,
    anzahl: kontakte.length,
    kontakte: kontakte,
    format: 'Auftrag aus der Kontakte-App. Die Kontaktdaten unten sind nur ein Auszug, '
          + 'massgebend ist kontakte.json im selben Ordner.'
  };

  const knopf = document.getElementById('aufAb');
  if (knopf){ knopf.disabled = true; knopf.textContent = 'wird abgelegt...'; }
  try {
    await odSchreiben(new Blob([JSON.stringify(inhalt, null, 1)], {type: 'application/json'}),
                      'application/json', AUF_ORDNER, datei);
    d.remove();
    toast('Auftrag abgelegt: ' + datei);
    auftragFertigHinweis(datei, kontakte.length);
  } catch(e){
    if (knopf){ knopf.disabled = false; knopf.textContent = 'Auftrag ablegen'; }
    toast(odKlartext(e));
  }
}
