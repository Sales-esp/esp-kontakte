<title>esp Kontakte</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kontakte">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,400&display=swap">
<style>
  /* Layout: eine Spalte, oben ein fester Kopf, unten die Reiterleiste,
     dazwischen scrollt genau ein Bereich. Farben aus der esp-Kernpalette. */
  :root{
    --bg:#eef2f7; --flaeche:#ffffff; --ton:#1c2230; --leise:#5a6b85;
    --linie:#dde6f2; --navy:#183264; --akzent:#2f6fc7; --akzent-hell:#eaf1fb;
    --sigi:#e2601a; --edi:#2f6fc7; --pauli:#c17a2e;
    --gut:#1c6b45; --gut-hell:#e3f3ea; --warn:#8a4b06; --warn-hell:#fdece0;
    --schatten:0 1px 3px rgba(24,50,100,.10);
    --serif:"Roboto","Segoe UI",system-ui,-apple-system,Arial,sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#0f1720; --flaeche:#17212c; --ton:#e8eef6; --leise:#93a4b8;
      --linie:#25323f; --navy:#9cc0ee; --akzent:#6ba3e8; --akzent-hell:#1b2b3d;
      --sigi:#f08346; --edi:#6ba3e8; --pauli:#d79a56;
      --gut:#6fcf9b; --gut-hell:#163326; --warn:#e9a25c; --warn-hell:#3a2a16;
      --schatten:0 1px 3px rgba(0,0,0,.4);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#0f1720; --flaeche:#17212c; --ton:#e8eef6; --leise:#93a4b8;
    --linie:#25323f; --navy:#9cc0ee; --akzent:#6ba3e8; --akzent-hell:#1b2b3d;
    --sigi:#f08346; --edi:#6ba3e8; --pauli:#d79a56;
    --gut:#6fcf9b; --gut-hell:#163326; --warn:#e9a25c; --warn-hell:#3a2a16;
    --schatten:0 1px 3px rgba(0,0,0,.4);
    color-scheme:dark;
  }

  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ton);font-family:var(--serif);
       font-size:15px;line-height:1.45;overflow:hidden}
  button,input,select,textarea{font:inherit;color:inherit}
  a{color:var(--akzent)}

  /* ---------------------------------------------------------------- Gerüst */
  #huelle{display:flex;flex-direction:column;height:100%}
  header.kopf{flex:none;background:var(--flaeche);border-bottom:2px solid var(--navy);
       padding:8px 16px;display:flex;gap:10px;align-items:center;min-height:48px}
  header.kopf img.esp{height:22px;width:auto;border-radius:4px}
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]) header.kopf img.esp{background:#fff;padding:2px 5px}
  }
  :root[data-theme="dark"] header.kopf img.esp{background:#fff;padding:2px 5px}
  header.kopf .titel{font-weight:700;color:var(--navy);font-size:15px;
       white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  header.kopf .tiere{margin-left:auto;display:flex;gap:5px}
  header.kopf .tiere img{height:24px;width:24px;object-fit:contain}
  header.kopf .zurueck{background:none;border:0;color:var(--akzent);font-size:15px;
       padding:4px 2px;cursor:pointer;font-weight:500}

  #inhalt{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
       padding:12px 16px 26px}
  nav.reiter{flex:none;display:flex;background:var(--flaeche);border-top:1px solid var(--linie);
       padding-bottom:env(safe-area-inset-bottom,0px)}
  nav.reiter button{flex:1;background:none;border:0;padding:8px 2px 9px;cursor:pointer;
       color:var(--leise);font-size:11px;display:flex;flex-direction:column;
       align-items:center;gap:3px;border-top:3px solid transparent;margin-top:-1px}
  nav.reiter button.an{color:var(--navy);border-top-color:var(--akzent);font-weight:700}
  nav.reiter .sym{font-size:17px;line-height:1}

  /* ---------------------------------------------------------------- Bausteine */
  .karte{background:var(--flaeche);border:1px solid var(--linie);border-radius:10px;
       box-shadow:var(--schatten);margin-bottom:10px;overflow:hidden}
  .karte.sigi{border-left:3px solid var(--sigi)}
  .karte.edi{border-left:3px solid var(--edi)}
  .karte.pauli{border-left:3px solid var(--pauli)}
  .kartenkopf{display:flex;gap:8px;align-items:center;padding:8px 12px;
       background:var(--akzent-hell);border-bottom:1px solid var(--linie)}
  .kartenkopf img{height:22px;width:22px;object-fit:contain;flex:none}
  .kartenkopf b{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--navy)}
  .kartenkopf .rechts{margin-left:auto;font-size:11px;color:var(--leise)}
  .inhalt{padding:11px 12px}

  .btn{background:var(--akzent);color:#fff;border:0;border-radius:8px;padding:10px 14px;
       cursor:pointer;font-size:14px;font-weight:500;min-height:42px}
  .btn.geist{background:var(--flaeche);color:var(--ton);border:1px solid var(--linie)}
  .btn.gruen{background:var(--gut)}
  .btn.navy{background:var(--navy);color:#fff}
  .btn.klein{padding:6px 10px;font-size:13px;min-height:34px}
  .btn.voll{width:100%}
  .btn:disabled{opacity:.5}
  .knopfreihe{display:flex;gap:8px;flex-wrap:wrap}

  .feld{display:flex;flex-direction:column;gap:3px;margin-bottom:9px;min-width:0}
  .feld label{font-size:11px;color:var(--leise);text-transform:uppercase;letter-spacing:.05em}
  .feld input,.feld select,.feld textarea{padding:9px 10px;border:1px solid var(--linie);
       border-radius:8px;background:var(--flaeche);width:100%;min-width:0}
  .feld textarea{min-height:76px;resize:vertical}
  .zwei{display:grid;grid-template-columns:1fr 1fr;gap:9px}
  @media (max-width:380px){.zwei{grid-template-columns:1fr}}

  .zeile{display:flex;gap:10px;align-items:center;padding:10px 12px;cursor:pointer;
       border-bottom:1px solid var(--linie)}
  .zeile:last-child{border-bottom:0}
  .zeile:active{background:var(--akzent-hell)}
  .zeile img{width:42px;height:28px;object-fit:contain;flex:none;background:#fff;
       border:1px solid var(--linie);border-radius:4px}
  .zeile .txt{min-width:0;flex:1}
  .zeile .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .zeile .sub{font-size:12.5px;color:var(--leise);white-space:nowrap;overflow:hidden;
       text-overflow:ellipsis}
  .zeile .mark{width:20px;height:20px;flex:none;accent-color:var(--akzent)}

  .marke{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;
       background:var(--akzent-hell);color:var(--navy)}
  .marke.gut{background:var(--gut-hell);color:var(--gut)}
  .marke.warn{background:var(--warn-hell);color:var(--warn)}
  .leer{padding:26px 14px;text-align:center;color:var(--leise)}
  .hinweis{font-size:12.5px;color:var(--leise)}
  h2.gross{font-size:20px;margin:0 0 2px;color:var(--navy);text-wrap:balance}
  h3{font-size:14px;margin:14px 0 6px;color:var(--navy)}
  .sub{color:var(--leise);margin:0 0 10px;font-size:13.5px}

  .suche{display:flex;gap:8px;margin-bottom:10px}
  .suche input{flex:1;min-width:0;padding:10px 12px;border:1px solid var(--linie);
       border-radius:9px;background:var(--flaeche)}
  .chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;margin-bottom:4px;
       scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chip{flex:none;border:1px solid var(--linie);background:var(--flaeche);border-radius:20px;
       padding:6px 12px;font-size:13px;cursor:pointer;white-space:nowrap}
  .chip.an{background:var(--navy);color:#fff;border-color:var(--navy)}

  .fotos{display:flex;gap:8px;flex-wrap:wrap}
  .fotos figure{margin:0;width:104px}
  .fotos img{width:104px;height:74px;object-fit:cover;border:1px solid var(--linie);
       border-radius:8px;background:#fff}
  .fotos figcaption{font-size:10.5px;color:var(--leise);text-align:center;margin-top:2px}
  /* Dateifelder bleiben im Layout, sonst reichen manche Browser den Klick nicht weiter */
  .dateiwahl{position:relative;overflow:hidden;display:inline-flex;align-items:center;
       justify-content:center}
  .dateiwahl input[type=file]{position:absolute;inset:0;opacity:0;width:100%;height:100%;
       cursor:pointer}
  .grossbild{overflow:auto}
  .grossbild img{width:100%;border:1px solid var(--linie);border-radius:8px;background:#fff}
  .grossbild.zoom{max-height:74vh}
  .grossbild.zoom img{width:auto;max-width:none;height:200vw;max-height:none}

  .aufgabe{display:flex;gap:9px;align-items:flex-start;padding:8px 0;
       border-bottom:1px solid var(--linie)}
  .aufgabe:last-child{border-bottom:0}
  .aufgabe input[type=checkbox]{width:20px;height:20px;flex:none;margin-top:2px;
       accent-color:var(--gut)}
  .aufgabe .t{flex:1;min-width:0}
  .aufgabe.fertig .t{text-decoration:line-through;color:var(--leise)}

  .kopie{display:flex;gap:8px;align-items:center;margin-bottom:7px;min-width:0}
  .kopie .wert{flex:1;min-width:0;overflow-wrap:anywhere}
  .kopie .lab{font-size:11px;color:var(--leise);width:58px;flex:none}

  /* Sammelblatt und Meldungen */
  .blende{position:fixed;inset:0;background:rgba(15,23,32,.55);z-index:40;display:flex;
       align-items:flex-end;justify-content:center;padding:0}
  .blatt{background:var(--flaeche);width:100%;max-width:560px;border-radius:14px 14px 0 0;
       padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:88%;overflow:auto}
  .blatt h3{margin-top:0}
  .toast{position:fixed;left:50%;bottom:calc(74px + env(safe-area-inset-bottom,0px));
       transform:translateX(-50%);background:var(--navy);color:#fff;padding:9px 16px;
       border-radius:9px;font-size:13.5px;z-index:60;opacity:0;transition:.25s;
       pointer-events:none;max-width:88%;text-align:center}
  .toast.an{opacity:1}
  .lader{display:inline-block;width:15px;height:15px;border:2px solid var(--linie);
       border-top-color:var(--akzent);border-radius:50%;animation:dreh .8s linear infinite;
       vertical-align:-2px}
  @keyframes dreh{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.lader{animation:none}}
  :focus-visible{outline:2px solid var(--akzent);outline-offset:2px}
  .stand{font-size:11.5px;color:var(--leise)}
  /* Schmale Leiste unter dem Kopf: Stand der Daten und Speichern */
  .odleiste{flex:none;display:flex;gap:8px;align-items:center;padding:5px 16px;
       background:var(--akzent-hell);border-bottom:1px solid var(--linie);font-size:12px;
       color:var(--navy);min-height:32px}
  .odleiste .wo{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .odleiste button{flex:none}
  .odleiste.warn{background:var(--warn-hell);color:var(--warn)}
</style>

// ===================================================================== OneDrive
// Anmeldung bei Microsoft (Autorisierungscode mit PKCE, ohne fremde Bibliothek)
// und Zugriff auf den Ordner in OneDrive über Microsoft Graph.

const OD_KONF = 'esp_od_konfig';
const OD_SITZ = 'esp_od_sitzung';
const GRAPH = 'https://graph.microsoft.com/v1.0';
const OD_BEREICH = 'openid profile offline_access User.Read Files.ReadWrite';

const od = {
  clientId: '', mandant: 'organizations', ordner: '04.Reisen/Kontakte',
  zugang: '', erneuerung: '', gueltigBis: 0, konto: '',
  dateiId: '', marke: '', geladenAm: '', offline: false, offen: false, laeuft: false
};

function odKonfHolen(){
  try {
    const t = localStorage.getItem(OD_KONF);
    if (t) Object.assign(od, JSON.parse(t));
  } catch(e){}
  try {
    const s = localStorage.getItem(OD_SITZ);
    if (s) Object.assign(od, JSON.parse(s));
  } catch(e){}
}
function odKonfSichern(){
  try {
    localStorage.setItem(OD_KONF, JSON.stringify(
      {clientId:od.clientId, mandant:od.mandant, ordner:od.ordner}));
  } catch(e){}
}
function odSitzungSichern(){
  try {
    localStorage.setItem(OD_SITZ, JSON.stringify({zugang:od.zugang, erneuerung:od.erneuerung,
      gueltigBis:od.gueltigBis, konto:od.konto, dateiId:od.dateiId, marke:od.marke,
      geladenAm:od.geladenAm}));
  } catch(e){}
}
function odSitzungWeg(){
  od.zugang = od.erneuerung = od.konto = od.dateiId = od.marke = '';
  od.gueltigBis = 0;
  try { localStorage.removeItem(OD_SITZ); } catch(e){}
}

// Die Adresse, unter der die Seite liegt. Genau diese muss in der App-Registrierung
// stehen. Ein angehängtes index.html wird abgeschnitten: wer die Seite über den
// vollen Dateinamen aufruft, soll dieselbe Umleitung melden wie der Ordneraufruf,
// sonst lehnt Microsoft die Anmeldung mit einem Hinweis auf die Adresse ab.
function odUmleitung(){
  return location.origin + location.pathname.replace(/index\.html$/, '');
}

function odZufall(n){
  const a = new Uint8Array(n); crypto.getRandomValues(a);
  return btoa(String.fromCharCode(...a)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function odPruefwert(text){
  const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return btoa(String.fromCharCode(...new Uint8Array(h)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
const odBasis = () => 'https://login.microsoftonline.com/' + encodeURIComponent(od.mandant || 'organizations');

async function odAnmelden(){
  if (!od.clientId) throw {code:'keine_id'};
  const pruefer = odZufall(48), zustand = odZufall(12);
  sessionStorage.setItem('esp_od_pruefer', pruefer);
  sessionStorage.setItem('esp_od_zustand', zustand);
  const p = new URLSearchParams({
    client_id: od.clientId, response_type: 'code', redirect_uri: odUmleitung(),
    response_mode: 'query', scope: OD_BEREICH, state: zustand,
    code_challenge: await odPruefwert(pruefer), code_challenge_method: 'S256'});
  location.href = odBasis() + '/oauth2/v2.0/authorize?' + p.toString();
}

// Nach der Rückkehr von Microsoft steht der Code in der Adresszeile
async function odRueckkehr(){
  const p = new URLSearchParams(location.search);
  const code = p.get('code'), fehler = p.get('error');
  if (!code && !fehler) return null;
  history.replaceState(null, '', odUmleitung());
  if (fehler) return {fehler: p.get('error_description') || fehler};
  if (p.get('state') !== sessionStorage.getItem('esp_od_zustand'))
    return {fehler:'Die Antwort passt nicht zur Anfrage. Bitte nochmals anmelden.'};
  const pruefer = sessionStorage.getItem('esp_od_pruefer') || '';
  sessionStorage.removeItem('esp_od_pruefer'); sessionStorage.removeItem('esp_od_zustand');
  try {
    await odTausch({grant_type:'authorization_code', code, code_verifier:pruefer,
                    redirect_uri:odUmleitung()});
    return {ok:true};
  } catch(e){ return {fehler: odKlartext(e)}; }
}

async function odTausch(zusatz){
  const p = new URLSearchParams(Object.assign({client_id:od.clientId, scope:OD_BEREICH}, zusatz));
  const r = await fetch(odBasis() + '/oauth2/v2.0/token', {
    method:'POST', headers:{'content-type':'application/x-www-form-urlencoded'}, body:p.toString()});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw {code:'anmeldung', text:(d.error_description || d.error || ('HTTP ' + r.status))};
  od.zugang = d.access_token || '';
  if (d.refresh_token) od.erneuerung = d.refresh_token;
  od.gueltigBis = Date.now() + ((d.expires_in || 3600) - 120) * 1000;
  odSitzungSichern();
  odKontoHolen().catch(() => {});
  return d;
}

async function odZugang(){
  if (!od.clientId) throw {code:'keine_id'};
  if (od.zugang && Date.now() < od.gueltigBis) return od.zugang;
  if (!od.erneuerung) throw {code:'nicht_angemeldet'};
  try {
    await odTausch({grant_type:'refresh_token', refresh_token:od.erneuerung});
  } catch(e){
    // Die Anmeldung ist endgültig abgelaufen, sie muss neu gemacht werden
    odSitzungWeg();
    throw {code:'nicht_angemeldet'};
  }
  return od.zugang;
}
const odAngemeldet = () => !!(od.erneuerung || (od.zugang && Date.now() < od.gueltigBis));

async function odKontoHolen(){
  const d = await odGraph('/me?$select=displayName,mail,userPrincipalName');
  od.konto = d.mail || d.userPrincipalName || d.displayName || '';
  odSitzungSichern();
  return od.konto;
}

async function odGraph(pfad, opt){
  const o = Object.assign({}, opt);
  o.headers = Object.assign({}, o.headers, {Authorization: 'Bearer ' + await odZugang()});
  let r = await fetch(GRAPH + pfad, o);
  if (r.status === 429 || r.status === 503){
    const w = parseInt(r.headers.get('retry-after') || '2', 10);
    await new Promise(ok => setTimeout(ok, Math.min(w, 10) * 1000));
    o.headers.Authorization = 'Bearer ' + await odZugang();
    r = await fetch(GRAPH + pfad, o);
  }
  if (r.status === 401){ odSitzungWeg(); throw {code:'nicht_angemeldet'}; }
  if (!r.ok){
    let t = ''; try { t = await r.text(); } catch(e){}
    throw {code:'http_' + r.status, text:t};
  }
  if (r.status === 204) return null;
  const typ = r.headers.get('content-type') || '';
  return typ.includes('json') ? r.json() : r;
}

// Pfad im Laufwerk, jeder Teil einzeln kodiert, die Schrägstriche bleiben
function odPfad(...teile){
  return teile.join('/').split('/').filter(Boolean).map(encodeURIComponent).join('/');
}
const odWurzel = (...teile) => '/me/drive/root:/' + odPfad(od.ordner, ...teile);

async function odEintrag(...teile){
  return odGraph(odWurzel(...teile) + '?$select=id,name,size,eTag,lastModifiedDateTime,@microsoft.graph.downloadUrl');
}
async function odInhalt(eintrag){
  const u = eintrag['@microsoft.graph.downloadUrl'];
  if (!u) throw {code:'kein_inhalt'};
  const r = await fetch(u);            // eigene Adresse, ohne Kopfzeile
  if (!r.ok) throw {code:'http_' + r.status};
  return r;
}
async function odSchreiben(blob, typ, ...teile){
  try {
    return await odGraph(odWurzel(...teile) + ':/content',
      {method:'PUT', headers:{'content-type': typ}, body: blob});
  } catch(e){
    // Fehlt der Unterordner, legt Graph ihn nicht von selbst an
    if (e && e.code === 'http_404' && teile.length > 1){
      await odOrdnerAnlegen(teile.slice(0, -1));
      return odGraph(odWurzel(...teile) + ':/content',
        {method:'PUT', headers:{'content-type': typ}, body: blob});
    }
    throw e;
  }
}
async function odOrdnerAnlegen(teile){
  let eltern = odWurzel();
  for (const name of teile){
    try {
      await odGraph(eltern + ':/children', {method:'POST',
        headers:{'content-type':'application/json'},
        body: JSON.stringify({name, folder:{}, '@microsoft.graph.conflictBehavior':'fail'})});
    } catch(e){ /* gibt es schon, das ist in Ordnung */ }
    eltern = eltern + '/' + odPfad(name);
  }
}

// ------------------------------------------------------------------ Bestand laden
function odRein(arr){
  const m = new Map(); (arr||[]).forEach(o => m.set(o.id, o)); return m;
}
async function odLaden(){
  const e = await odEintrag('kontakte.json');
  const d = await (await odInhalt(e)).json();
  S.kontakte = odRein(d.kontakte);
  S.firmen   = odRein(d.firmen);
  S.meetings = odRein(d.meetings);
  S.listen = {quellen:d.quellen||[], bereiche:d.bereiche||[], meetingarten:d.meetingarten||[]};
  od.dateiId = e.id; od.marke = e.eTag || '';
  od.geladenAm = new Date().toISOString();
  od.offen = false; od.offline = false;
  odSitzungSichern();
  await odZwischenSichern();
  return S.kontakte.size;
}

// Der Bestand liegt zusätzlich auf dem Gerät, damit die App ohne Netz etwas zeigt
async function odZwischenSichern(){
  try {
    await idbSchreiben('kv', 'kontakte', [...S.kontakte.values()]);
    await idbSchreiben('kv', 'firmen',   [...S.firmen.values()]);
    await idbSchreiben('kv', 'meetings', [...S.meetings.values()]);
    await idbSchreiben('kv', 'listen', S.listen);
    await idbSchreiben('kv', 'stand', {marke:od.marke, dateiId:od.dateiId,
      geladenAm:od.geladenAm, offen:od.offen});
  } catch(e){}
}
async function odZwischenHolen(){
  const k = await idbLesen('kv', 'kontakte');
  if (!k) return false;
  S.kontakte = odRein(k);
  S.firmen   = odRein(await idbLesen('kv', 'firmen'));
  S.meetings = odRein(await idbLesen('kv', 'meetings'));
  const l = await idbLesen('kv', 'listen'); if (l) S.listen = l;
  const st = await idbLesen('kv', 'stand');
  if (st){ od.marke = st.marke || od.marke; od.dateiId = st.dateiId || od.dateiId;
           od.geladenAm = st.geladenAm || ''; od.offen = !!st.offen; }

// ------------------------------------------------------------------ Bestand schreiben
function odBestand(){
  return {version:1, gespeichert:heute(),
    quellen:S.listen.quellen, bereiche:S.listen.bereiche, meetingarten:S.listen.meetingarten,
    firmen:[...S.firmen.values()],

      // Die Anzeigeadressen der Fotos gehören zum Gerät, nicht in die Datei
      if (o.fotos) o.fotos = o.fotos.map(f => ({id:f.id, art:f.art, datum:f.datum, datei:f.datei||''}));
      return o;
    }),
    meetings:[...S.meetings.values()]};
}

const odStempel = () => new Date().toISOString().replace(/[-:]/g,'').replace('T','_').slice(0,15);

// Schreibt erst eine Sicherungskopie, prüft dann den Stand der Datei und legt nur los,
// wenn sie sich seit dem Laden nicht verändert hat.
async function odSpeichern(erzwingen){
  if (od.laeuft) return {code:'laeuft'};
  od.laeuft = true;
  try {
    const e = await odEintrag('kontakte.json');
    if (!erzwingen && od.marke && e.eTag && e.eTag !== od.marke)
      return {code:'konflikt', datum:e.lastModifiedDateTime};
    const text = JSON.stringify(odBestand(), null, 1);
    const blob = new Blob([text], {type:'application/json'});
    try {
      await odSchreiben(blob, 'application/json', 'Sicherungen', 'kontakte_' + odStempel() + '.json');
    } catch(err){ /* die Sicherung darf scheitern, das Speichern nicht blockieren */ }
    const neu = await odSchreiben(blob, 'application/json', 'kontakte.json');
    od.marke = (neu && neu.eTag) || '';
    od.dateiId = (neu && neu.id) || od.dateiId;
    od.geladenAm = new Date().toISOString();
    od.offen = false;
    odSitzungSichern();
    await odZwischenSichern();
    return {code:'ok'};
  } catch(err){
    return {code:(err && err.code) || 'fehler', text:(err && err.text) || ''};
  } finally { od.laeuft = false; }
}

// ------------------------------------------------------------------ Bilder
const odBilder = new Map();        // Pfad -> Anzeigeadresse
const odHolt = new Map();
async function odBildHolen(pfad){
  if (odBilder.has(pfad)) return odBilder.get(pfad);
  if (odHolt.has(pfad)) return odHolt.get(pfad);
  const lauf = (async () => {
    try {
      let b = await idbLesen('bilder', 'od:' + pfad);
      if (!b){
        const e = await odEintrag(pfad);
        b = await (await odInhalt(e)).blob();
        try { await idbSchreiben('bilder', 'od:' + pfad, b); } catch(err){}
      }
      const u = URL.createObjectURL(b);
      odBilder.set(pfad, u);
      return u;
    } catch(e){ odBilder.set(pfad, ''); return ''; }
    finally { odHolt.delete(pfad); }
  })();
  odHolt.set(pfad, lauf);
  return lauf;
}

// Bildpfade der Datensätze
function odLogoPfad(o){
  if (o && o.logo) return 'Logos/' + o.logo;
  const fa = o && o.firmaId ? S.firmen.get(o.firmaId) : null;
  if (fa && fa.logo) return 'Logos/' + fa.logo;
  if (o && o.karten && o.karten[0]) return 'Kartenbilder/' + o.karten[0];
  return '';
}
// Liefert entweder ein fertiges src oder eine Marke zum Nachladen
function bildAttr(pfad){
  if (!pfad) return 'alt="" style="visibility:hidden"';
  const c = odBilder.get(pfad);
  if (c) return 'src="' + esc(c) + '" alt=""';
  if (c === '') return 'alt="" style="visibility:hidden"';
  return 'data-od="' + esc(pfad) + '" alt=""';
}

// Bilder der sichtbaren Zeilen nachladen
let odSpaeher = null;
function odBilderNachladen(wurzel){
  const alle = (wurzel || document).querySelectorAll('img[data-od]');
  if (!alle.length) return;
  if (!odAngemeldet()) return;
  const laden = async el => {
    const p = el.dataset.od; if (!p) return;
    el.removeAttribute('data-od');
    const u = await odBildHolen(p);
    if (u) el.src = u; else el.style.visibility = 'hidden';
  };
  if (!('IntersectionObserver' in window)){ alle.forEach(laden); return; }
  if (!odSpaeher) odSpaeher = new IntersectionObserver(eintraege => {
    eintraege.forEach(e => { if (e.isIntersecting){ odSpaeher.unobserve(e.target); laden(e.target); } });
  }, {root: document.getElementById('inhalt'), rootMargin:'300px'});
  alle.forEach(el => odSpaeher.observe(el));
}

function odDateiname(k, art){
  const rein = s => (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/ß/g,'ss').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,28);
  return [k ? k.id : 'Neu', rein(k ? k.nachname : '') || 'Foto', art || 'Foto',
          odStempel()].filter(Boolean).join('_') + '.jpg';
}
async function odFotoHoch(blob, name){

function odKlartext(err){
  const c = (err && err.code) || '';
  if (c === 'keine_id') return 'Es ist noch keine Anwendungskennung eingetragen.';
  if (c === 'nicht_angemeldet') return 'Die Anmeldung ist abgelaufen. Bitte neu anmelden.';
  if (c === 'anmeldung') return 'Microsoft hat die Anmeldung abgelehnt: ' + (err.text || '');
  if (c === 'konflikt') return 'Die Datei wurde zwischenzeitlich am Rechner geändert.';
  if (c === 'http_404') return 'Die Datei wurde im angegebenen Ordner nicht gefunden.';
  if (c === 'http_403') return 'Für diesen Ordner fehlt die Berechtigung.';
  if (c && c.startsWith('http_')) return 'Microsoft meldet ' + c.slice(5) + '.';
  return 'Keine Verbindung zu OneDrive.';
}

// ===================================================================== Speichern
// Alles liegt in einer kleinen Datenbank im Browser des Geräts (IndexedDB).
let IDB = null;
function idbOeffnen(){
  return new Promise((ok, fehl) => {
    const a = indexedDB.open('esp_kontakte', 1);
    a.onupgradeneeded = () => {
      const d = a.result;
      if (!d.objectStoreNames.contains('kv')) d.createObjectStore('kv');
      if (!d.objectStoreNames.contains('bilder')) d.createObjectStore('bilder');
    };
    a.onsuccess = () => ok(a.result);
    a.onerror = () => fehl(a.error);
  });
}
function idbLesen(laden, schl){
  return new Promise((ok, fehl) => {
    const t = IDB.transaction(laden, 'readonly').objectStore(laden).get(schl);
    t.onsuccess = () => ok(t.result); t.onerror = () => fehl(t.error);
  });
}
function idbSchreiben(laden, schl, wert){
  return new Promise((ok, fehl) => {
    const t = IDB.transaction(laden, 'readwrite').objectStore(laden).put(wert, schl);
    t.onsuccess = () => ok(); t.onerror = () => fehl(t.error);
  });
}

function listeAufgaben(){
  const zeilen = [];
  S.meetings.forEach(m => (m.aktionen||[]).forEach((a,i) => {
    if (a.erledigt || !(a.text||'').trim()) return;
    zeilen.push({m, a, i});
  }));
  zeilen.sort((x,y) => (x.a.faellig||'9999').localeCompare(y.a.faellig||'9999'));
  return `<div class="karte pauli">
    <div class="kartenkopf"><img src="${S.marke.biber||''}" alt=""><b>Offene Aufgaben</b>
      <span class="rechts">${zeilen.length}</span></div>

        <input type="checkbox" data-tu="hakenAus:${z.m.id}:${z.i}" aria-label="erledigt">
        <div class="t"><div>${esc(z.a.text)}</div>
          <div class="hinweis">${esc([z.a.wer, z.a.faellig?'bis '+z.a.faellig:'', z.m.titel]

function kopie(label, wert, link){
  if (!wert) return '';
  return `<div class="kopie"><span class="lab">${esc(label)}</span>
    <span class="wert">${link?`<a href="${esc(link)}">${esc(wert)}</a>`:esc(wert)}</span>
    <button class="btn geist klein" data-tu="kopieren:${encodeURIComponent(wert)}">kopieren</button>
  </div>`;
}
function fe(label, art, id, feld, wert, typ){
  return `<div class="feld"><label for="f_${feld}_${id}">${esc(label)}</label>
    <input id="f_${feld}_${id}" type="${typ||'text'}" value="${esc(wert||'')}"
      data-f="${art}:${id}:${feld}"></div>`;
}
function ta(label, art, id, feld, wert){
  return `<div class="feld"><label for="t_${feld}_${id}">${esc(label)}</label>
    <textarea id="t_${feld}_${id}" data-f="${art}:${id}:${feld}">${esc(wert||'')}</textarea></div>`;
}
function aw(label, art, id, feld, wert, liste){
  const werte = S.listen[liste] || [];
  const fehlt = wert && !werte.includes(wert);
  return `<div class="feld"><label for="a_${feld}_${id}">${esc(label)}</label>
    <select id="a_${feld}_${id}" data-f="${art}:${id}:${feld}">
      <option value="">(nicht zugeordnet)</option>
      ${fehlt?`<option value="${esc(wert)}" selected>${esc(wert)}</option>`:''}
      ${werte.map(w => `<option value="${esc(w)}" ${w===wert?'selected':''}>${esc(w)}</option>`).join('')}
    </select></div>`;
}

function umgebung(){
  const u = navigator.userAgent || '';
  const app = /wv\)|; wv|Version\/[\d.]+ Chrome/.test(u) ? 'App-Ansicht' : 'Browser';
  const sys = /Android/.test(u) ? 'Android' : /iPhone|iPad/.test(u) ? 'iOS' : 'Rechner';
  const br = /Brave/.test(u) ? 'Brave' : /EdgA?/.test(u) ? 'Edge'
           : /Chrome/.test(u) ? 'Chrome' : /Safari/.test(u) ? 'Safari' : 'unbekannt';
  return sys + ', ' + br + ', ' + app + (window.top !== window.self ? ', im Rahmen' : '');
}

// ===================================================================== Aktionen
const AKTION = {
  filter(feld, wert){ filt[feld] = filt[feld]===wert ? '' : wert; zeichnen(); },
  neuKontakt(){ entwurf = entwurfHolen(); lesestand = entwurf ? 'Angefangener Entwurf, weiter bearbeiten oder verwerfen.' : ''; gehe('neu', null); },
  entwurfVerwerfen(){ entwurfWeg(); lesestand = ''; letztesBild = null; zeichnen(); },
  zuListen(){ gehe('listen', null); },
  zuProtokoll(id){ gehe('meeting', id); },
  kopieren(wert, el){
    const t = decodeURIComponent(wert);
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject())
      .then(() => toast('kopiert'), () => {
        const r = document.createRange(); r.selectNodeContents(el.previousElementSibling);
        const s = getSelection(); s.removeAllRanges(); s.addRange(r);
        toast('markiert, bitte selbst kopieren');
      });
  },
  async pruefen(id, ja){
    const k = S.kontakte.get(id); if (!k) return;
    k.geprueft = ja === '1'; k.geprueftAm = k.geprueft ? heute() : '';
    await sichern('kontakte', k); zeichnen();
  },
  async haken(mid, i, el){
    const m = S.meetings.get(mid); if (!m) return;
    m.aktionen[i].erledigt = el.checked;
    await sichern('meetings', m);
  },
  async hakenAus(mid, i, el){
    const m = S.meetings.get(mid); if (!m) return;
    m.aktionen[i].erledigt = true;
    await sichern('meetings', m); zeichnen(); toast('erledigt');
  },
  aktText(mid, i, el){ AKTION._akt(mid, i, 'text', el.value); },
  aktWer(mid, i, el){ AKTION._akt(mid, i, 'wer', el.value); },
  aktDatum(mid, i, el){ AKTION._akt(mid, i, 'faellig', el.value); },
  async _akt(mid, i, feld, wert){
    const m = S.meetings.get(mid); if (!m) return;
    m.aktionen[i][feld] = wert; await sichern('meetings', m);
  },
  async aktNeu(mid){
    const m = S.meetings.get(mid); if (!m) return;
    m.aktionen = m.aktionen || [];
    m.aktionen.push({text:'', wer:'', faellig:'', erledigt:false});
    await sichern('meetings', m); zeichnen();
  },
  async personZu(mid, el){
    const m = S.meetings.get(mid); if (!m || !el.value) return;
    m.kontaktIds = m.kontaktIds || [];
    if (!m.kontaktIds.includes(el.value)) m.kontaktIds.push(el.value);
    await sichern('meetings', m); zeichnen();
  },
  async personWeg(mid, kid){
    const m = S.meetings.get(mid); if (!m) return;
    m.kontaktIds = (m.kontaktIds||[]).filter(x => x !== kid);
    await sichern('meetings', m); zeichnen();
  },
  async neueFirma(){
    const f = {id:neueId('F', S.firmen), name:'Neue Firma', zusatz:'', strasse:'', plz:'', ort:'',
      land:'', web:'', bereich:'', kommentar:'', linkedin:'', maps:'', logo:'', standorte:[]};
    f.linkedin = P_LIF + encodeURIComponent(f.name);
    S.firmen.set(f.id, f); await sichern('firmen', f); gehe('firma', f.id);
  },
  async neuesMeeting(kid){
    const k = kid ? S.kontakte.get(kid) : null;
    const m = {id:neueId('M', S.meetings), datum:heute(), art:'', titel:'Neues Protokoll',
      ort:'', teilnehmer:'', firmaId:k?k.firmaId:'', kontaktIds:k?[k.id]:[], notizen:'',
      aktionen:[], bilder:[], erstelltAm:heute()};
    S.meetings.set(m.id, m); await sichern('meetings', m); gehe('meeting', m.id);
  },
  async wegKontakt(id){
    bestaetigen('Kontakt endgültig löschen?', async () => {
      await loeschen('kontakte', id); S.kontakte.delete(id);
      verlauf.length = 0; gehe('kontakte', null); toast('gelöscht');
    });
  },
  async wegMeeting(id){
    bestaetigen('Protokoll endgültig löschen?', async () => {
      await loeschen('meetings', id); S.meetings.delete(id);
      verlauf.length = 0; gehe('meetings', null); toast('gelöscht');
    });
  },
  async listeNeu(schl){
    const e = document.getElementById('neu_' + schl);
    const w = (e.value||'').trim(); if (!w) return;
    if (!S.listen[schl].includes(w)) S.listen[schl].push(w);
    await listenSichern(); zeichnen();
  },
  async listeUm(schl, i, el){
    const alt = S.listen[schl][i], neu = (el.value||'').trim();
    if (!neu || neu === alt) return;
    S.listen[schl][i] = neu;
    const feld = schl==='quellen' ? 'quelle' : schl==='bereiche' ? 'bereich' : 'art';
    const ziele = schl==='meetingarten' ? [['meetings', S.meetings]]
      : schl==='quellen' ? [['kontakte', S.kontakte]]
      : [['kontakte', S.kontakte], ['firmen', S.firmen]];
    for (const [art, karte] of ziele)
      for (const o of karte.values())
        if (o[feld] === alt){ o[feld] = neu; await sichern(art, o); }
    await listenSichern(); toast('umbenannt, Zuordnungen nachgeführt');
  },
  async listeWeg(schl, i){
    S.listen[schl].splice(i,1); await listenSichern(); zeichnen();
  },
  diagnose(){
    const t = ['Fassung ' + FASSUNG,
      'angemeldet ' + (odAngemeldet()?'ja':'nein'),
      'Konto ' + (od.konto||'-'),
      'Ordner ' + od.ordner,
      'Kennung ' + (od.clientId ? od.clientId.slice(0,8) + '…' : 'fehlt'),
      'Umleitung ' + odUmleitung(),
      'Stand ' + odStandText(),
      'Bestand ' + S.kontakte.size + '/' + S.firmen.size + '/' + S.meetings.size,
      umgebung(),
      navigator.userAgent].join(' | ');
    const e = document.getElementById('diagnose');
    if (e) e.textContent = t;
    (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject())
      .then(() => toast('Diagnose kopiert, bitte in den Chat einfügen'),
            () => toast('Bitte den Text unten markieren und kopieren'));
  },
  zoom(){ bildZoom = !bildZoom; zeichnen(); },
  async bildGross(pfad){
    const p = decodeURIComponent(pfad);
    const u = await odBildHolen(p);
    if (!u) return toast('Das Bild konnte nicht geladen werden');
    const b = document.createElement('div');
    b.className = 'blende';
    b.innerHTML = `<div class="blatt" style="max-height:94%"><div class="grossbild">
      <img src="${esc(u)}" alt=""></div>
      <button class="btn geist voll" style="margin-top:10px">Schliessen</button></div>`;
    document.body.appendChild(b);
    b.querySelector('button').onclick = () => b.remove();
    b.onclick = ev => { if (ev.target === b) b.remove(); };
  },
  odKonfSichern(){
    const g = i => (document.getElementById(i)||{}).value || '';
    od.clientId = g('odId').trim();
    od.mandant = g('odMandant').trim() || 'organizations';
    od.ordner = g('odOrdner').trim().replace(/^\/+|\/+$/g,'') || od.ordner;
    odKonfSichern();
    const e = document.getElementById('odEinstStand');
    if (e) e.textContent = od.clientId ? 'Angaben gesichert. Jetzt anmelden.'
                                       : 'Ohne Anwendungskennung ist keine Anmeldung möglich.';
  },
  async odAnmelden(){
    AKTION.odKonfSichern();
    if (!od.clientId) return toast('Bitte zuerst die Anwendungskennung eintragen');
    try { await odAnmelden(); }
    catch(e){ toast(odKlartext(e)); }
  },
  odAbmelden(){
    bestaetigen('Von Microsoft abmelden? Ungespeicherte Änderungen gehen verloren.', () => {
      odSitzungWeg(); toast('abgemeldet'); zeichnen();
    });
  },
  async odLaden(){
    if (od.offen)
      return bestaetigen('Es gibt ungespeicherte Änderungen. Wirklich neu laden und verwerfen?',
        () => AKTION._odLaden());
    AKTION._odLaden();
  },
  async _odLaden(){
    toast('Daten werden geladen …');
    try {
      const n = await odLaden();
      odBilder.clear();
      toast(n + ' Kontakte geladen');
    } catch(e){ toast(odKlartext(e)); }
    zeichnen();
  },
  async odSpeichern(){
    if (!odAngemeldet()) return toast('Bitte zuerst bei Microsoft anmelden');
    const kn = document.getElementById('odKnopf');
    if (kn){ kn.disabled = true; kn.textContent = 'speichert …'; }
    const r = await odSpeichern(false);
    if (kn){ kn.disabled = false; kn.textContent = 'Speichern'; }
    if (r.code === 'ok'){ toast('In OneDrive gespeichert'); zeichnen(); return; }
    if (r.code === 'laeuft') return toast('Es wird bereits gespeichert');
    if (r.code === 'konflikt'){
      bestaetigen('Die Datei wurde inzwischen woanders geändert. Deine Fassung trotzdem '
        + 'schreiben? Die bisherige liegt dann im Ordner Sicherungen.', async () => {
          const z = await odSpeichern(true);
          toast(z.code === 'ok' ? 'Gespeichert, die alte Fassung liegt in Sicherungen'
                                : odKlartext(z));
          zeichnen();
        });
      return;
    }
    toast(odKlartext(r));
  },
  zuEinst(){ gehe('einst', null); },
  zuLesen(){ gehe('lesen', null); },
  schluesselSichern(){
    const e = document.getElementById('apiKey');
    if (e) einst.schluessel = (e.value||'').trim();
    einstSichern();
    const st = document.getElementById('einstStand');
    if (st) st.textContent = einst.schluessel ? 'Schlüssel gesichert.' : 'Schlüssel entfernt.';
  },
  async modelleLaden(){
    AKTION.schluesselSichern();
    const st = document.getElementById('einstStand');
    if (st) st.innerHTML = '<span class="lader"></span> Modelle werden geladen …';
    try {
      const m = await modelleHolen();
      einst.modelle = m;
      if (!einst.modell && m.length)
        einst.modell = (m.find(x => /sonnet/i.test(x.id)) || m[0]).id;
      einstSichern(); zeichnen();
      toast(m.length + ' Modelle geladen');
    } catch(err){
      const c = (err && err.code) || '';

        : c2 === 'http_401' ? 'Der Schlüssel wird nicht angenommen.'
        : c2 === 'http_404' ? 'Das eingestellte Modell gibt es nicht. Bitte Modelle laden.'
        : c2.startsWith('http_') ? ('Die Schnittstelle meldet ' + c2.slice(5) + '.')
        : 'Keine Verbindung. Liegt die Seite auf einem Webserver mit https?';
    }
  },

  leerAnlegen(){ entwurf = entwurf || {}; entwurfMerken(); zeichnen(); },
  async nochmalLesen(){
    if (!letztesBild) return stand('Das Bild liegt nicht mehr im Speicher. Bitte neu aufnehmen.');

  },
  async entwurfSpeichern(){
    document.querySelectorAll('[data-e]').forEach(i => {
      entwurf = entwurf || {}; entwurf[i.dataset.e] = i.value;
    });
    const e = entwurf || {};
    const k = {id:neueId('K', S.kontakte), firmaId:'', titel:e.titel||'', vorname:e.vorname||'',
      nachname:e.nachname||'Neuer Kontakt', funktion:e.funktion||'', firma:e.firma||'',
      strasse:e.strasse||'', plz:e.plz||'', ort:e.ort||'', land:e.land||'', tel:e.tel||'',
      mobil:e.mobil||'', fax:'', mail:e.mail||'', web:e.web||'', linkedin:'',
      linkedinGeprueft:false, maps:'', bereich:e.bereich||'', quelle:e.quelle||'',
      erfasstAm:heute(), kennengelerntAm:heute(), geburtstag:'', details:'',
      kommentar:e.kommentar||'', karten:(e.fotos||[]).map(f=>f.datei).filter(Boolean),
      logo:'', geprueft:false, geprueftAm:'',
      fotos:e.fotos||[], lesenOffen:!!e.lesenOffen};
    if (k.lesenOffen && !e.nachname && !e.vorname) k.nachname = 'Karte vom ' + heute();
    // Firma zuordnen oder neu anlegen
    if (k.firma){
      const norm = s => s.toLowerCase().replace(/\b(gmbh|ag|co|kg|ltd|inc|sa|bv|srl)\b|[^a-z0-9]/g,'');
      let fa = [...S.firmen.values()].find(f => norm(f.name) === norm(k.firma));
      if (!fa){
        fa = {id:neueId('F', S.firmen), name:k.firma, zusatz:'', strasse:k.strasse, plz:k.plz,
          ort:k.ort, land:k.land, web:k.web, bereich:k.bereich, kommentar:'',
          linkedin:P_LIF+encodeURIComponent(k.firma), maps:'', logo:'', standorte:[]};
        S.firmen.set(fa.id, fa); await sichern('firmen', fa);
      }
      k.firmaId = fa.id; k.firma = fa.name;
    }
    ableiten(k);
    S.kontakte.set(k.id, k);
    await sichern('kontakte', k);
    entwurfWeg(); lesestand = ''; letztesBild = null;
    verlauf.length = 0;
    gehe('kontakt', k.id);
    toast('Kontakt gespeichert');
  },
  async exportJson(){
    const d = {version:1, gespeichert:heute(),
      quellen:S.listen.quellen, bereiche:S.listen.bereiche, meetingarten:S.listen.meetingarten,
      kontakte:[...S.kontakte.values()], firmen:[...S.firmen.values()],
      meetings:[...S.meetings.values()]};
    await datei('kontakte_mobil_' + heute() + '.json', JSON.stringify(d, null, 1));
  },
  async exportCsv(){
    const cols = ['id','titel','vorname','nachname','funktion','firma','strasse','plz','ort','land',
      'tel','mobil','mail','web','bereich','quelle','erfasstAm','kommentar','geprueft'];
    const z = [cols.join(';')];
    [...S.kontakte.values()].forEach(k => z.push(cols
      .map(c => '"' + String(k[c] ?? '').replace(/"/g,'""') + '"').join(';')));
    await datei('kontakte_' + heute() + '.csv', '﻿' + z.join('\r\n'));
  }
};

async function datei(name, text){
  try {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], {type:'application/json'}));
    a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000);
    toast('gesichert: ' + name);
  } catch(e){ toast('Sichern nicht möglich'); }
}

// Eigene Rückfrage, der Betrachter zeigt keine Systemdialoge
function bestaetigen(frage, dann){
  const b = document.createElement('div');
  b.className = 'blende';
  b.innerHTML = `<div class="blatt"><h3>${esc(frage)}</h3>
    <div class="knopfreihe"><button class="btn" id="jaKnopf">Ja</button>
    <button class="btn geist" id="neinKnopf">Abbrechen</button></div></div>`;
  document.body.appendChild(b);
  b.querySelector('#neinKnopf').onclick = () => b.remove();
  b.querySelector('#jaKnopf').onclick = () => { b.remove(); dann(); };
  b.onclick = ev => { if (ev.target === b) b.remove(); };
}

// ===================================================================== Foto und Erkennung
const LS_ENTWURF = 'esp_mobil_entwurf';
function entwurfMerken(){
  try {
    const e = Object.assign({}, entwurf || {});
    delete e.bildUrl;                       // Blob-Verweis überlebt einen Neustart nicht
    localStorage.setItem(LS_ENTWURF, JSON.stringify(e));
  } catch(err){}
}
function entwurfHolen(){
  try {
    const t = localStorage.getItem(LS_ENTWURF);
    if (t){ const e = JSON.parse(t); if (e && Object.keys(e).length) return e; }
  } catch(err){}
  return null;
}
function entwurfWeg(){ entwurf = null; try{ localStorage.removeItem(LS_ENTWURF); }catch(e){} }

const KARTEN_PROMPT = `Du liest eine abfotografierte Visitenkarte oder E-Mail-Signatur.
Gib ausschliesslich ein JSON-Objekt zurueck, ohne weiteren Text, mit genau diesen Feldern:
{"titel":"","vorname":"","nachname":"","funktion":"","firma":"","strasse":"","plz":"","ort":"",
 "land":"","tel":"","mobil":"","mail":"","web":"","kommentar":""}
Regeln: Akademische Grade wie Dr. oder Dipl.-Ing. gehoeren in "titel", nicht in den Namen.
"firma" ist der vollstaendige Firmenname mit Rechtsform. Telefonnummern im Format der Karte
uebernehmen, Festnetz nach "tel", Mobil nach "mobil". Nicht lesbare oder fehlende Angaben
als leeren String lassen, niemals raten. Was auf der Karte steht und in kein Feld passt,
kurz in "kommentar".`;

async function fotoLesen(datei){
  if (!einst.schluessel){
    entwurf = entwurf || {}; entwurf.lesenOffen = true; entwurfMerken();
    stand('Bild übernommen. Die Felder trägst du selbst ein.');
    zeichnen(); return;
  }
  stand('Karte wird gelesen, das dauert einige Sekunden …', true);
  try {
    const d = await karteAnApi(datei);
    entwurf = Object.assign(entwurf || {}, d || {});
    entwurf.lesenOffen = false;
    entwurfMerken();
    stand('Gelesen. Bitte prüfen, ergänzen und speichern.');
  } catch(err){
    const c = (err && err.code) || '';
    const txt = c === 'kein_schluessel' ? 'Kein Schlüssel hinterlegt.'
      : c === 'http_401' ? 'Der Schlüssel wird nicht angenommen. Bitte unter Einstellungen prüfen.'
      : c === 'http_403' ? 'Der Schlüssel darf dieses Modell nicht verwenden.'
      : c === 'http_404' ? 'Das eingestellte Modell gibt es nicht. Unter Einstellungen neu wählen.'
      : c === 'http_429' ? 'Zu viele Anfragen. Bitte gleich nochmals.'
      : c === 'keine_daten' ? 'Die Antwort enthielt keine verwertbaren Felder.'
      : c.startsWith('http_') ? ('Die Schnittstelle meldet ' + c.slice(5) + '.')
      : 'Keine Verbindung zur Schnittstelle.';
    entwurf = entwurf || {}; entwurf.lesenOffen = true; entwurfMerken();
    stand(txt + ' Das Foto ist gespeichert, die Felder kannst du selbst ausfüllen.');
    if (err && err.text) console.log('Antwort:', err.text);
  }
  zeichnen();
}

async function verkleinern(datei, kante, guete){
  try {
    const bild = await new Promise((ok, fehl) => {
      const i = new Image();
      i.onload = () => ok(i); i.onerror = fehl;
      i.src = URL.createObjectURL(datei);
    });
    const gross = Math.max(bild.width, bild.height);
    const k = Math.min(1, (kante || 1600) / gross);
    if (k >= 1 && datei.size < 900*1024) return datei;
    const c = document.createElement('canvas');
    c.width = Math.round(bild.width * k); c.height = Math.round(bild.height * k);
    c.getContext('2d').drawImage(bild, 0, 0, c.width, c.height);
    const b = await new Promise(ok => c.toBlob(ok, 'image/jpeg', guete || 0.82));
    if (b && b.size < datei.size) return new File([b], 'foto.jpg', {type:'image/jpeg'});
    return datei;
  } catch(e){ return datei; }
}

async function fotoAblegen(datei, kid, art){
  try {
    const klein = await verkleinern(datei, 1800, 0.84);
    const id = 'B' + Date.now().toString(36) + Math.random().toString(36).slice(2,6);
    await idbSchreiben('bilder', id, klein);
    const url = URL.createObjectURL(klein);
    const k = kid ? S.kontakte.get(kid) : null;
    let name = '';
    if (odAngemeldet()){
      try {
        name = await odFotoHoch(klein, odDateiname(k, art || 'Foto'));
        try { await idbSchreiben('bilder', 'od:Kartenbilder/' + name, klein); } catch(e){}
        odBilder.set('Kartenbilder/' + name, url);
      } catch(e){ toast('Foto liegt auf dem Gerät, OneDrive hat es abgelehnt'); }
    }
    if (k){
      k.fotos = k.fotos || [];
      k.fotos.push({id, url, datei:name, art:art||'Foto', datum:heute()});
      if (name){ k.karten = k.karten || []; if (!k.karten.includes(name)) k.karten.push(name); }
      await sichern('kontakte', k);
      zeichnen(); toast(name ? 'Foto in OneDrive abgelegt' : 'Foto auf dem Gerät hinterlegt');
    }
    return {id, url, datei:name};
  } catch(e){ toast('Foto konnte nicht gespeichert werden'); return null; }
}

document.addEventListener('change', async ev => {
  const t = ev.target;
  if (t.matches('[data-foto]')){
    const f = t.files && t.files[0]; if (!f) return;
    t.value = '';
    toast('Foto wird hinterlegt …');
    await fotoAblegen(f, t.dataset.foto, 'Foto');
    return;
  }
  if (t.id === 'kartenFoto' || t.id === 'kartenFoto2'){
    const f = t.files && t.files[0];
    t.value = '';
    if (!f){ stand('Es kam kein Bild an. Bitte nochmals aufnehmen.'); return; }
    entwurf = entwurf || {};
    try { entwurf.bildUrl = URL.createObjectURL(f); } catch(err){}
    entwurfMerken();
    stand('Bild übernommen (' + Math.round(f.size/1024) + ' KB). Wird gelesen …', true);
    zeichnen();
    letztesBild = f;
    await fotoLesen(f);
    const r = await fotoAblegen(f, null, 'Visitenkarte');
    if (r){ entwurf.fotos = [{id:r.id, url:r.url, datei:r.datei||'', art:'Visitenkarte', datum:heute()}]; entwurfMerken(); }
    return;
  }
  if (t.id === 'modellWahl'){ AKTION.modellWahl(t); return; }
  if (t.matches('[data-e]')){
    entwurf = entwurf || {};
    entwurf[t.dataset.e] = t.value;
    entwurfMerken();
  }
}, true);

document.addEventListener('paste', async ev => {
  const dt = ev.clipboardData; if (!dt) return;
  let f = null;
  if (dt.files && dt.files.length) f = dt.files[0];
  else if (dt.items) for (const it of dt.items)
    if (it.type && it.type.startsWith('image/')){ f = it.getAsFile(); break; }
  if (!f) return;
  ev.preventDefault();
  if (blick.art !== 'neu'){ verlauf.length = 0; entwurf = entwurf || {}; gehe('neu', null); }
  entwurf = entwurf || {};
  try { entwurf.bildUrl = URL.createObjectURL(f); } catch(e){}
  entwurfMerken();
  stand('Bild aus der Zwischenablage übernommen (' + Math.round(f.size/1024) + ' KB).', true);
  zeichnen();
  letztesBild = f;
  await fotoLesen(f);
  const r = await fotoAblegen(f, null, 'Visitenkarte');
  if (r){ entwurf.fotos = [{id:r.id, url:r.url, datei:r.datei||'', art:'Visitenkarte', datum:heute()}]; entwurfMerken(); }
});

// ===================================================================== Karte lesen
const API = 'https://api.anthropic.com/v1/';
function apiKopf(){
  return {'content-type':'application/json', 'x-api-key':einst.schluessel,
          'anthropic-version':'2023-06-01',
          'anthropic-dangerous-direct-browser-access':'true'};
}
function alsBase64(blob){
  return new Promise((ok, fehl) => {
    const l = new FileReader();
    l.onload = () => ok(String(l.result).split(',')[1]);
    l.onerror = fehl;
    l.readAsDataURL(blob);
  });
}
async function modelleHolen(){
  if (!einst.schluessel) throw {code:'kein_schluessel'};
  const r = await fetch(API + 'models?limit=100', {headers:apiKopf()});
  if (!r.ok) throw {code:'http_' + r.status, text:await r.text()};
  const d = await r.json();
  return (d.data||[]).map(m => ({id:m.id, name:m.display_name || m.id}));
}
async function karteAnApi(blob){
  if (!einst.schluessel) throw {code:'kein_schluessel'};
  const klein = await verkleinern(blob, 1600, 0.82);
  const b64 = await alsBase64(klein);
  const r = await fetch(API + 'messages', {
    method:'POST', headers:apiKopf(),
    body: JSON.stringify({
      model: einst.modell || 'claude-sonnet-4-5',
      max_tokens: 1200,
      messages: [{role:'user', content:[
        {type:'image', source:{type:'base64', media_type:'image/jpeg', data:b64}},
        {type:'text', text:KARTEN_PROMPT}
      ]}]
    })
  });
  if (!r.ok){
    let t = ''; try { t = await r.text(); } catch(e){}
    throw {code:'http_' + r.status, text:t};
  }
  const d = await r.json();
  const txt = (d.content||[]).filter(c => c.type==='text').map(c => c.text).join('');
  const a = txt.indexOf('{'), b = txt.lastIndexOf('}');
  if (a < 0 || b < a) throw {code:'keine_daten', text:txt};
  return JSON.parse(txt.slice(a, b+1));
}

// ===================================================================== Start
async function start(){
  S.marke = MARKE;
  $('#espLogo').src = MARKE.logo;
  $('#tFuchs').src = MARKE.fuchs;
  $('#tEule').src = MARKE.edi;
  $('#tBiber').src = MARKE.biber;
  einstHolen();
  odKonfHolen();
  reiterZeichnen();

  // Damit die App auf dem Startbildschirm liegen und ohne Netz starten kann
  if ('serviceWorker' in navigator && location.protocol === 'https:')
    navigator.serviceWorker.register('sw.js').catch(() => {});

  try { IDB = await idbOeffnen(); }
  catch(e){
    $('#inhalt').innerHTML = `<div class="karte"><div class="inhalt">
      <h2 class="gross">Speicher nicht verfügbar</h2>
      <p class="sub">Der Browser lässt keine lokale Datenbank zu. Das passiert im privaten
      Fenster. Bitte die Seite in einem normalen Fenster öffnen.</p></div></div>`;
    return;
  }

  // Antwort von Microsoft verarbeiten, falls wir gerade von dort zurückkommen
  const rueck = await odRueckkehr();

  // Zuerst den Stand vom Gerät zeigen, damit sofort etwas da ist
  const hatte = await odZwischenHolen();
  bereit = true;
  if (hatte) zeichnen();

  if (rueck && rueck.fehler){
    od.offline = true;
    bereit = true; gehe('einst', null, false);
    const e = document.getElementById('odEinstStand');
    if (e) e.textContent = rueck.fehler;
    return;
  }

  if (!od.clientId || !odAngemeldet()){
    if (!hatte){ bereit = true; gehe('einst', null, false); }
    else zeichnen();
    return;
  }

  // Frischen Stand aus OneDrive holen, offene Änderungen haben Vorrang
  if (od.offen){
    toast('Es liegen noch ungespeicherte Änderungen vom letzten Mal vor');
    zeichnen();
    return;
  }
  try {
    await odLaden();
    zeichnen();
  } catch(e){
    od.offline = true;
    zeichnen();
    toast(hatte ? 'Kein Zugriff auf OneDrive, es gilt der Stand vom Gerät' : odKlartext(e));
    if (!hatte) gehe('einst', null, false);
  }
}

start();
