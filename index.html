async function auftraegeZeigen(){
  if (!odAngemeldet()){ odEinstellungenZeigen(); toast('Bitte zuerst anmelden'); return; }
  const alt = document.getElementById('aufListe'); if (alt) alt.remove();
  const d = document.createElement('div');
  d.id = 'aufListe'; d.className = 'modal';
  d.innerHTML = `<div class="modalbox"><h3>Aufträge</h3>
    <p class="hint" id="aufLadeHinweis">wird geladen...</p></div>`;
  document.body.appendChild(d);

  let offen = [], erledigt = [];
  try {
    offen = (await odKinder(AUF_ORDNER))
      .filter(x => x.file && /^auftrag_.*\.json$/i.test(x.name))
      .sort((a, b) => b.name.localeCompare(a.name));
  } catch(e){ /* Ordner gibt es noch nicht */ }
  try {
    erledigt = (await odKinder(AUF_ORDNER, 'Erledigt'))
      .filter(x => x.file && /\.json$/i.test(x.name))
      .sort((a, b) => b.name.localeCompare(a.name)).slice(0, 10);
  } catch(e){}

  const inhalte = [];
  for (const f of offen.slice(0, 15)){
    try {
      const e = await odEintrag(AUF_ORDNER, f.name);
      inhalte.push({datei: f.name, j: await (await odInhalt(e)).json()});
    } catch(err){ inhalte.push({datei: f.name, j: null}); }
  }

  const box = d.querySelector('.modalbox');
  box.innerHTML = `<h3>Aufträge</h3>
    ${inhalte.length ? inhalte.map(x => `
      <div style="border:1px solid var(--line);border-radius:7px;padding:9px 10px;margin-bottom:8px">
        <div style="font-size:12px;color:#6b7280">${esc(x.datei)}</div>
        <div style="margin:3px 0">${x.j ? esc(x.j.auftrag || '') : '(nicht lesbar)'}</div>
        <div class="hint">${x.j ? (x.j.anzahl || (x.j.kontakte || []).length) + ' Kontakte' : ''}
          <button class="btn ghost small" style="float:right"
            onclick="auftragWeg('${esc(x.datei)}')">löschen</button></div>
      </div>`).join('')
      : '<p class="hint">Kein offener Auftrag.</p>'}
    ${offen.length > 15 ? `<p class="hint">und ${offen.length - 15} weitere</p>` : ''}
    <p class="hint" style="margin-top:10px">Erledigt: ${erledigt.length
      ? erledigt.map(f => esc(f.name)).join('<br>') : 'noch nichts'}</p>
    <div class="knopfe" style="margin-top:12px">
      <button class="btn ghost" onclick="document.getElementById('aufListe').remove()">Schliessen</button>
    </div>`;
}

async function auftragWeg(datei){

    toast('gelöscht');

            gelesen: 0, kontakte: [], partner: [], gefiltert: 0, intern: 0};

function pfEigeneDomain(){
  const m = (od.konto || '').split('@')[1];
  return (m || '').toLowerCase();
}

function pfNameZerlegen(anzeige, adresse){
  const a = (anzeige || '').trim();
  if (!a || a.toLowerCase() === (adresse || '').toLowerCase()) return {vorname: '', nachname: ''};
  if (a.includes(',')){
    const t = a.split(',');
    return {nachname: t[0].trim(), vorname: t.slice(1).join(' ').trim()};
  }
  const t = a.split(/\s+/);
  if (t.length === 1) return {vorname: '', nachname: t[0]};
  return {nachname: t[t.length - 1], vorname: t.slice(0, -1).join(' ')};
}

// Ein grober Firmenname aus der Domain, nur als Vorschlag
function pfFirmaAusDomain(d){
  const teile = (d || '').split('.');
  const frei = ['gmail','googlemail','outlook','hotmail','live','web','gmx','yahoo',
                'bluewin','icloud','me','aol','t-online','protonmail','mail'];
  if (!teile.length || frei.includes(teile[0])) return '';
  return teile[0].replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
}

// --------------------------------------------------------------------- Bestand
function pfBestand(){
  const mails = new Set(), namen = new Set();
  const rein = s => (s || '').normalize('NFD').replace(/[̀-ͯ]/g, '')
    .replace(/ß/g, 'ss').toLowerCase().replace(/[^a-z0-9]/g, '');
  D.kontakte.forEach(k => {
    ['mail', 'mail2'].forEach(f => {
      const v = (k[f] || '').trim().toLowerCase();
      if (v.includes('@')) mails.add(v);
    });
    const n = rein(k.nachname);
    if (n) namen.add(n + '|' + rein(k.vorname).slice(0, 1));
  });
  return {mails, namen, rein};
}

function pfSchonDa(b, mail, vorname, nachname){
  if (mail && b.mails.has(mail.toLowerCase())) return 'Mailadresse';
  const n = b.rein(nachname);
  if (n && b.namen.has(n + '|' + b.rein(vorname).slice(0, 1))) return 'Name';
  return '';
}

// --------------------------------------------------------------------- Graph
// Graph gibt die naechste Seite als volle Adresse zurueck. odGraph erwartet nur
// den Teil dahinter, darum wird der Anfang abgeschnitten.
async function pfSeiten(pfad, proSeite, grenze){
  const raus = [];
  let next = pfad;
  while (next && raus.length < grenze && !PF.abbruch){
    const d = await odGraph(next);
    (d.value || []).forEach(x => raus.push(x));
    PF.gelesen = raus.length;
    pfFortschritt();
    const n = d['@odata.nextLink'];
    next = (n && n.startsWith(GRAPH)) ? n.slice(GRAPH.length) : '';
    if (proSeite) proSeite(raus.length);
  }
  return raus;
}

async function pfOutlookKontakte(b){
  PF.schritt = 'Outlook-Kontakte'; PF.gelesen = 0; pfFortschritt();
  const felder = 'displayName,givenName,surname,companyName,jobTitle,emailAddresses,'
               + 'businessPhones,mobilePhone,businessAddress,personalNotes';
  const roh = await pfSeiten('/me/contacts?$top=100&$select=' + felder, null, 3000);
  const raus = [];
  roh.forEach(c => {
    const mail = ((c.emailAddresses || [])[0] || {}).address || '';
    const vorname = c.givenName || pfNameZerlegen(c.displayName, mail).vorname;
    const nachname = c.surname || pfNameZerlegen(c.displayName, mail).nachname;
    if (!nachname && !mail) return;
    const da = pfSchonDa(b, mail, vorname, nachname);
    if (da) return;
    const adr = c.businessAddress || {};
    raus.push({quelle: 'outlook', vorname, nachname, mail: mail.toLowerCase(),
      name: [vorname, nachname].filter(Boolean).join(' ') || c.displayName || mail,
      firma: c.companyName || pfFirmaAusDomain((mail.split('@')[1] || '')),
      funktion: c.jobTitle || '',
      tel: (c.businessPhones || [])[0] || '', mobil: c.mobilePhone || '',
      strasse: adr.street || '', plz: adr.postalCode || '', ort: adr.city || '',
      land: adr.countryOrRegion || '',
      an: 0, von: 0, cc: 0, letzte: '', art: 'person', nehmen: true});
  });
  return raus;
}

async function pfMailpartner(b, monate, grenze){
  PF.schritt = 'Mails'; PF.gelesen = 0; pfFortschritt();
  const seit = new Date();
  seit.setMonth(seit.getMonth() - monate);
  const pfad = '/me/messages?$top=100'
    + '&$select=from,toRecipients,ccRecipients,receivedDateTime'
    + '&$filter=' + encodeURIComponent('receivedDateTime ge ' + seit.toISOString())
    + '&$orderby=receivedDateTime%20desc';
  const roh = await pfSeiten(pfad, null, grenze);

  const ich = (od.konto || '').toLowerCase();
  const eigen = pfEigeneDomain();
  const karte = new Map();
  const merke = (ea, feld, datum) => {
    const adresse = ((ea || {}).address || '').trim().toLowerCase();
    if (!adresse || !adresse.includes('@') || adresse === ich) return;
    let e = karte.get(adresse);
    if (!e){
      const n = pfNameZerlegen((ea || {}).name, adresse);
      e = {quelle: 'mail', mail: adresse, vorname: n.vorname, nachname: n.nachname,
           name: [n.vorname, n.nachname].filter(Boolean).join(' ') || adresse,
           firma: pfFirmaAusDomain(adresse.split('@')[1]), funktion: '',
           tel: '', mobil: '', strasse: '', plz: '', ort: '', land: '',
           an: 0, von: 0, cc: 0, letzte: '', nehmen: false};
      karte.set(adresse, e);
    }
    e[feld]++;
    if (datum > e.letzte) e.letzte = datum;
    // Ein spaeter gefundener echter Name ist besser als gar keiner
    if (!e.nachname){
      const n = pfNameZerlegen((ea || {}).name, adresse);
      if (n.nachname){ e.vorname = n.vorname; e.nachname = n.nachname;
                       e.name = [n.vorname, n.nachname].filter(Boolean).join(' '); }
    }
  };

  roh.forEach(m => {
    const datum = (m.receivedDateTime || '').slice(0, 10);
    const vonMir = (((m.from || {}).emailAddress || {}).address || '').toLowerCase() === ich;
    if (vonMir){
      (m.toRecipients || []).forEach(r => merke(r.emailAddress, 'an', datum));
      (m.ccRecipients || []).forEach(r => merke(r.emailAddress, 'cc', datum));
    } else {
      merke((m.from || {}).emailAddress, 'von', datum);
      (m.ccRecipients || []).forEach(r => merke(r.emailAddress, 'cc', datum));
    }
  });

  PF.gefiltert = 0; PF.intern = 0;
  const raus = [];
  karte.forEach(e => {
    const teil = e.mail.split('@');
    const lokal = teil[0], domain = teil[1] || '';
    if (eigen && domain === eigen){ PF.intern++; return; }
    if (PF_MASCHINE_RE.test(lokal)){ PF.gefiltert++; return; }
    if (pfSchonDa(b, e.mail, e.vorname, e.nachname)) return;
    e.art = PF_SAMMEL_RE.test(lokal) ? 'sammel' : 'person';
    e.punkte = e.an * 3 + e.von * 2 + e.cc * 0.2;
    // Vorausgewaehlt ist, wem Patrick selbst geschrieben hat: das staerkste Zeichen
    e.nehmen = e.an > 0 && e.art === 'person';
    raus.push(e);
  });
  raus.sort((a, b2) => b2.punkte - a.punkte || (b2.letzte || '').localeCompare(a.letzte || ''));
  return raus;
}

// --------------------------------------------------------------------- Ablauf
function pfFortschritt(){
  const e = document.getElementById('pfStand');
  if (e) e.textContent = PF.laeuft
    ? PF.schritt + ': ' + PF.gelesen + ' gelesen' + (PF.abbruch ? ', wird beendet' : '')
    : '';
}

function pfAbbrechen(){
  if (PF.laeuft){ PF.abbruch = true; pfFortschritt(); return; }
  const d = document.getElementById('pfDialog'); if (d) d.remove();
}

async function postfachLesen(){
  if (PF.laeuft) return;
  PF.laeuft = true; PF.abbruch = false;
  const monate = parseInt(document.getElementById('pfMonate').value, 10) || 24;
  const grenze = parseInt(document.getElementById('pfGrenze').value, 10) || 6000;
  PF.monate = monate;
  const k = document.getElementById('pfStart');
  if (k){ k.disabled = true; k.textContent = 'läuft...'; }
  try {
    const b = pfBestand();
    PF.kontakte = await pfOutlookKontakte(b);
    PF.partner = await pfMailpartner(b, monate, grenze);
    PF.laeuft = false;
    const d = document.getElementById('pfDialog'); if (d) d.remove();
    pfErgebnisZeigen();
  } catch(e){
    PF.laeuft = false;
    if (k){ k.disabled = false; k.textContent = 'Abgleich starten'; }
    pfFortschritt();
    toast(pfKlartext(e));
  }
}

// Holt die zusaetzlichen Rechte. Verweigert der Mandant sie, bleibt die
// bestehende Anmeldung fuer OneDrive davon unberuehrt.
async function pfRechteHolen(){
  if (!od.clientId){ toast('Bitte zuerst die OneDrive-Angaben eintragen'); return; }
  if (!confirm('Du wirst zu Microsoft geschickt und meldest dich neu an, diesmal '
             + 'mit Zugriff auf Postfach und Kontakte.\n\n'
             + 'Verlangt euer Mandant dafür eine Administratorgenehmigung, brichst du '
             + 'dort einfach ab. An deiner jetzigen Anmeldung ändert sich dann nichts.')) return;
  try { await odAnmelden(OD_BEREICH_POST); } catch(e){ toast(odKlartext(e)); }
}

function pfKlartext(e){
  const c = (e && e.code) || '';
  if (c === 'http_403')
    return 'Microsoft verweigert den Zugriff auf das Postfach. Die Rechte Mail.Read '
         + 'und Contacts.Read fehlen noch: oben "Zugriff aufs Postfach anfragen". '
         + 'Verlangt euer Mandant dafür einen Administrator, geht es ohne ihn nicht.';
  if (c === 'nicht_angemeldet')
    return 'Die Anmeldung reicht für das Postfach nicht. Bitte oben den Zugriff anfragen.';
  return odKlartext(e);
}

// --------------------------------------------------------------------- Ergebnis
function pfZeile(x, i, liste){
  const z = [];
  if (x.an) z.push(x.an + 'x geschrieben');
  if (x.von) z.push(x.von + 'x erhalten');
  if (x.cc) z.push(x.cc + 'x Kopie');
  return `<tr>
    <td><input type="checkbox" ${x.nehmen ? 'checked' : ''}
        onchange="pfMarkieren('${liste}',${i},this.checked)"></td>
    <td>${esc(x.name)}${x.art === 'sammel'
        ? ' <span class="chip">Sammeladresse</span>' : ''}</td>
    <td>${esc(x.mail)}</td>
    <td>${esc(x.firma)}</td>
    <td style="font-size:11.5px;color:var(--muted)">${esc(z.join(', '))}${x.letzte ? '<br>zuletzt ' + esc(x.letzte) : ''}</td>
  </tr>`;
}

function pfMarkieren(liste, i, an){ PF[liste][i].nehmen = an; pfZahlZeigen(); }
function pfAlle(liste, an){
  PF[liste].forEach(x => { if (an === false || x.art === 'person') x.nehmen = an; });
  pfErgebnisZeigen();
}
function pfZahlZeigen(){
  const e = document.getElementById('pfZahl');
  if (e) e.textContent = (PF.kontakte.filter(x => x.nehmen).length
                        + PF.partner.filter(x => x.nehmen).length) + ' ausgewählt';
}

  const kopf = `<tr><th style="width:26px"></th><th>Name</th><th>Mailadresse</th>

    <div class="knopfe" style="margin-top:14px">

// --------------------------------------------------------------------- Uebernehmen
function pfUebernehmen(){
  const alle = PF.kontakte.filter(x => x.nehmen).concat(PF.partner.filter(x => x.nehmen));
  if (!alle.length){ toast('Nichts ausgewählt'); return; }
  if (!confirm(alle.length + ' Personen als neue Kontakte anlegen?\n\n'
             + 'Sie landen zunächst nur im Browser. Nach OneDrive kommen sie erst '
             + 'mit deinem Klick auf Speichern.')) return;

  // Nummern laufen immer weiter, eine geloeschte id wird nie wiederverwendet
  let n = D.kontakte.reduce((m, k) => Math.max(m, parseInt((k.id || '').slice(1), 10) || 0), 0);
  const neu = [];
  alle.forEach(x => {
    n++;
    neu.push({id: 'K' + String(n).padStart(3, '0'),
      titel: '', vorname: x.vorname || '', nachname: x.nachname || '',
      funktion: x.funktion || '', firma: x.firma || '', firmaId: '',
      strasse: x.strasse || '', plz: x.plz || '', ort: x.ort || '', land: x.land || '',
      tel: x.tel || '', mobil: x.mobil || '', fax: '', mail: x.mail || '',
      web: '', linkedin: '', bereich: '', quelle: 'Outlook-Abgleich',
      erfasstAm: heute(), kennengelerntAm: x.letzte || '', geburtstag: '',
      details: '', kommentar: 'Aus dem Postfach übernommen am ' + heute()
        + (x.an || x.von ? ' (' + x.an + ' gesendet, ' + x.von + ' erhalten)' : ''),
      karten: [], logo: '', geprueft: false, geprueftAm: '', abgleichIgnoriert: false});
  });
  D.kontakte.push(...neu);
  if (!D.quellen.includes('Outlook-Abgleich')) D.quellen.push('Outlook-Abgleich');
  persist();
  PF.kontakte = PF.kontakte.filter(x => !x.nehmen);
  PF.partner = PF.partner.filter(x => !x.nehmen);
  render();
  const e = document.getElementById('pfErg'); if (e) e.remove();
  toast(neu.length + ' Kontakte angelegt, noch nicht gespeichert');
}

function pfCsv(){
  const sp = ';';
  const kopf = ['Quelle','Vorname','Nachname','Mail','Firma','Funktion','Telefon','Mobil',
                'Ort','Land','gesendet','erhalten','Kopie','zuletzt','Art'];
  const zeilen = [kopf.join(sp)];
  PF.kontakte.concat(PF.partner).forEach(x => zeilen.push([
    x.quelle === 'outlook' ? 'Outlook-Kontakt' : 'Mailpartner',
    x.vorname, x.nachname, x.mail, x.firma, x.funktion, x.tel, x.mobil,
    x.ort, x.land, x.an, x.von, x.cc, x.letzte, x.art
  ].map(v => '"' + String(v == null ? '' : v).replace(/"/g, '""') + '"').join(sp)));
  download('postfach_abgleich.csv', '﻿' + zeilen.join('\r\n'), 'text/csv');
}

// ----------------------------------------------------------------- Start
(function(){
  markeSetzen();
  odKonfHolen();
  webStandHolen();
  let gespeichert = null;
  try { gespeichert = JSON.parse(localStorage.getItem(LS)||'null'); } catch(e){}
  // Ohne Stand im Geraet und ohne Netz muss die Oberflaeche trotzdem etwas zeigen
  const start = {version:1, gespeichert:'', quellen:[], bereiche:[], meetingarten:[],
                 firmen:[], kontakte:[], meetings:[]};
  D = migrate(gespeichert || start);
  let zugewachsen = 0;
  if (false && gespeichert){
    // 1) Verweise auf Logo- und Kartenbilder stammen immer aus der Auslieferung
    const sk = new Map(start.kontakte.map(k => [k.id, k]));
    D.kontakte.forEach(k => { const s = sk.get(k.id);
      if (s){ if (!k.logoEigen) k.logo = s.logo; if (!k.kartenEigen) k.karten = s.karten; } });
    const sf = new Map(start.firmen.map(f => [f.id, f]));
    D.firmen.forEach(f => { const s = sf.get(f.id); if (s && !f.logoEigen) f.logo = s.logo; });
    const sm = new Map(start.meetings.map(x => [x.id, x]));
    D.meetings.forEach(x => { const s = sm.get(x.id);
      if (s && !x.bilderEigen && s.bilder) x.bilder = s.bilder; });

    // 2) Neue Auslieferung: fehlende Kontakte, Firmen und Protokolle nachtragen
    if (D.standGeliefert !== start.gespeichert){
      const dazu = (ziel, quelle) => {
        const da = new Set(ziel.map(x => x.id));
        let n = 0;
        quelle.forEach(x => { if (!da.has(x.id)){ ziel.push(JSON.parse(JSON.stringify(x))); n++; } });
        return n;
      };
      zugewachsen = dazu(D.kontakte, start.kontakte);
      dazu(D.firmen, start.firmen);
      dazu(D.meetings, start.meetings);
      ['quellen','bereiche','meetingarten'].forEach(l => {
        (start[l]||[]).forEach(v => { if (!D[l].includes(v)) D[l].push(v); });
      });
      D.standGeliefert = start.gespeichert;
    }
    try { localStorage.setItem(LS, JSON.stringify(D)); } catch(e){}
  } else {
    D.standGeliefert = start.gespeichert;
  }
  dirty = false;
  render();
  starteOneDrive();
  window.addEventListener('beforeunload', e => { if (dirty){ e.preventDefault(); e.returnValue=''; } });
  document.addEventListener('keydown', e => {
    if ((e.ctrlKey||e.metaKey) && e.key==='s'){ e.preventDefault(); odSpeichernKlick(); }
  });
})();

// ----------------------------------------------------------------- Anlauf
// Nach der Rueckkehr von Microsoft steht der Code in der Adresse. Erst wenn der
// eingeloest ist, wird geladen.
async function starteOneDrive(){
  try {
    const zurueck = await odRueckkehr();
    if (zurueck) history.replaceState({}, '', odUmleitung());
  } catch(e){
    toast(odKlartext(e));
  }
  odStandZeigen();
  statusZeile();
  if (!odAngemeldet()){
    odEinstellungenZeigen();
    if (!od.clientId) toast('Bitte die OneDrive-Angaben eintragen');
    return;
  }
  await swBereit();
  await swVersorgen();
  await odLadenKlick(true);
}

// Das Dienstprogramm muss laufen, bevor die ersten Bilder angefragt werden
function swBereit(){
  const sicher = location.protocol === 'https:'
              || ['localhost', '127.0.0.1', '[::1]'].includes(location.hostname);
  if (!('serviceWorker' in navigator) || !sicher) return Promise.resolve(false);
  return navigator.serviceWorker.register('sw.js')
    .then(() => navigator.serviceWorker.ready)
    .then(() => navigator.serviceWorker.controller
          ? true
          : new Promise(ok => {
              navigator.serviceWorker.addEventListener('controllerchange',
                () => ok(true), {once: true});
              setTimeout(() => ok(false), 4000);
            }))
    .catch(() => false);
}
