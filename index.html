<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>esp Kontakte</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#183264">
<link rel="icon" href="icon-192.png">
<style>
  :root{
    /* esp-Farbwelt, Kernpalette Edi/Blau */
    --bg:#eef2f7; --panel:#fff; --ink:#1c2230; --muted:#5a6b85; --line:#dde6f2;
    --navy:#183264; --navy-dark:#0f2144;
    --accent:#2f6fc7; --accent-light:#eaf1fb; --soft:#f4f7fb;
    --accent2:#1f7a4d; --warn:#b06a12; --danger:#a33; --chip:#eaf1fb;
    /* Maskottchen: SIGI Fuchs, EDI Eule, PAULI Biber */
    --sigi:#e2601a; --edi:#2f6fc7; --pauli:#c17a2e;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);
       font:14px/1.45 "Roboto","Segoe UI",system-ui,-apple-system,Arial,sans-serif}
  button,input,select,textarea{font:inherit;color:inherit}
  a{color:var(--accent)}

  header.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:2px solid var(--navy);
       padding:8px 16px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  header.top img.logo-esp{height:30px;width:auto}
  header.top h1{font-size:15px;margin:0;white-space:nowrap;color:var(--navy);font-weight:700;
       letter-spacing:.02em}
  header.top .tiere{display:flex;gap:7px;align-items:center}
  header.top .tiere img{height:28px;width:28px;object-fit:contain}
  .status{font-size:12px;color:var(--muted);white-space:nowrap}
  .spacer{flex:1}

  .btn{background:var(--accent);color:#fff;border:0;border-radius:6px;padding:6px 11px;
       cursor:pointer;font-size:13px}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.ghost:hover{background:var(--soft)}
  .btn.green{background:var(--accent2)}
  .btn.warn{background:var(--warn)}
  .btn.navy{background:var(--navy)}
  .btn.small{padding:3px 8px;font-size:12px}
  .btn.breit{width:100%;text-align:left}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  nav.tabs{display:flex;gap:2px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);
       position:sticky;top:49px;z-index:19;flex-wrap:wrap}
  nav.tabs button{background:none;border:0;border-bottom:3px solid transparent;padding:9px 14px;
       cursor:pointer;color:var(--muted);font-weight:500}
  nav.tabs button.on{color:var(--navy);border-bottom-color:var(--accent);font-weight:700}
  nav.tabs .cnt{font-size:11px;color:var(--muted);margin-left:4px}

  /* vier Bereiche, jeder in eigenem Rahmen */
  main{display:grid;gap:12px;padding:12px 16px 50px;align-items:start;
       grid-template-columns:196px 238px minmax(300px,0.95fr) 1.6fr}
  @media(max-width:1500px){main{grid-template-columns:186px 222px minmax(270px,1fr) 1.25fr}}
  @media(max-width:1200px){main{grid-template-columns:196px 238px 1fr}
                           .sp-detail{grid-column:1 / -1}}
  @media(max-width:820px){main{grid-template-columns:1fr} .sp-detail{grid-column:auto}}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:9px;
         box-shadow:0 1px 2px rgba(24,50,100,.05);overflow:hidden}
  .panel.sp-aktion{border-left:3px solid var(--pauli)}
  .panel.sp-filter{border-left:3px solid var(--sigi)}
  .panel.sp-liste {border-left:3px solid var(--edi)}
  .panel.sp-detail{border-left:3px solid var(--navy)}
  .rahmenkopf{display:flex;gap:8px;align-items:center;padding:7px 11px;background:var(--soft);
       border-bottom:1px solid var(--line)}
  .rahmenkopf img{height:24px;width:24px;object-fit:contain;flex:none}
  .rahmenkopf img#rkLogo{width:auto;height:16px}
  .rahmenkopf b{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--navy)}
  .rahmenkopf .zahl{margin-left:auto;font-size:11px;color:var(--muted)}
  .rahmengruppe{padding:9px 10px;display:flex;flex-direction:column;gap:5px}
  .rahmengruppe + .rahmenkopf{border-top:1px solid var(--line)}
  .trenn{height:1px;background:var(--line);margin:3px 0}

  .filters{padding:10px;display:flex;flex-direction:column;gap:7px;align-items:stretch}
  .filters input,.filters select{padding:6px 8px;border:1px solid var(--line);border-radius:5px;
       background:#fff;width:100%}
  .filters input[type=search]{min-width:0}
  .filters label.hint{display:flex;gap:7px;align-items:center;font-size:12.5px;padding:2px 0}
  .filters label.hint input[type=checkbox]{width:16px;height:16px;flex:none;margin:0;
       accent-color:var(--accent)}
  .filters .btn{width:100%}

  .list{max-height:calc(100vh - 190px);overflow:auto}
  .row{padding:8px 10px;border-bottom:1px solid var(--line);cursor:pointer;display:flex;gap:8px;
       align-items:center}
  .row:hover{background:var(--soft)}
  .row.on{background:var(--accent-light)}
  .row img{width:44px;height:26px;object-fit:contain;border:1px solid var(--line);border-radius:3px;
       background:#fff;flex:none}
  .row .nm{font-weight:600}
  .row .sub{font-size:12px;color:var(--muted)}
  .row .rgt{margin-left:auto;text-align:right;font-size:11px;color:var(--muted);white-space:nowrap}
  .detail{padding:16px}
  .detail h2{margin:0 0 2px;font-size:19px;color:var(--navy)}
  .detail .sub{color:var(--muted);margin:0 0 12px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  @media(max-width:640px){.grid2{grid-template-columns:1fr}}
  .fld{display:flex;flex-direction:column;gap:3px;margin-bottom:9px}
  .fld label{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em}
  .fld input,.fld select,.fld textarea{padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:#fff;width:100%}
  .fld textarea{min-height:70px;resize:vertical}
  fieldset{border:1px solid var(--line);border-radius:8px;margin:0 0 14px;padding:12px 12px 4px}
  legend{font-size:12px;color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:0 5px}
  .links{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
  .links a{font-size:12px;text-decoration:none;color:#fff;background:var(--accent);padding:4px 9px;border-radius:5px}
  .links a.map{background:var(--accent2)} .links a.li{background:#0a66c2} .links a.unsure{background:var(--warn)}
  .links a.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .cardimgs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
  .cardimgs img{max-width:330px;width:100%;border:1px solid var(--line);border-radius:6px}
  .logo{height:34px;max-width:150px;object-fit:contain}
  .beleg{display:flex;flex-direction:column;gap:10px}
  .beleg img{width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff;display:block}
  .beleg .cap{font-size:12px;color:var(--muted)}
  .chip{display:inline-block;background:var(--chip);border-radius:20px;padding:2px 9px;font-size:11.5px;color:#44484d;margin:0 4px 4px 0}
  table.mini{width:100%;border-collapse:collapse;font-size:13px}
  table.mini th{text-align:left;font-size:11px;color:var(--muted);text-transform:uppercase;padding:4px 6px;border-bottom:1px solid var(--line)}
  table.mini td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  .aktion{display:grid;grid-template-columns:22px 1fr 130px 110px 26px;gap:6px;align-items:center;margin-bottom:5px}
  .aktion input[type=text],.aktion input[type=date]{padding:4px 6px;border:1px solid var(--line);border-radius:5px;width:100%}
  .aktion.done input[type=text]{text-decoration:line-through;color:var(--muted)}
  .hint{font-size:12px;color:var(--muted)}
  .empty{padding:30px;text-align:center;color:var(--muted)}
  .tag{font-size:11px;padding:1px 7px;border-radius:20px;background:var(--chip);color:#44484d}
  .tag.off{background:#fdece0;color:#8a4b06}
  .tag.ok{background:#e3f3ea;color:#1c6b45}
  .haken{color:var(--accent2);font-weight:700}
  .massen{padding:10px;border-top:1px solid var(--line);background:var(--accent-light);
          display:flex;flex-direction:column;gap:6px;align-items:stretch}
  .massen select{width:100%}
  .massen label.hint{display:flex;gap:7px;align-items:center}
  .massen label.hint input[type=checkbox]{width:16px;height:16px;flex:none;accent-color:var(--accent)}
  .massen b{font-size:12.5px;color:var(--navy)}
  .massen select{padding:5px 7px;border:1px solid var(--line);border-radius:5px;background:#fff}
  .listzeile{display:grid;grid-template-columns:1fr 90px 92px 30px;gap:8px;align-items:center;
             padding:5px 0;border-bottom:1px solid var(--line)}
  .listzeile input{padding:5px 7px;border:1px solid var(--line);border-radius:5px;width:100%}
  .listzeile .n{font-size:12px;color:var(--muted);text-align:right}
  .box{border:1px solid #e6d6bc;background:#fdf7ec;border-radius:8px;padding:9px 11px;margin-bottom:12px}
  .box.gleich{border-color:#cfe6d9;background:#f1f9f4}
  .box b{font-size:13px}
  .box ul{margin:6px 0 8px;padding-left:18px;font-size:13px}
  .box li{margin-bottom:2px}
  .box .knopfe{display:flex;gap:6px;flex-wrap:wrap}
  .box .alt{color:var(--muted);text-decoration:line-through;margin-right:4px}
  .toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1c1f22;color:#fff;
      padding:9px 16px;border-radius:7px;font-size:13px;z-index:50;opacity:0;transition:.25s;pointer-events:none}
  .toast.on{opacity:1}
  .kopf{display:flex;gap:12px;align-items:flex-start;margin-bottom:12px}
  .kopf .logo{flex:none}
  .del{background:none;border:0;color:var(--danger);cursor:pointer;font-size:15px;line-height:1}
  .row input.mark{width:16px;height:16px;flex:none;cursor:pointer;accent-color:var(--accent)}
  .modal{position:fixed;inset:0;background:rgba(20,26,32,.45);z-index:60;display:flex;
         align-items:center;justify-content:center;padding:20px}
  .modalbox{background:#fff;border-radius:11px;padding:18px 20px;width:min(520px,100%);
            max-height:90vh;overflow:auto;box-shadow:0 10px 40px rgba(0,0,0,.25)}
  .modalbox h3{margin:0 0 6px;font-size:17px}
  .modalbox .hint{display:block;margin-bottom:6px}
  .modalbox.breit{width:min(900px,100%)}
  .zfliste{max-height:52vh;overflow:auto;margin-top:8px}
  .zfzeile{border:1px solid var(--line);border-radius:7px;padding:8px 10px;margin-bottom:7px}
  .zfgrund{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
  .zfnamen{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:3px 0 6px}
  .zfnamen span{font-weight:600}
  .zfnamen i{display:block;font-weight:400;font-style:normal;font-size:12px;color:var(--muted)}
  .zfknoepfe{display:flex;gap:7px}
  .zftab{width:100%;border-collapse:collapse;font-size:13px;margin-top:8px}
  .zftab th{text-align:left;width:150px;padding:4px 8px 4px 0;vertical-align:top;
            font-weight:600;color:var(--muted)}
  .zftab td{padding:2px 4px 2px 0;vertical-align:top;width:50%}
  .zftab tr.kopf td{padding-bottom:9px}
  .zftab tr.gleich td{padding:4px 0;color:var(--muted)}
  .zfwert{display:block;width:100%;text-align:left;padding:5px 8px;border:1px solid var(--line);
          border-radius:5px;background:#fff;cursor:pointer;font:inherit;white-space:pre-wrap;
          word-break:break-word;color:var(--ink)}
  .zfwert:hover{border-color:var(--accent)}
  .zfwert.an{border-color:var(--accent);background:var(--accent-light);font-weight:600}
  .zfwert.klein{display:inline-block;width:auto;margin-top:4px;font-size:12px;padding:3px 7px}
  .zfwert i{color:var(--muted);font-size:12px;font-style:italic}
  .mf{position:relative}
  .mf .mfknopf{width:100%;display:flex;align-items:center;gap:6px;padding:6px 8px;
       border:1px solid var(--line);border-radius:5px;background:#fff;font:inherit;
       font-size:13px;cursor:pointer;text-align:left}
  .mf .mftext{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .mf .mfpfeil{margin-left:auto;color:var(--muted);font-size:10px}
  .mf.auf .mfknopf{border-color:var(--accent);border-radius:5px 5px 0 0}
  .mfzahl{background:var(--accent);color:#fff;border-radius:20px;font-size:11px;
       padding:0 6px;line-height:16px;flex:none}
  .mfliste{border:1px solid var(--accent);border-top:0;border-radius:0 0 5px 5px;
       background:#fff;max-height:236px;overflow:auto;padding:0 0 3px}
  .mfliste label{display:flex;gap:7px;align-items:center;padding:3px 8px;
       font-size:12.5px;cursor:pointer}
  .mfliste label:hover{background:var(--chip)}
  .mfliste label input{width:15px;height:15px;flex:none;margin:0;accent-color:var(--accent)}
  .mfliste label .n{margin-left:auto;color:var(--muted);font-size:11px;flex:none}
  .mfkopf{display:flex;gap:6px;padding:5px 8px;border-bottom:1px solid var(--line);
       margin-bottom:3px;position:sticky;top:0;background:#fff}
  .mfkopf button{font:inherit;font-size:11.5px;padding:2px 8px;border:1px solid var(--line);
       border-radius:4px;background:#fff;cursor:pointer;color:var(--muted)}
  .mfkopf button:hover{border-color:var(--accent);color:var(--accent)}
  .vltab{width:100%;border-collapse:collapse;font-size:13px;margin-top:4px}
  .vltab td{padding:3px 8px 3px 0;vertical-align:top;border-bottom:1px solid var(--line)}
  .vltab tr:last-child td{border-bottom:0}
  .vldat{white-space:nowrap;color:var(--muted);width:92px}
  .vlart{white-space:nowrap;font-weight:600;width:120px}

  /* ---------------------------------------------------- Dokument im esp-Stil, A4 */
  #druck{position:fixed;inset:0;z-index:70;background:#e9edf2;overflow:auto}
  .druckbar{position:sticky;top:0;z-index:2;display:flex;gap:10px;align-items:center;flex-wrap:wrap;
            background:#fff;border-bottom:1px solid var(--line);padding:9px 14px}
  .druckblatt{padding:18px 0 40px}
  body.druckmodus{overflow:hidden}
  #druck .ddeck, #druck .dblatt{width:210mm;min-height:297mm;margin:0 auto 14px;background:#fff;
       padding:20mm;box-shadow:0 2px 12px rgba(0,0,0,.14)}
  #druck{--dnavy:#183264; --dnavydark:#0f2144; --dblue:#2f6fc7; --dbluelight:#eaf1fb;
         --dsoft:#f4f7fb; --dmuted:#5a6b85; --dborder:#dde6f2}
  #druck .ddeck, #druck .dblatt{font-family:"Roboto","Helvetica Neue",Arial,sans-serif;
       color:#1c2230;font-size:10pt;line-height:1.45}
  #druck h1{font-size:30pt;font-weight:900;color:var(--dnavy);margin:0 0 4mm;line-height:1.1}
  #druck h2{font-size:19pt;font-weight:700;color:var(--dnavy);margin:0 0 1mm}
  #druck h4{font-size:8.5pt;font-weight:700;text-transform:uppercase;letter-spacing:.06em;
       color:var(--dblue);margin:0 0 2mm}
  #druck .deyebrow{font-size:8pt;font-weight:700;letter-spacing:3px;text-transform:uppercase;
       color:var(--dblue);margin-bottom:2mm}
  #druck .dsub{font-size:11pt;color:var(--dmuted)}
  #druck .dklein{font-size:8pt;color:var(--dmuted)}
  #druck .dhint{font-size:9pt;color:var(--dmuted);margin:0}
  #druck a{color:var(--dblue);text-decoration:none}

  /* Deckblatt als Block mit fest gesetzten Randabstaenden, wie im esp-Designsystem:
     Inhalt 2 cm eingerueckt, Maskottchen und Fusszeile absolut unten */
  #druck .ddeck{background:linear-gradient(160deg,#ffffff 0%,#eef3fb 55%,#dfe9f7 100%);
       display:block;position:relative}
  #druck .ddecklogo{width:70mm}
  #druck .ddeckmitte{margin:38mm 0 0}
  #druck .ddeckanlass{font-size:13pt;font-weight:500;color:var(--dmuted);margin-bottom:8mm}
  #druck .ddeckzahlen{display:flex;gap:10mm;margin-top:6mm}
  #druck .ddeckzahlen div{background:#fff;border-left:3px solid var(--dblue);border-radius:3mm;
       padding:4mm 6mm;min-width:32mm}
  #druck .ddeckzahlen b{display:block;font-size:20pt;font-weight:900;color:var(--dnavy);line-height:1.1}
  #druck .ddeckzahlen span{font-size:8.5pt;color:var(--dmuted)}
  #druck .dmaskott{display:flex;gap:6mm;justify-content:space-between;
       position:absolute;left:20mm;right:20mm;bottom:32mm}
  #druck .dmaskott figure{margin:0;text-align:center;flex:1}
  #druck .dmaskott img{width:38mm;height:38mm;object-fit:contain}
  #druck .dmaskott figcaption{font-size:8pt;color:var(--dmuted);line-height:1.4}
  #druck .dmaskott figcaption b{display:block;font-size:11pt;color:var(--dnavy);font-weight:900}
  #druck .dmaskott figcaption i{color:var(--dblue)}
  #druck .ddeckfuss{display:flex;justify-content:space-between;font-size:8.5pt;color:var(--dmuted);
       border-top:1px solid var(--dborder);padding-top:3mm;
       position:absolute;left:20mm;right:20mm;bottom:20mm}

  #druck .dkopf{display:flex;gap:6mm;align-items:flex-start;border-bottom:2px solid var(--dnavy);
       padding-bottom:4mm;margin-bottom:5mm}
  #druck .dkopf > div{flex:1}
  #druck .dlogo{max-width:38mm;max-height:16mm;object-fit:contain}
  #druck .dbadge{display:inline-block;background:#e3f3ea;color:#1c6b45;font-size:8pt;font-weight:700;
       padding:1mm 3mm;border-radius:20mm;margin-bottom:4mm}
  #druck .dspalten{display:flex;gap:5mm;margin-bottom:4mm}
  #druck .dspalten > *{flex:1;margin-bottom:0}
  #druck .dbox{background:var(--dsoft);border-left:3px solid var(--dblue);border-radius:2mm;
       padding:4mm 5mm;margin-bottom:4mm;break-inside:avoid}
  #druck .dz{display:flex;gap:3mm;font-size:9.5pt;margin-bottom:1.2mm}
  #druck .dz > span{width:26mm;flex:none;color:var(--dmuted);font-size:8.5pt;padding-top:.4mm}
  #druck .dadr{font-size:9.5pt}
  #druck .dtext{font-size:9.5pt}
  #druck .dtab{width:100%;border-collapse:collapse;font-size:9pt}
  #druck .dtab th{text-align:left;font-size:7.5pt;text-transform:uppercase;letter-spacing:.05em;
       color:var(--dmuted);border-bottom:1px solid var(--dborder);padding:1mm 2mm 1mm 0}
  #druck .dtab td{padding:1.5mm 2mm 1.5mm 0;border-bottom:1px solid var(--dborder);vertical-align:top}
  #druck .doff{color:#8a4b06;font-weight:700;font-size:8pt}
  #druck .dok{color:#1c6b45;font-size:8pt}
  #druck .dblock{margin-bottom:4mm}
  #druck .dprot{border-left:3px solid var(--dborder);padding:0 0 2mm 4mm;margin-bottom:2mm;font-size:9.5pt}
  #druck .dnotiz{font-size:8.5pt;color:#333d4d;margin-top:1mm;white-space:normal}
  #druck .dband{display:flex;align-items:center;justify-content:space-between;
       border-bottom:2px solid var(--dnavy);padding-bottom:3mm;margin-bottom:6mm}
  #druck .dbandlogo{width:52mm}
  #druck .dbandtiere{display:flex;gap:3mm}
  #druck .dbandtiere img{width:13mm;height:13mm;object-fit:contain}
  #druck .dkomp{margin-top:5mm}
  #druck .dkomp th{font-size:7.5pt}
  #druck .dkomp td{font-size:9pt;padding:2mm 3mm 2mm 0}
  #druck .dmailz a{word-break:break-all}
  #druck .dleer{color:var(--dmuted)}
  #druck .dkauf{margin-bottom:1.2mm}
  #druck .dkauf:last-child{margin-bottom:0}
  #druck .dkauf.erledigt{color:var(--dmuted);text-decoration:line-through}
  #druck .dkauf .dklein{display:block;text-decoration:none}
  #druck .dfuss{display:flex;justify-content:space-between;font-size:8pt;color:var(--dmuted);
       border-top:1px solid var(--dborder);padding-top:3mm;margin-top:6mm}
  #druck .dbild{margin-top:4mm}
  #druck .dbild img{max-width:110mm;max-height:70mm;border:1px solid var(--dborder);border-radius:2mm}

  @media print{
    @page{size:A4;margin:20mm}
    /* Deckblatt randlos, der Verlauf laeuft bis an die Papierkante */
    @page deckblatt{margin:0}
    html,body{background:#fff}
    body.druckmodus > header.top, body.druckmodus > nav.tabs, body.druckmodus > main,
    body.druckmodus > .toast, body.druckmodus .modal, #druck .druckbar{display:none !important}
    body.druckmodus{overflow:visible}
    #druck{position:static;background:#fff;overflow:visible}
    #druck .druckblatt{padding:0}
    #druck .ddeck, #druck .dblatt{width:auto;min-height:0;margin:0;padding:0;box-shadow:none;
         break-after:page}

<script>
// ===================================================================== OneDrive
// Anmeldung bei Microsoft (Autorisierungscode mit PKCE, ohne fremde Bibliothek)
// und Zugriff auf den Ordner in OneDrive über Microsoft Graph.

const OD_KONF = 'esp_od_konfig';
const OD_SITZ = 'esp_od_sitzung';
const GRAPH = 'https://graph.microsoft.com/v1.0';
// Die Grundrechte. Nur diese werden bei der normalen Anmeldung verlangt.
const OD_BEREICH = 'openid profile offline_access User.Read Files.ReadWrite';

// Zusaetzliche Rechte fuer "Postfach abgleichen". Sie werden bewusst NICHT in
// die normale Anmeldung gemischt: der Mandant esp-engineering verlangt dafuer
// eine Administratorgenehmigung, und wer sie nicht bekommt, haette sonst gar
// keine Anmeldung mehr, auch nicht fuer OneDrive. Darum werden sie nur dann
// angefragt, wenn jemand den Abgleich wirklich benutzen will.
const OD_BEREICH_POST = OD_BEREICH + ' Mail.Read Contacts.Read';
const OD_BER_SITZ = 'esp_od_bereich';

const od = {
  clientId: '', mandant: 'organizations', ordner: '04.Reisen/Kontakte',
  zugang: '', erneuerung: '', gueltigBis: 0, konto: '',
  dateiId: '', marke: '', geladenAm: '', offline: false, offen: false, laeuft: false
};

function odKonfHolen(){
  try {
    const t = localStorage.getItem(OD_KONF);
    if (t) Object.assign(od, JSON.parse(t));
  } catch(e){}
  try {
    const s = localStorage.getItem(OD_SITZ);
    if (s) Object.assign(od, JSON.parse(s));
  } catch(e){}
}
function odKonfSichern(){
  try {
    localStorage.setItem(OD_KONF, JSON.stringify(
      {clientId:od.clientId, mandant:od.mandant, ordner:od.ordner}));
  } catch(e){}
}
function odSitzungSichern(){
  try {
    localStorage.setItem(OD_SITZ, JSON.stringify({zugang:od.zugang, erneuerung:od.erneuerung,
      gueltigBis:od.gueltigBis, konto:od.konto, dateiId:od.dateiId, marke:od.marke,
      geladenAm:od.geladenAm}));
  } catch(e){}
}
function odSitzungWeg(){
  od.zugang = od.erneuerung = od.konto = od.dateiId = od.marke = '';
  od.gueltigBis = 0;
  try { localStorage.removeItem(OD_SITZ); } catch(e){}
}

// Die Adresse, unter der die Seite liegt. Genau diese muss in der App-Registrierung
// stehen. Ein angehängtes index.html wird abgeschnitten: wer die Seite über den
// vollen Dateinamen aufruft, soll dieselbe Umleitung melden wie der Ordneraufruf,
// sonst lehnt Microsoft die Anmeldung mit einem Hinweis auf die Adresse ab.
function odUmleitung(){
  return location.origin + location.pathname.replace(/index\.html$/, '');
}

function odZufall(n){
  const a = new Uint8Array(n); crypto.getRandomValues(a);
  return btoa(String.fromCharCode(...a)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
async function odPruefwert(text){
  const h = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return btoa(String.fromCharCode(...new Uint8Array(h)))
    .replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
}
const odBasis = () => 'https://login.microsoftonline.com/' + encodeURIComponent(od.mandant || 'organizations');

// bereich leer lassen heisst: nur die Grundrechte
async function odAnmelden(bereich){
  if (!od.clientId) throw {code:'keine_id'};
  const b = bereich || OD_BEREICH;
  const pruefer = odZufall(48), zustand = odZufall(12);
  sessionStorage.setItem('esp_od_pruefer', pruefer);
  sessionStorage.setItem('esp_od_zustand', zustand);
  sessionStorage.setItem(OD_BER_SITZ, b);
  const p = new URLSearchParams({
    client_id: od.clientId, response_type: 'code', redirect_uri: odUmleitung(),
    response_mode: 'query', scope: b, state: zustand,
    code_challenge: await odPruefwert(pruefer), code_challenge_method: 'S256'});
  location.href = odBasis() + '/oauth2/v2.0/authorize?' + p.toString();
}

// Nach der Rückkehr von Microsoft steht der Code in der Adresszeile
async function odRueckkehr(){
  const p = new URLSearchParams(location.search);
  const code = p.get('code'), fehler = p.get('error');
  if (!code && !fehler) return null;
  history.replaceState(null, '', odUmleitung());
  if (fehler) return {fehler: p.get('error_description') || fehler};
  if (p.get('state') !== sessionStorage.getItem('esp_od_zustand'))
    return {fehler:'Die Antwort passt nicht zur Anfrage. Bitte nochmals anmelden.'};
  const pruefer = sessionStorage.getItem('esp_od_pruefer') || '';
  // Der Tausch muss denselben Umfang nennen wie die Anmeldung davor
  const bereich = sessionStorage.getItem(OD_BER_SITZ) || OD_BEREICH;
  sessionStorage.removeItem('esp_od_pruefer'); sessionStorage.removeItem('esp_od_zustand');
  sessionStorage.removeItem(OD_BER_SITZ);
  try {
    await odTausch({grant_type:'authorization_code', code, code_verifier:pruefer,
                    redirect_uri:odUmleitung()}, bereich);
    return {ok:true};
  } catch(e){ return {fehler: odKlartext(e)}; }
}

async function odTausch(zusatz, bereich){
  const p = new URLSearchParams(Object.assign(
    {client_id:od.clientId, scope: bereich || OD_BEREICH}, zusatz));
  const r = await fetch(odBasis() + '/oauth2/v2.0/token', {
    method:'POST', headers:{'content-type':'application/x-www-form-urlencoded'}, body:p.toString()});
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw {code:'anmeldung', text:(d.error_description || d.error || ('HTTP ' + r.status))};
  od.zugang = d.access_token || '';
  if (d.refresh_token) od.erneuerung = d.refresh_token;
  od.gueltigBis = Date.now() + ((d.expires_in || 3600) - 120) * 1000;
  odSitzungSichern();
  odKontoHolen().catch(() => {});
  return d;
}

async function odZugang(){
  if (!od.clientId) throw {code:'keine_id'};
  if (od.zugang && Date.now() < od.gueltigBis) return od.zugang;
  if (!od.erneuerung) throw {code:'nicht_angemeldet'};
  try {
    await odTausch({grant_type:'refresh_token', refresh_token:od.erneuerung});
  } catch(e){
    // Die Anmeldung ist endgültig abgelaufen, sie muss neu gemacht werden
    odSitzungWeg();
    throw {code:'nicht_angemeldet'};
  }
  return od.zugang;
}
const odAngemeldet = () => !!(od.erneuerung || (od.zugang && Date.now() < od.gueltigBis));

async function odKontoHolen(){
  const d = await odGraph('/me?$select=displayName,mail,userPrincipalName');
  od.konto = d.mail || d.userPrincipalName || d.displayName || '';
  odSitzungSichern();
  return od.konto;
}

async function odGraph(pfad, opt){
  const o = Object.assign({}, opt);
  o.headers = Object.assign({}, o.headers, {Authorization: 'Bearer ' + await odZugang()});
  let r = await fetch(GRAPH + pfad, o);
  if (r.status === 429 || r.status === 503){
    const w = parseInt(r.headers.get('retry-after') || '2', 10);
    await new Promise(ok => setTimeout(ok, Math.min(w, 10) * 1000));
    o.headers.Authorization = 'Bearer ' + await odZugang();
    r = await fetch(GRAPH + pfad, o);
  }
  if (r.status === 401){ odSitzungWeg(); throw {code:'nicht_angemeldet'}; }
  if (!r.ok){
    let t = ''; try { t = await r.text(); } catch(e){}
    throw {code:'http_' + r.status, text:t};
  }
  if (r.status === 204) return null;
  const typ = r.headers.get('content-type') || '';
  return typ.includes('json') ? r.json() : r;
}

// Pfad im Laufwerk, jeder Teil einzeln kodiert, die Schrägstriche bleiben
function odPfad(...teile){
  return teile.join('/').split('/').filter(Boolean).map(encodeURIComponent).join('/');
}
const odWurzel = (...teile) => '/me/drive/root:/' + odPfad(od.ordner, ...teile);

async function odEintrag(...teile){
  // Bewusst ohne $select. OneDrive for Business liefert die Herunterladeadresse
  // @microsoft.graph.downloadUrl nur in der vollen Antwort mit. Fordert man die
  // Felder einzeln an, fehlt sie, auch wenn man sie ausdruecklich aufzaehlt, und
  // das Laden scheitert mit "kein_inhalt". Die volle Antwort ist ein paar hundert
  // Byte groesser, das faellt nicht ins Gewicht.
  return odGraph(odWurzel(...teile));
}
async function odInhalt(eintrag){
  const u = eintrag['@microsoft.graph.downloadUrl'];
  if (!u) throw {code:'kein_inhalt'};
  const r = await fetch(u);            // eigene Adresse, ohne Kopfzeile
  if (!r.ok) throw {code:'http_' + r.status};
  return r;
}
async function odSchreiben(blob, typ, ...teile){
  try {
    return await odGraph(odWurzel(...teile) + ':/content',
      {method:'PUT', headers:{'content-type': typ}, body: blob});
  } catch(e){
    // Fehlt der Unterordner, legt Graph ihn nicht von selbst an
    if (e && e.code === 'http_404' && teile.length > 1){
      await odOrdnerAnlegen(teile.slice(0, -1));
      return odGraph(odWurzel(...teile) + ':/content',
        {method:'PUT', headers:{'content-type': typ}, body: blob});
    }
    throw e;
  }
}
async function odOrdnerAnlegen(teile){
  let eltern = odWurzel();
  for (const name of teile){
    try {
      await odGraph(eltern + ':/children', {method:'POST',
        headers:{'content-type':'application/json'},
        body: JSON.stringify({name, folder:{}, '@microsoft.graph.conflictBehavior':'fail'})});
    } catch(e){ /* gibt es schon, das ist in Ordnung */ }
    eltern = eltern + '/' + odPfad(name);
  }
}

// ------------------------------------------------------------------ Bestand laden
function odRein(arr){
  const m = new Map(); (arr||[]).forEach(o => m.set(o.id, o)); return m;
}
async function odLaden(){
  const e = await odEintrag('kontakte.json');
  const d = await (await odInhalt(e)).json();
  S.kontakte = odRein(d.kontakte);
  S.firmen   = odRein(d.firmen);
  S.meetings = odRein(d.meetings);
  S.listen = {quellen:d.quellen||[], bereiche:d.bereiche||[], meetingarten:d.meetingarten||[]};
  od.dateiId = e.id; od.marke = e.eTag || '';
  od.geladenAm = new Date().toISOString();
  od.offen = false; od.offline = false;
  odSitzungSichern();
  await odZwischenSichern();
  return S.kontakte.size;
}

// Der Bestand liegt zusätzlich auf dem Gerät, damit die App ohne Netz etwas zeigt
async function odZwischenSichern(){
  try {
    await idbSchreiben('kv', 'kontakte', [...S.kontakte.values()]);
    await idbSchreiben('kv', 'firmen',   [...S.firmen.values()]);
    await idbSchreiben('kv', 'meetings', [...S.meetings.values()]);
    await idbSchreiben('kv', 'listen', S.listen);
    await idbSchreiben('kv', 'stand', {marke:od.marke, dateiId:od.dateiId,
      geladenAm:od.geladenAm, offen:od.offen});
  } catch(e){}
}
async function odZwischenHolen(){
  const k = await idbLesen('kv', 'kontakte');
  if (!k) return false;
  S.kontakte = odRein(k);
  S.firmen   = odRein(await idbLesen('kv', 'firmen'));
  S.meetings = odRein(await idbLesen('kv', 'meetings'));
  const l = await idbLesen('kv', 'listen'); if (l) S.listen = l;
  const st = await idbLesen('kv', 'stand');
  if (st){ od.marke = st.marke || od.marke; od.dateiId = st.dateiId || od.dateiId;
           od.geladenAm = st.geladenAm || ''; od.offen = !!st.offen; }
  return true;
}

// ------------------------------------------------------------------ Bestand schreiben
function odBestand(){
  return {version:1, gespeichert:heute(),
    quellen:S.listen.quellen, bereiche:S.listen.bereiche, meetingarten:S.listen.meetingarten,
    firmen:[...S.firmen.values()],
    kontakte:[...S.kontakte.values()].map(k => {
      const o = Object.assign({}, k);
      // Die Anzeigeadressen der Fotos gehören zum Gerät, nicht in die Datei
      if (o.fotos) o.fotos = o.fotos.map(f => ({id:f.id, art:f.art, datum:f.datum, datei:f.datei||''}));
      return o;
    }),
    meetings:[...S.meetings.values()]};
}

const odStempel = () => new Date().toISOString().replace(/[-:]/g,'').replace('T','_').slice(0,15);

// Schreibt erst eine Sicherungskopie, prüft dann den Stand der Datei und legt nur los,
// wenn sie sich seit dem Laden nicht verändert hat.
async function odSpeichern(erzwingen){
  if (od.laeuft) return {code:'laeuft'};
  od.laeuft = true;
  try {
    const e = await odEintrag('kontakte.json');
    if (!erzwingen && od.marke && e.eTag && e.eTag !== od.marke)
      return {code:'konflikt', datum:e.lastModifiedDateTime};
    const text = JSON.stringify(odBestand(), null, 1);
    const blob = new Blob([text], {type:'application/json'});
    try {
      await odSchreiben(blob, 'application/json', 'Sicherungen', 'kontakte_' + odStempel() + '.json');
    } catch(err){ /* die Sicherung darf scheitern, das Speichern nicht blockieren */ }
    const neu = await odSchreiben(blob, 'application/json', 'kontakte.json');
    od.marke = (neu && neu.eTag) || '';
    od.dateiId = (neu && neu.id) || od.dateiId;
    od.geladenAm = new Date().toISOString();
    od.offen = false;
    odSitzungSichern();
    await odZwischenSichern();
    return {code:'ok'};
  } catch(err){
    return {code:(err && err.code) || 'fehler', text:(err && err.text) || ''};
  } finally { od.laeuft = false; }
}

// ------------------------------------------------------------------ Bilder
const odBilder = new Map();        // Pfad -> Anzeigeadresse
const odHolt = new Map();
async function odBildHolen(pfad){
  if (odBilder.has(pfad)) return odBilder.get(pfad);
  if (odHolt.has(pfad)) return odHolt.get(pfad);
  const lauf = (async () => {
    try {
      let b = await idbLesen('bilder', 'od:' + pfad);
      if (!b){
        const e = await odEintrag(pfad);
        b = await (await odInhalt(e)).blob();
        try { await idbSchreiben('bilder', 'od:' + pfad, b); } catch(err){}
      }
      const u = URL.createObjectURL(b);
      odBilder.set(pfad, u);
      return u;
    } catch(e){ odBilder.set(pfad, ''); return ''; }
    finally { odHolt.delete(pfad); }
  })();
  odHolt.set(pfad, lauf);
  return lauf;
}

// Bildpfade der Datensätze
function odLogoPfad(o){
  if (o && o.logo) return 'Logos/' + o.logo;
  const fa = o && o.firmaId ? S.firmen.get(o.firmaId) : null;
  if (fa && fa.logo) return 'Logos/' + fa.logo;
  if (o && o.karten && o.karten[0]) return 'Kartenbilder/' + o.karten[0];
  return '';
}
// Liefert entweder ein fertiges src oder eine Marke zum Nachladen
function bildAttr(pfad){
  if (!pfad) return 'alt="" style="visibility:hidden"';
  const c = odBilder.get(pfad);
  if (c) return 'src="' + esc(c) + '" alt=""';
  if (c === '') return 'alt="" style="visibility:hidden"';
  return 'data-od="' + esc(pfad) + '" alt=""';
}

// Bilder der sichtbaren Zeilen nachladen
let odSpaeher = null;
function odBilderNachladen(wurzel){
  const alle = (wurzel || document).querySelectorAll('img[data-od]');
  if (!alle.length) return;
  if (!odAngemeldet()) return;
  const laden = async el => {
    const p = el.dataset.od; if (!p) return;
    el.removeAttribute('data-od');
    const u = await odBildHolen(p);
    if (u) el.src = u; else el.style.visibility = 'hidden';
  };
  if (!('IntersectionObserver' in window)){ alle.forEach(laden); return; }
  if (!odSpaeher) odSpaeher = new IntersectionObserver(eintraege => {
    eintraege.forEach(e => { if (e.isIntersecting){ odSpaeher.unobserve(e.target); laden(e.target); } });
  }, {root: document.getElementById('inhalt'), rootMargin:'300px'});
  alle.forEach(el => odSpaeher.observe(el));
}

// ------------------------------------------------------------------ Fotos hochladen
function odDateiname(k, art){
  const rein = s => (s||'').normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/ß/g,'ss').replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,28);
  return [k ? k.id : 'Neu', rein(k ? k.nachname : '') || 'Foto', art || 'Foto',
          odStempel()].filter(Boolean).join('_') + '.jpg';
}
async function odFotoHoch(blob, name){
  const e = await odSchreiben(blob, 'image/jpeg', 'Kartenbilder', name);
  return e && e.name ? e.name : name;
}

function odKlartext(err){
  const c = (err && err.code) || '';
  if (c === 'keine_id') return 'Es ist noch keine Anwendungskennung eingetragen.';
  if (c === 'nicht_angemeldet') return 'Die Anmeldung ist abgelaufen. Bitte neu anmelden.';
  if (c === 'anmeldung') return 'Microsoft hat die Anmeldung abgelehnt: ' + (err.text || '');
  if (c === 'konflikt') return 'Die Datei wurde zwischenzeitlich am Rechner geändert.';
  if (c === 'http_404') return 'Die Datei wurde im angegebenen Ordner nicht gefunden.';
  if (c === 'http_403') return 'Für diesen Ordner fehlt die Berechtigung.';
  if (c && c.startsWith('http_')) return 'Microsoft meldet ' + c.slice(5) + '.';
  return 'Keine Verbindung zu OneDrive.';
}

// ====================================================================== OneDrive
// Brücke zwischen der Rechner-Oberfläche (sie arbeitet auf D) und OneDrive.
// Die Schicht darunter, od.js, kümmert sich um Anmeldung und Microsoft Graph.
// Hier steht nur, was die grosse Oberfläche zusätzlich braucht: Laden in D,
// Speichern aus D, Konfliktprüfung und Sicherungskopie.

const WEB = {marke: '', geladenAm: '', laeuft: false, hinweis: ''};
const LS_WEB = 'esp_kontakte_web_stand';

function webStempel(d){
  const z = n => String(n).padStart(2, '0');
  d = d || new Date();
  return d.getFullYear() + z(d.getMonth() + 1) + z(d.getDate()) + '_' +
         z(d.getHours()) + z(d.getMinutes()) + z(d.getSeconds());
}

function webStandSichern(){
  try { localStorage.setItem(LS_WEB, JSON.stringify(
        {marke: WEB.marke, geladenAm: WEB.geladenAm})); } catch(e){}
}
function webStandHolen(){
  try {
    const s = JSON.parse(localStorage.getItem(LS_WEB) || 'null');
    if (s){ WEB.marke = s.marke || ''; WEB.geladenAm = s.geladenAm || ''; }
  } catch(e){}
}

function heuteISO(){
  const d = new Date(), z = n => String(n).padStart(2, '0');
  return d.getFullYear() + '-' + z(d.getMonth() + 1) + '-' + z(d.getDate());
}

// ---------------------------------------------------------------------- Laden
async function odNachD(){
  const e = await odEintrag('kontakte.json');
  const d = await (await odInhalt(e)).json();
  if (!d || !Array.isArray(d.kontakte)) throw {code: 'keine_daten'};
  D = migrate(d);
  WEB.marke = e.eTag || '';
  WEB.geladenAm = new Date().toISOString();
  WEB.hinweis = '';
  dirty = false;
  webStandSichern();
  try { localStorage.setItem(LS, JSON.stringify(D)); } catch(err){}
  await swVersorgen();
  return D.kontakte.length;
}

// ---------------------------------------------------------------------- Speichern
// Vor dem Schreiben wird geprüft, ob die Datei seit dem Laden von anderer Seite
// verändert wurde, etwa vom Handy. Ist das so, wird nicht überschrieben, sondern
// gefragt. Davor geht immer eine datierte Kopie nach Sicherungen.
async function odAusD(erzwingen){
  const e = await odEintrag('kontakte.json');
  if (!erzwingen && WEB.marke && e.eTag && e.eTag !== WEB.marke)
    throw {code: 'konflikt'};

  try {
    const alt = await (await odInhalt(e)).blob();
    await odSchreiben(alt, 'application/json', 'Sicherungen',
                      'kontakte_' + webStempel() + '.json');
  } catch(err){
    // Eine fehlende Sicherung ist ein Grund, nicht zu schreiben
    throw {code: 'sicherung', text: (err && (err.code || err.message)) || ''};
  }

  D.gespeichert = heuteISO();
  const txt = JSON.stringify(D, null, 1);
  const neu = await odSchreiben(new Blob([txt], {type: 'application/json'}),
                                'application/json', 'kontakte.json');
  WEB.marke = (neu && neu.eTag) || '';
  WEB.geladenAm = new Date().toISOString();
  dirty = false;
  webStandSichern();
  try { localStorage.setItem(LS, JSON.stringify(D)); } catch(err){}
  return D.kontakte.length;
}

// ---------------------------------------------------------------------- Ordner
// Listet die Dateien eines Unterordners. Fehlt der Ordner, wirft Graph 404,
// das faengt der Aufrufer ab und zeigt eine leere Liste.
async function odKinder(...teile){
  const d = await odGraph(odWurzel(...teile) + ':/children?$top=200');
  return (d && d.value) || [];
}

// ---------------------------------------------------------------------- Bilder
// Logos, Kartenbilder und Formulare liegen in OneDrive. Damit die ganze
// Oberfläche unverändert mit ihren einfachen Pfaden arbeiten kann, fängt ein
// Dienstprogramm im Browser (sw.js) diese Anfragen ab und holt sie über Graph.
// Es braucht dafür das Zugangsmerkmal, das wir ihm hier zuschieben.
async function swVersorgen(){
  try {
    if (!navigator.serviceWorker || !navigator.serviceWorker.controller) return false;
    const z = await odZugang();
    navigator.serviceWorker.controller.postMessage(
      {art: 'od', zugang: z, ordner: od.ordner});
    return true;
  } catch(e){ return false; }
}

// Das Merkmal läuft nach einer Stunde ab, darum regelmässig nachschieben
setInterval(() => { if (odAngemeldet()) swVersorgen(); }, 4 * 60 * 1000);

function swBilderWeg(){
  try {
    if (navigator.serviceWorker && navigator.serviceWorker.controller)
      navigator.serviceWorker.controller.postMessage({art: 'bilderWeg'});
  } catch(e){}
}

function migrate(d){
  d.firmen ||= []; d.kontakte ||= []; d.meetings ||= [];
  d.quellen ||= []; d.bereiche ||= []; d.meetingarten ||= [];
  d.kontakte.forEach(k => { k.karten ||= []; k.kommentar ||= ''; k.details ||= '';
    k.geburtstag ||= ''; k.quelle ||= ''; k.erfasstAm ||= heute(); k.kennengelerntAm ||= '';
    k.logo ||= ''; k.bereich ||= ''; k.geprueft ||= false; k.geprueftAm ||= '';
    k.abgleichIgnoriert ||= false; k.fotos ||= []; k.verlauf ||= []; });
  d.dublettenIgnoriert ||= [];
  d.papierkorb ||= [];
  // Laendernamen immer auf Deutsch, siehe landDeutsch()
  if (typeof landDeutsch === 'function'){
    d.kontakte.forEach(k => { k.land = landDeutsch(k.land); });
    d.firmen.forEach(f => { f.land = landDeutsch(f.land);
      (f.standorte || []).forEach(s => { s.land = landDeutsch(s.land); }); });
  }
  d.firmen.forEach(f => { f.kommentar ||= ''; f.logo ||= ''; f.standorte ||= [];
    f.mail ||= ''; f.tel ||= ''; f.karten ||= [];
    f.standorte.forEach(s => { s.bez ||= ''; s.strasse ||= ''; s.plz ||= ''; s.ort ||= '';
      s.land ||= ''; s.maps ||= ''; }); });
  d.meetings.forEach(m => { m.aktionen ||= []; m.kontaktIds ||= []; m.firmaId ||= '';
    m.notizen ||= ''; m.art ||= ''; m.ort ||= ''; m.teilnehmer ||= ''; m.bilder ||= []; });
  return d;
}

async function odLadenKlick(still){
  if (!odAngemeldet()){ odEinstellungenZeigen(); toast('Bitte zuerst anmelden'); return; }
  if (!still && dirty && !confirm('Es gibt ungespeicherte Änderungen. Wirklich neu laden?')) return;
  WEB.laeuft = true; statusZeile();
  try {
    const n = await odNachD();
    sel.kontakte = sel.firmen = sel.meetings = null;
    render(); toast(n + ' Kontakte aus OneDrive geladen');
  } catch(e){
    toast(odKlartext(e));
    // Haben sich die angeforderten Rechte erweitert, traegt das gespeicherte
    // Erneuerungsmerkmal sie nicht und Microsoft weist es ab. Dann muss die
    // Anmeldung einmal neu gemacht werden, und das soll man auch sehen.
    if (e && e.code === 'nicht_angemeldet'){
      odStandZeigen();
      const b = $('#odBlock');
      if (b && b.style.display === 'none') odEinstellungenZeigen();
    }
  }
  WEB.laeuft = false; statusZeile();
}

async function odSpeichernKlick(erzwingen){
  if (!odAngemeldet()){ odEinstellungenZeigen(); toast('Bitte zuerst anmelden'); return; }
  WEB.laeuft = true; statusZeile();
  try {
    await odAusD(erzwingen);
    statusZeile(); toast('In OneDrive gespeichert');
  } catch(e){
    if (e && e.code === 'konflikt'){
      if (confirm('Die Datei wurde seit dem Laden verändert, vermutlich am Handy.\n\n'
                + 'OK: deinen Stand trotzdem schreiben und den anderen überschreiben.\n'
                + 'Abbrechen: nichts tun, dann kannst du neu laden.'))
        { WEB.laeuft = false; return odSpeichernKlick(true); }
      toast('Nicht gespeichert');
    } else if (e && e.code === 'sicherung'){
      toast('Die Sicherungskopie liess sich nicht anlegen, darum wurde nichts geschrieben');
    } else {
      toast(odKlartext(e));
    }
  }
  WEB.laeuft = false; statusZeile();
}

function download(name, txt, mime){
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([txt], {type:mime})); a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}
function csvExport(liste, dateiname){
  const sp=';', cols=['id','titel','vorname','nachname','funktion','firma','strasse','plz','ort','land',
    'tel','mobil','fax','mail','web','linkedin','maps','bereich','quelle','erfasstAm','kennengelerntAm',
    'geburtstag','details','kommentar','geprueft','geprueftAm'];
  const z=[cols.join(sp)];
  (liste && liste.length ? liste : D.kontakte)
    .forEach(k=>z.push(cols.map(c=>'"'+String(k[c]??'').replace(/"/g,'""')+'"').join(sp)));
  download(dateiname || 'kontakte.csv', '﻿'+z.join('\r\n'), 'text/csv');
}

  const q = $('#mq').value, b = $('#mb').value, g = $('#mg').checked;
  const arr = sichtbareKontakte();
  if (!q && !b && !g) return toast('Nichts ausgewählt');
  if (!confirm(arr.length + ' Kontakte ändern?')) return;
  arr.forEach(k => {
    if (q) k.quelle = q;
    if (b) k.bereich = b;
    if (g && !k.geprueft){ k.geprueft = true; k.geprueftAm = heute(); }
  });
  massenZu(); persist(); render();
  toast(arr.length + ' Kontakte zugeordnet');
}

function passt(txt){ return !filt.q || txt.toLowerCase().includes(filt.q.toLowerCase()); }

function sichtbareKontakte(){
  return D.kontakte.filter(k => {
    const f = firmaVon(k);
    const t = [nameVon(k), k.firma, f?f.name:'', k.ort, k.mail, k.funktion, k.bereich, k.kommentar,
               k.details, k.quelle, k.tel, k.mobil, k.strasse, k.plz, k.land,
               k.linkedin, k.web, k.id].join(' ');
    if (!passt(t)) return false;
    if (!mfPasst(filt.bereiche, k.bereich)) return false;
    if (!mfPasst(filt.quellen, k.quelle)) return false;
    if (!mfPasst(filt.laender, k.land)) return false;
    if (filt.geprueft === 'ja' && !k.geprueft) return false;
    if (filt.geprueft === 'nein' && k.geprueft) return false;
    if (filt.nurAuswahl && !auswahl.has(k.id)) return false;
    return true;
  }).sort((a,b) => (a.nachname||'').localeCompare(b.nachname||'','de'));
}

function renderList(){
  const L = $('#list');
  setTimeout(() => { const z = document.getElementById('listeZahl');
    if (z) z.textContent = L.querySelectorAll('.row').length + ' Einträge'; }, 0);
  if (tab === 'kontakte'){
    const arr = sichtbareKontakte();
    L.innerHTML = arr.length ? arr.map(k => {
      const n = meetingsVonKontakt(k.id).length;
      return `<div class="row ${sel.kontakte===k.id?'on':''}" onclick="waehle('${k.id}')">
        <input type="checkbox" class="mark" ${auswahl.has(k.id)?'checked':''}
          title="für Export und Dokument markieren"
          onclick="event.stopPropagation()" onchange="markiere('${k.id}',this.checked)">
        ${bild(k)?`<img src="${esc(bild(k))}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`:'<img alt="" style="visibility:hidden">'}
        <div><div class="nm">${k.geprueft?'<span class="haken" title="geprüft und bestätigt">✓ </span>':''}${esc(nameVon(k)||'(ohne Name)')}</div>
        <div class="sub">${esc([k.firma,k.ort].filter(Boolean).join(' · '))}</div></div>
        <div class="rgt">${esc(k.bereich||'')}${k.quelle?`<br>${esc(k.quelle)}`:''}${n?`<br>${n} Protokoll${n>1?'e':''}`:''}</div></div>`;
    }).join('') : '<div class="empty">Keine Treffer</div>';
  } else if (tab === 'firmen'){
    const arr = D.firmen.filter(f => passt([f.name,f.ort,f.land,f.bereich,f.kommentar,f.mail].join(' ')))
      .filter(f => !filt.abgleich ||
        D.kontakte.some(k => k.firmaId===f.id && abgleichOffen(k)))
      .sort((a,b)=>a.name.localeCompare(b.name,'de'));
    L.innerHTML = arr.length ? arr.map(f => {
      const pk = D.kontakte.filter(k=>k.firmaId===f.id);
      const p = pk.length;
      const luecken = pk.reduce((n,k)=>n+abgleichOffen(k),0);
      return `<div class="row ${sel.firmen===f.id?'on':''}" onclick="waehle('${f.id}')">
        ${bildFirma(f)?`<img src="${esc(bildFirma(f))}" alt="" loading="lazy" onerror="this.style.visibility='hidden'">`:'<img alt="" style="visibility:hidden">'}
        <div><div class="nm">${esc(f.name)}</div>
        <div class="sub">${esc([f.ort,f.land].filter(Boolean).join(' · '))}</div></div>
        <div class="rgt">${p} Person${p!==1?'en':''}<br>${meetingsVonFirma(f.id).length} Protokolle
        ${luecken?`<br><span class="tag off">${luecken} Abgleich</span>`:''}</div></div>`;
    }).join('') : '<div class="empty">Keine Treffer</div>';
  } else if (tab === 'meetings'){
    const arr = D.meetings.filter(m => {
      if (!passt([m.titel,m.notizen,m.teilnehmer,m.ort,m.art].join(' '))) return false;
      if (filt.ohneZuordnung && (m.firmaId || (m.kontaktIds||[]).length)) return false;
      return true;
    }).sort((a,b)=>(b.datum||'').localeCompare(a.datum||''));
    L.innerHTML = arr.length ? arr.map(m => {
      const fn = (D.firmen.find(f=>f.id===m.firmaId)||{}).name || '';
      const pers = (m.kontaktIds||[]).map(id=>{const k=kontaktVon(id);return k?nameVon(k):'';}).filter(Boolean);
      const o = offeneAktionen(m);
      return `<div class="row ${sel.meetings===m.id?'on':''}" onclick="waehle('${m.id}')">
        <div><div class="nm">${esc(m.titel||'(ohne Titel)')}</div>
        <div class="sub">${esc([m.datum,m.art,fn||pers.join(', ')||'nicht zugeordnet'].filter(Boolean).join(' · '))}</div></div>
        <div class="rgt">${o?`<span class="tag off">${o} offen</span>`:''}</div></div>`;
    }).join('') : '<div class="empty">Noch keine Protokolle</div>';
  } else if (tab === 'listen'){
    L.innerHTML = Object.keys(LISTEN).map(s => {
      const c = LISTEN[s];
      return `<div class="row ${sel.listen===s?'on':''}" onclick="waehle('${s}')">
        <div><div class="nm">${esc(c.titel)}</div>
        <div class="sub">${esc(c.hinweis)}</div></div>
        <div class="rgt">${D[s].length} Einträge</div></div>`;
    }).join('');
  } else {
    const zeilen = [];
    D.meetings.forEach(m => (m.aktionen||[]).forEach((a,i) => {
      if (a.erledigt) return;
      if (!passt([a.text,a.wer,m.titel].join(' '))) return;
      zeilen.push({m,a,i});
    }));
    zeilen.sort((x,y)=>(x.a.faellig||'9999').localeCompare(y.a.faellig||'9999'));
    L.innerHTML = zeilen.length ? zeilen.map(z =>
      `<div class="row" onclick="setTab('meetings');waehle('${z.m.id}')">
        <div><div class="nm">${esc(z.a.text||'(ohne Text)')}</div>
        <div class="sub">${esc([z.m.titel,z.m.datum].filter(Boolean).join(' · '))}</div></div>
        <div class="rgt">${esc(z.a.wer||'')}${z.a.faellig?'<br>fällig '+esc(z.a.faellig):''}</div></div>`
    ).join('') : '<div class="empty">Keine offenen Aktionen</div>';
  }
}

function waehle(id){
  if (tab === 'aktionen'){ sel.meetings = id; }
  else sel[tab] = id;

}

const LISTEN = {
  quellen:      {titel:'Quellen', feld:'quelle',  wo:['kontakte'],
                 hinweis:'Wo ein Kontakt entstanden ist'},
  bereiche:     {titel:'Geschäftsbereiche', feld:'bereich', wo:['kontakte','firmen'],
                 hinweis:'Branche von Person und Firma'},
  meetingarten: {titel:'Arten von Protokollen', feld:'art', wo:['meetings'],
                 hinweis:'Messegespräch, Besuch, Telefonat und weitere'}
};
function listeZaehlen(s, wert){
  const c = LISTEN[s];
  return c.wo.reduce((n, w) => n + D[w].filter(x => x[c.feld] === wert).length, 0);
}
function listeUmbenennen(s, alt, neu){
  neu = (neu||'').trim();
  if (!neu || neu === alt) return false;
  const c = LISTEN[s], doppelt = D[s].includes(neu);
  if (doppelt && !confirm('"'+neu+'" gibt es bereits. Beide Einträge zusammenführen?')) return false;
  c.wo.forEach(w => D[w].forEach(x => { if (x[c.feld] === alt) x[c.feld] = neu; }));
  if (doppelt) D[s] = D[s].filter(x => x !== alt);
  else D[s][D[s].indexOf(alt)] = neu;
  ['bereich','quelle'].forEach(f => { if (filt[f] === alt) filt[f] = neu; });
  persist(); render();
  toast(doppelt ? 'Einträge zusammengeführt' : 'Umbenannt, alle Zuordnungen nachgeführt');
  return true;
}
function listeNeu(s){
  const n = (prompt('Neuer Eintrag in der Liste "'+LISTEN[s].titel+'":')||'').trim();
  if (!n) return;
  if (D[s].includes(n)) return toast('Gibt es schon');
  D[s].push(n); persist(); render();
}
function listeWeg(s, i){
  const wert = D[s][i];
  if (wert === undefined) return;
  const n = listeZaehlen(s, wert);
  if (!confirm(n ? 'Eintrag löschen? Bei '+n+' Datensätzen wird die Zuordnung entfernt.'
                 : 'Eintrag löschen?')) return;
  const c = LISTEN[s];
  c.wo.forEach(w => D[w].forEach(x => { if (x[c.feld] === wert) x[c.feld] = ''; }));
  D[s] = D[s].filter(x => x !== wert);
  persist(); render();
}
function listeSchieben(s, i, d){
  const j = i + d;
  if (j < 0 || j >= D[s].length) return;
  const a = D[s]; [a[i], a[j]] = [a[j], a[i]];
  persist(); renderDetail();
}

function dokumentBauen(){
  const g = id => document.getElementById(id);
  if (g('dkTitel')){
    DOK.titel = g('dkTitel').value.trim() || 'Kontaktzusammenstellung';
    DOK.anlass = g('dkAnlass').value.trim();
    DOK.nurOffen = g('dkOffen').checked;
    DOK.form     = g('dkForm').value;
    if (g('dkSeite')){
      DOK.proSeite = g('dkSeite').checked;
      DOK.notizen  = g('dkNotiz').checked;
      DOK.karten   = g('dkKarte').checked;
    }
  }
  const dlg = g('dokDialog'); if (dlg) dlg.remove();
  const arr = auswahlKontakte();
  if (!arr.length) return toast('Keine Kontakte markiert');

  const inhalt = DOK.form === 'kompakt'
    ? dkDeckblatt(arr, DOK) + dkKompakt(arr, DOK)
    : dkDeckblatt(arr, DOK)
      + arr.map((k,i) => dkBlatt(k, i+1, arr.length, DOK)).join('')
      + dkUebersicht(arr, DOK);

  const alt = g('druck'); if (alt) alt.remove();
  const d = document.createElement('div');
  d.id = 'druck';
  d.innerHTML = `<div class="druckbar">
      <b>Vorschau: ${arr.length} Kontakt${arr.length===1?'':'e'}</b>
      <span class="hint">Im Druckdialog "Als PDF speichern" wählen, Papierformat A4,
        Ränder auf "Standard", Hintergrundgrafiken einschalten.</span>
      <span class="spacer"></span>
      <button class="btn" onclick="window.print()">Als PDF speichern</button>
      <button class="btn ghost" onclick="druckZu()">Schliessen</button>
    </div>
    <div class="druckblatt">${inhalt}</div>`;
  document.body.appendChild(d);
  document.body.classList.add('druckmodus');
  window.scrollTo(0,0);
  if (DOK.form === 'kompakt') requestAnimationFrame(kompaktPaginieren);
}
// ---- Die Kompaktliste auf echte A4-Seiten aufteilen, damit Vorschau und PDF gleich sind
const A4H = 297*96/25.4;                       // Hoehe einer A4-Seite in Bildpunkten

function kompaktLeeresBlatt(muster){
  const b = muster.cloneNode(true);
  b.className = 'dblatt neueseite dkompaktblatt';
  b.querySelectorAll('.deyebrow, h2, .dsub, .dfuss').forEach(e => e.remove());
  const tb = b.querySelector('tbody'); if (tb) tb.innerHTML = '';
  muster.parentNode.insertBefore(b, muster.nextSibling);
  return b;
}

function kompaktPaginieren(){
  const erst = document.querySelector('#druck .dkompaktblatt');
  if (!erst) return;
  const PX = 96/25.4;
  const HOCH = 251*PX;                          // Inhaltshoehe A4 bei 2 cm Rand, mit Reserve
  const tab = erst.querySelector('table');
  const thead = tab.tHead, tbody = tab.tBodies[0];
  const fuss = erst.querySelector('.dfuss');
  const band = erst.querySelector('.dband');
  const oben = erst.getBoundingClientRect().top + 20*PX;
  const kopfH = tab.getBoundingClientRect().top - oben;
  const theadH = thead.getBoundingClientRect().height;
  const bandH = band.getBoundingClientRect().height + 6*PX;
  const fussH = fuss ? fuss.getBoundingClientRect().height + 8*PX : 0;
  const zeilen = [...tbody.rows];
  const hoehen = zeilen.map(r => r.getBoundingClientRect().height);

  // 1) grob verteilen
  const seiten = [];
  let akt = [], platz = HOCH - kopfH - theadH;
  zeilen.forEach((r,i) => {
    if (akt.length && hoehen[i] > platz){
      seiten.push(akt); akt = []; platz = HOCH - bandH - theadH;
    }
    akt.push(i); platz -= hoehen[i];
  });
  if (akt.length) seiten.push(akt);

  // 2) Blaetter bauen
  const vorlage = erst.cloneNode(true);
  const eltern = erst.parentNode;
  const gebaut = [];
  seiten.forEach((idx, s) => {
    const b = vorlage.cloneNode(true);
    b.className = 'dblatt neueseite dkompaktblatt';
    if (s > 0) b.querySelectorAll('.deyebrow, h2, .dsub').forEach(e => e.remove());
    b.querySelectorAll('.dfuss').forEach(e => e.remove());
    const tb = b.querySelector('tbody');
    tb.innerHTML = '';
    idx.forEach(i => tb.appendChild(zeilen[i].cloneNode(true)));
    eltern.insertBefore(b, erst);
    gebaut.push(b);
  });
  erst.remove();

  // 3) nachmessen und ueberzaehlige Zeilen weiterschieben, bis jedes Blatt auf eine Seite passt
  for (let i = 0; i < gebaut.length; i++){
    let wache = 0;
    while (gebaut[i].getBoundingClientRect().height > A4H + 1 && wache++ < 80){
      const tb = gebaut[i].querySelector('tbody');
      if (!tb || tb.rows.length <= 1) break;
      if (!gebaut[i+1]) gebaut.splice(i+1, 0, kompaktLeeresBlatt(gebaut[i]));
      const ntb = gebaut[i+1].querySelector('tbody');
      ntb.insertBefore(tb.rows[tb.rows.length-1], ntb.firstChild);
    }
  }

  // 4) Fusszeile ans Ende, notfalls auf ein eigenes Blatt
  if (fuss){
    let letzt = gebaut[gebaut.length-1];
    letzt.appendChild(fuss);
    if (letzt.getBoundingClientRect().height > A4H + 1){
      const b = kompaktLeeresBlatt(letzt);
      b.querySelector('table').remove();
      b.appendChild(fuss);
      gebaut.push(b);
    }
  }
}

function druckZu(){
  const d = document.getElementById('druck'); if (d) d.remove();
  document.body.classList.remove('druckmodus');
}
